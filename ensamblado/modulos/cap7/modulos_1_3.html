  <!-- MÓDULO 1 · Anatomía de una encuesta compleja                  -->
  <!-- ============================================================ -->
  <template id="module-1">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 1</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Anatomía de una encuesta
          compleja <span class="text-gray-400 font-normal text-2xl">/ Anatomy of a complex survey</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Leer la ficha técnica de dos encuestas reales y
              declarar su diseño en una línea de <code>survey</code> — con los grados de libertad correctos.</p>
          </div>
        </div>
      </div>

      <p>Los capítulos 4, 5 y 6 construyeron las piezas por separado: estratos, conglomerados, etapas, PPT, pesos.
        Una encuesta real las usa <strong>todas a la vez</strong>. Este capítulo trabaja con dos, elegidas porque
        tienen la misma anatomía y estructuras opuestas:</p>

      <div class="definition">
        <h4>Las dos encuestas del capítulo</h4>
        <p><strong>NHANES</strong> (<em>National Health and Nutrition Examination Survey</em>): la encuesta de
          salud de EE.UU., con examen físico. Estratos geográficos, condados como UPM, pesos que expanden a la
          población nacional. Es la fuente de las estadísticas oficiales de obesidad, colesterol y presión
          arterial.</p>
        <p style="margin-bottom:0;"><strong>SYC</strong> (<em>Survey of Youth in Custody</em>): jóvenes en
          centros de detención. Estratos por tipo de centro, centros como UPM. Es la encuesta con la que Lohr
          abre su capítulo 7, y su estructura es <em>opuesta</em> a la de NHANES en el número de UPM por
          estrato — una diferencia que en el módulo 5 decidirá qué métodos se pueden usar.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Anatomía comparada de NHANES y SYC">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R1⟧</code></pre>
        </div>
      </div>

      <div class="diagrama-diseno" data-diagrama="nhanes"></div>

      <p>Declarar el diseño en <code>survey</code> es una sola llamada — y es la línea de la que depende todo lo
        demás del capítulo. Fíjate en lo que devuelve <code>degf()</code>:</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="svydesign y los grados de libertad">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R2⟧</code></pre>
        </div>
      </div>

      <div class="warning">
        <p><strong>15 grados de libertad para 5 406 personas.</strong> En una encuesta compleja, los grados de
          libertad son <strong>PSU menos estratos</strong>, no $n - 1$. NHANES tiene 30 conglomerados en 15
          estratos: 15 gl, y el multiplicador del intervalo del 95 % pasa de 1,960 a <strong>2,131</strong> — un
          9 % más ancho antes de tocar nada más. SYC, con 861 centros, tiene 845 gl y prácticamente el valor
          normal. Cualquier software que reporte «gl = n − 1» sobre datos de encuesta está equivocándose.</p>
      </div>

      <div class="simulador" data-simulador="anatomia">
        <h4><i class="fas fa-diagram-project" aria-hidden="true"></i> Las dos encuestas, lado a lado</h4>
        <p class="simulador-intro">Las barras son las PSU por estrato de cada encuesta. NHANES es un peine
          perfecto de 2; SYC va de 7 a 154. Cambia de encuesta y mira la lectura: mismo tipo de diseño, dos
          mundos en grados de libertad y en qué métodos de varianza admiten (módulo 5).</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Conglomerados (PSU) por estrato</p>
        <div class="grafico-wrapper" style="height:240px;">
          <canvas aria-label="Número de conglomerados en cada estrato de las dos encuestas" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="note">
        <p><strong>Filtrar antes de analizar, con criterio.</strong> NHANES trae <code>-9</code> como código de
          faltante y <code>wtmec2yr = 0</code> para quienes solo respondieron la entrevista pero no pasaron por
          el examen físico. El material analiza adultos examinados con IMC válido: 5 406 de 9 971. Filtrar por
          peso cero no es descartar datos — es respetar que ese subconjunto tiene su propio peso, cero, porque
          no representa a nadie en esa medición.</p>
      </div>

      <div class="references">
        <h3><i class="fas fa-book-open mr-2" aria-hidden="true"></i>Para ampliar este módulo</h3>

          <li>Lohr — cap. 7 (ambas ediciones), §7.1: el ejemplo de SYC abre el capítulo.</li>

  <!-- MÓDULO 2 · Los pesos: de diseño, de ajuste y finales          -->
  <!-- ============================================================ -->
  <template id="module-2">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 2</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Los pesos muestrales
          <span class="text-gray-400 font-normal text-2xl">/ Survey weights</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Entender de qué tres factores se compone el peso
              final de una encuesta y medir cuánto cuesta que los pesos sean desiguales.</p>
          </div>
        </div>
      </div>

      <p>El peso de una fila de NHANES vale 242 386: esa persona «habla por» 242 386 estadounidenses. Ese número
        no sale de un solo sitio — es un producto de tres correcciones sucesivas:</p>

      <div class="formula">
        <p class="formula-titulo">La descomposición del peso final</p>
        $$w_k = \underbrace{\frac{1}{\pi_k}}_{\text{de diseño}} \times
        \underbrace{\frac{1}{\hat{\phi}_k}}_{\text{ajuste por no respuesta}} \times
        \underbrace{g_k}_{\text{calibración}}$$
        <p style="margin-bottom:0;">El <strong>peso de diseño</strong> $1/\pi_k$ es el de los capítulos 2 a 6:
          puro producto de las etapas del sorteo. El <strong>ajuste por no respuesta</strong> divide por la
          propensión estimada a responder (capítulo 8). El <strong>factor de calibración</strong> $g_k$ cuadra
          los totales con los del censo (módulo 6). El archivo publicado trae solo el producto, y con él hay que
          apañarse.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Distribución de los pesos y el deff de Kish">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R3⟧</code></pre>
        </div>
      </div>

      <div class="simulador" data-simulador="pesos">
        <h4><i class="fas fa-weight-hanging" aria-hidden="true"></i> La distribución de los pesos</h4>
        <p class="simulador-intro">Los histogramas reales de las dos encuestas. NHANES tiene pesos de 5 157 a
          242 387 (razón 47 a 1); SYC, de 5 a 50 (razón 10 a 1). El deslizador cambia de encuesta; la lectura da
          el <strong>deff de Kish</strong>, que mide lo que cuesta esa desigualdad — y solo esa, sin
          conglomerados ni estratos.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Distribución de los pesos finales</p>
        <div class="grafico-wrapper" style="height:250px;">
          <canvas aria-label="Histograma de los pesos finales de la encuesta elegida" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="definition">
        <h4>Efecto de diseño de Kish (solo por pesos)</h4>
        <p style="margin-bottom:0;">$$\text{deff}_{\text{Kish}} = 1 + \frac{s_w^2}{\bar{w}^2} =
        \frac{n \sum w_k^2}{\left(\sum w_k\right)^2}$$
        Mide cuánta varianza extra cuesta que los pesos no sean iguales, <em>ignorando</em> la estructura del
        diseño. En NHANES vale 1,89: la desigualdad de pesos, por sí sola, cuesta un 89 % de varianza. Es
        <strong>una</strong> de las tres fuentes; el módulo 3 mide las tres juntas y da 7,12.</p>
      </div>

      <div class="warning">
        <p><strong>La suma de los pesos es una estimación, no un dato.</strong> Los pesos de NHANES suman
          231 785 870: eso <em>estima</em> la población adulta de EE.UU., con su propio error. Que el número
          salga «redondo y creíble» no lo convierte en un censo. Y al revés: si la suma de pesos se aleja mucho
          de un total conocido, hay algo mal en el archivo o en el filtrado — es la primera comprobación que se
          hace al abrir una encuesta ajena.</p>
      </div>

      <div class="references">
        <h3><i class="fas fa-book-open mr-2" aria-hidden="true"></i>Para ampliar este módulo</h3>
        <ul style="margin-bottom:0;">
          <li>Lohr — §7.2 y §7.5: construcción de pesos y su interpretación.</li>
          <li>Gutiérrez — §10.1: pesos de diseño frente a pesos calibrados.</li>
          <li>Este material — cap. 6, módulo 9: los pesos de dos etapas y el diseño autoponderado.</li>
        </ul>
      </div>
    </div>
  </template>

  <!-- MÓDULO 3 · DEFF y tamaño de muestra efectivo                  -->
  <!-- ============================================================ -->
  <template id="module-3">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 3</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">DEFF y tamaño de muestra
          efectivo <span class="text-gray-400 font-normal text-2xl">/ Design effect</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Descomponer el efecto de diseño en sus tres
              fuentes y descubrir que no se acumulan en la misma dirección.</p>
          </div>
        </div>
      </div>

      <p>El <strong>efecto de diseño</strong> ya apareció en los capítulos 4 y 5 midiendo una cosa cada vez.
        Aquí mide el diseño entero: cuánta varianza tiene la encuesta real frente a la que tendría un MAS del
        mismo tamaño.</p>

      <div class="formula">
        <p class="formula-titulo">DEFF y tamaño efectivo</p>
        $$\text{deff} = \frac{V_{\text{diseño}}(\hat\theta)}{V_{\text{MAS}}(\hat\theta)}, \qquad
        n_{\text{ef}} = \frac{n}{\text{deff}}$$
        <p style="margin-bottom:0;">$n_{\text{ef}}$ es el tamaño de un MAS que daría la misma precisión: la
          traducción honesta del tamaño de la encuesta a «datos independientes equivalentes».</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="El deff completo y el error estándar ingenuo">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R4⟧</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">⟦P1⟧</code></pre>
        </div>
      </div>

      <p>¿De dónde salen esos 7,12? Se añade un ingrediente del diseño a la vez y se mira la varianza:</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Descomposición acumulada del deff">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R5⟧</code></pre>
        </div>
      </div>

      <div class="simulador" data-simulador="deff-acumulado">
        <h4><i class="fas fa-layer-group" aria-hidden="true"></i> El deff, ingrediente a ingrediente</h4>
        <p class="simulador-intro">Las cuatro barras son la varianza real de la media del IMC según cuánto del
          diseño se declare. El deslizador avanza por la cadena: MAS ideal → + pesos desiguales → + estratos →
          + conglomerados. La lectura da el deff acumulado y el tamaño efectivo en cada punto. Vigila el paso
          de los estratos.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Varianza de la media del IMC según los componentes declarados</p>
        <div class="grafico-wrapper" style="height:250px;">
          <canvas aria-label="Varianza acumulada al añadir cada componente del diseño" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="warning">
        <p><strong>El deff no se acumula en una sola dirección.</strong> Los pesos desiguales multiplican la
          varianza por 1,73. Los estratos la <strong>bajan</strong> (1,73 → 1,71): es exactamente su trabajo,
          el del capítulo 4. Y los conglomerados la cuadruplican (1,71 → 6,92): el capítulo 5 avisó de que este
          sería el ingrediente caro. Un «deff de 7» no es un número monolítico: es una suma de fuerzas, y solo
          descomponiéndolo se sabe dónde intervenir. El módulo 8 aplica exactamente esta lectura al recorte de
          pesos, con un resultado incómodo.</p>
      </div>

      <div class="note">
        <p><strong>Dos deff que no son el mismo número.</strong> El 6,92 de la descomposición y el 7,12 que
          reporta <code>svymean(deff = TRUE)</code> difieren porque el denominador no es el mismo: la
          descomposición compara contra un MAS <em>ideal</em> (sin pesos), y <code>survey</code> contra un MAS
          <em>con estos pesos</em>. Las dos definiciones circulan en la literatura y ninguna está mal; lo que
          está mal es compararlas sin decir cuál es cuál.</p>
      </div>

      <div class="references">
        <h3><i class="fas fa-book-open mr-2" aria-hidden="true"></i>Para ampliar este módulo</h3>
        <ul style="margin-bottom:0;">
          <li>Lohr — §7.5: efecto de diseño y tamaño efectivo; Kish (1965) es la fuente original.</li>
          <li>Este material — cap. 5, módulo 4 (ICC y deff) y cap. 4, módulo 3 (la ganancia del estratificado).</li>
        </ul>
      </div>
    </div>
  </template>
