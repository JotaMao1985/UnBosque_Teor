            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>

      <p>Las dos tablas de la <strong>sección 7.3 de Portela y Villeta</strong>, traducidas a la notación de este
        material. Cada columna es <em>qué se quiere estimar</em>: la razón, la media o el total. Se leen en
        vertical: elegida la columna, la fila da el estimador, su varianza y cómo estimarla.</p>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>Todo esto vale bajo muestreo aleatorio simple, y solo ahí.</strong>
          Las fórmulas suponen m.a.s. sin reposición y no llevan $\pi_k$ por ninguna parte. Con cualquier otro
          diseño —estratificado, conglomerados, probabilidades desiguales— cambian, y lo que no cambia es el
          camino: linealizar y aplicar la varianza del diseño. Un formulario es un atajo para el caso que ya se
          entiende, no un sustituto de entenderlo.</p>
      </div>

      <h3>Estimación de razón bajo m.a.s.</h3>

      <p>Con $f = n/N$ la fracción de muestreo, de modo que $(N-n)/(Nn) = (1-f)/n$.</p>

      <div class="tabla-ranking-marco">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Razón &nbsp; $B$</th>
              <th>Media &nbsp; $\bar y_U$</th>
              <th>Total &nbsp; $t_y = N\bar y_U$</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Estimador</strong></td>
              <td>$\hat B = \dfrac{\bar y}{\bar x}$</td>
              <td>$\hat{\bar y}_r = \hat B\,\bar x_U$</td>
              <td>$\hat t_r = N\,\hat{\bar y}_r = \hat B\,t_x$</td>
            </tr>
            <tr>
              <td><strong>Varianza</strong></td>
              <td>$V(\hat B) \simeq \dfrac{1-f}{n\,\bar x_U^{2}}\left(S_y^{2} + B^{2}S_x^{2} - 2B\,S_{xy}\right)$</td>
              <td>$\bar x_U^{2}\,V(\hat B)$</td>
              <td>$N^{2}\,V(\hat{\bar y}_r)$</td>
            </tr>
            <tr>
              <td><strong>Estimador de la varianza</strong></td>
              <td>$\hat V(\hat B) = \dfrac{1-f}{n\,\bar x^{2}}\left(s_y^{2} + \hat B^{2}s_x^{2} - 2\hat B\,s_{xy}\right)$</td>
              <td>$\bar x_U^{2}\,\hat V(\hat B)$</td>
              <td>$N^{2}\,\hat V(\hat{\bar y}_r)$</td>
            </tr>
            <tr>
              <td><strong>Sesgo</strong></td>
              <td>$\operatorname{Sesgo}(\hat B) = -\dfrac{\operatorname{Cov}(\hat B, \bar x)}{\bar x_U}$</td>
              <td>$\bar x_U\operatorname{Sesgo}(\hat B)$</td>
              <td>$N\,\bar x_U\operatorname{Sesgo}(\hat B)$</td>
            </tr>
            <tr>
              <td><strong>Aproximación al sesgo</strong></td>
              <td>$\dfrac{-\operatorname{Cov}(\bar y, \bar x) + B\,V(\bar x)}{\bar x_U^{2}}$</td>
              <td>$\bar x_U\widehat{\operatorname{Sesgo}}(\hat B)$</td>
              <td>$N\,\bar x_U\widehat{\operatorname{Sesgo}}(\hat B)$</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>$\bar x_U$ arriba y $\bar x$ abajo: no es una errata.</strong> La
          varianza teórica divide por la media poblacional $\bar x_U$, que es lo único que hay antes de tener
          muestra. Al <em>estimarla</em> caben las dos: el libro deja $\bar x_U$, y este material conserva
          $\bar x$ —es decir, el factor $t_x/\hat t_{x,\pi}$ que el paso 3 de la derivación del módulo 2
          sustituyó por 1—, que es lo que hace <code>svyratio</code>. La segunda forma multiplica el error
          estándar por ese factor, que en <code>agsrs</code> vale <strong>1,0366</strong>; con la primera
          saldría algo menor. <strong>Las cifras de todo el capítulo son las de la segunda.</strong></p>
      </div>

      <p><strong>Expresiones alternativas para la varianza de la razón.</strong> Las dos primeras son la de arriba
        desarrollada; las dos segundas, la misma factorizada como una suma de residuos $y_k - Bx_k$, que es la
        forma en que el módulo 2 la presenta. Las dos de abajo están en la forma del libro: para llegar a las
        cifras del capítulo hay que multiplicar la estimada por $(t_x/\hat t_{x,\pi})^{2}$:</p>

      <div class="formula">
        $$V(\hat{\bar y}_r) = \frac{1-f}{n}\cdot\frac{1}{N-1}\sum_{k \in U}\left(y_k^{2} + B^{2}x_k^{2} - 2B\,x_k y_k\right)
          \;=\; \frac{1-f}{n}\cdot\frac{1}{N-1}\sum_{k \in U}\left(y_k - B\,x_k\right)^{2}$$
      </div>
      <div class="formula">
        $$\hat V(\hat{\bar y}_r) = \frac{1-f}{n}\cdot\frac{1}{n-1}\sum_{k \in s}\left(y_k^{2} + \hat B^{2}x_k^{2} - 2\hat B\,x_k y_k\right)
          \;=\; \frac{1-f}{n}\cdot\frac{1}{n-1}\sum_{k \in s}\left(y_k - \hat B\,x_k\right)^{2}$$
      </div>

      <h3>Estimación de regresión</h3>

      <div class="tabla-ranking-marco">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Media &nbsp; $\bar y_U$</th>
              <th>Total &nbsp; $t_y = N\bar y_U$</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Estimador</strong></td>
              <td>$\hat{\bar y}_{\text{reg}} = \bar y + \hat b_1\left(\bar x_U - \bar x\right)$</td>
              <td>$\hat t_{\text{reg}} = N\,\hat{\bar y}_{\text{reg}}$</td>
            </tr>
            <tr>
              <td><strong>Varianza</strong></td>
              <td>$V(\hat{\bar y}_{\text{reg}}) = \dfrac{1-f}{n}\left(S_y^{2} + b_1^{2}S_x^{2} - 2b_1 S_{xy}\right)$</td>
              <td>$N^{2}\,V(\hat{\bar y}_{\text{reg}})$</td>
            </tr>
            <tr>
              <td><strong>Estimador de la varianza</strong></td>
              <td>$\hat V(\hat{\bar y}_{\text{reg}}) = \dfrac{1-f}{n}\,s_e^{2}$, con
                $s_e^{2} = \dfrac{1}{n-2}\displaystyle\sum_{k \in s}\big(y_k - \hat b_0 - \hat b_1 x_k\big)^{2}$</td>
              <td>$N^{2}\,\hat V(\hat{\bar y}_{\text{reg}})$</td>
            </tr>
            <tr>
              <td><strong>La pendiente</strong></td>
              <td>$\hat b_1 = \dfrac{s_{xy}}{s_x^{2}}$</td>
              <td>la misma</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p><strong>Expresiones alternativas, y las más útiles de las dos.</strong> Sustituyendo $b_1 = \rho S_y/S_x$
        en la varianza, los tres términos colapsan en uno:</p>

      <div class="formula">
        $$V(\hat{\bar y}_{\text{reg}}) = \frac{1-f}{n}\left(1 - \rho^{2}\right)S_y^{2}, \qquad\qquad
          \hat V(\hat{\bar y}_{\text{reg}}) = \frac{1-f}{n}\cdot\frac{n-1}{n-2}\left(1 - r^{2}\right)s_y^{2}$$
      </div>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>El $\frac{n-1}{n-2}$ del estimador no es un adorno.</strong>
          $(1-r^2)s_y^2$ es la suma de residuos dividida por $n-1$, y la recta gastó <em>dos</em> parámetros: el
          divisor que corresponde es $n-2$. Con $n = 300$ la diferencia es del 0,3 % y no se nota; con los
          $n_h = 13$ y $20$ del módulo 8 es del 9 % y del 6 %, y cambia el signo de una conclusión. Todas las
          cifras de regresión del capítulo llevan $n-2$.</p>
      </div>

      <p>Escrita así se lee de un vistazo: la regresión deja la varianza del m.a.s. multiplicada por
        $1 - \rho^{2}$. Con $\rho = 0$ no gana nada; con $\rho = \pm 1$ no queda varianza. Es la misma cuenta que
        el módulo 6 hace con <code>agsrs</code> y la que el módulo 8 usa para descartar la variable auxiliar en la
        región II.</p>

      <div class="note">
        <p><strong>Si lo comparas con el libro, dos cambios de letra.</strong> Portela llama $R$ a la razón
          poblacional, que aquí es $B$; y escribe $\hat{\bar y}$ para la media <em>muestral</em>, que aquí es
          $\bar y$ a secas. Su $\bar x$ es la media poblacional del auxiliar, que aquí lleva subíndice:
          $\bar x_U$. El glosario del módulo 1 cruza esta notación con la de Lohr y la de Gutiérrez; el cruce
          con Portela es el de este recuadro.</p>
        <p style="margin-bottom:0;">Un aviso de citación: el capítulo 7 del libro <strong>repite números de
          teorema</strong> —hay dos «Teorema 7.7» y dos «Corolario 7.7»—, así que conviene citarlo por sección y
          página, nunca por número.</p>
      </div>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>Lo que este formulario no trae.</strong> El estimador de
          <strong>diferencia</strong> (módulo 7) no aparece en las tablas del libro porque es el caso
          $b_1 = 1$ de la regresión: $\hat{\bar y}_d = \bar y + (\bar x_U - \bar x)$, con
          $\hat V = \frac{1-f}{n}(s_y^2 + s_x^2 - 2s_{xy})$. Tampoco el <strong>GREG</strong> ni la
          <strong>calibración</strong> (módulos 10 y 11), que son posteriores al marco del libro. Y las versiones
          <strong>separada y combinada</strong> para muestreo estratificado están en el capítulo 4.</p>
        <p style="margin-bottom:0;">Tampoco están, porque no son del capítulo 7 del libro: la <strong>media y el
          total de dominio</strong> con sus dos fórmulas según se conozca o no $N_d$ (módulo 9); la

          $\rho > \tfrac12\,\text{CV}(x)/\text{CV}(y)$ que decide entre razón y expansión (módulo 3). Cada una
          está en su módulo.</p>
