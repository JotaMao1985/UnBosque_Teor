  <template id="module-9">

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Estimación en dominios
          <span class="text-gray-400 font-normal text-2xl">/ Domain estimation</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Estimar en subpoblaciones que no se planificaron, y
              entender por qué eso convierte una media en una razón.</p>
          </div>
        </div>
      </div>

      <p>Hasta aquí se ha estimado <em>un</em> total para todo el país. Pero casi ningún informe se conforma con
        eso: se quiere el dato por región, por tamaño, por sector. De los 300 condados de la muestra,
        <strong>129</strong> tienen 600 granjas o más y <strong>171</strong> menos. Y esos dos números
        <em>no los eligió nadie</em>: salieron del sorteo. Esa es toda la diferencia con un estrato, y tiene
        consecuencias sobre la varianza.</p>

      <div class="definition">
        <h4>Dominio</h4>
        <p>Un <strong>dominio</strong> es cualquier subpoblación $U_d \subset U$ sobre la que se quiere estimar por
          separado. Eso es todo: un dominio se decide <em>al analizar</em>, no al diseñar.</p>
        <p style="margin-bottom:0;">Lo que cambia las fórmulas no es ser dominio, sino de dónde sale $n_d$. Si el
          dominio coincide con un estrato, $n_h$ lo fijó el investigador y $n_d = n_h$ es <strong>constante</strong>:
          se estima con las fórmulas del capítulo 4. Si el dominio no es un estrato, $n_d$ es
          <strong>aleatorio</strong> —depende de cuántas unidades del dominio hayan caído en la muestra— y la media
          se vuelve una razón. Un estrato, por tanto, <em>también</em> es un dominio cuando se pide su estimación
          aparte; lo que no es, es un dominio con $n_d$ aleatorio.</p>
      </div>

      <p>Esa aleatoriedad de $n_d$ tiene una consecuencia directa: la media de dominio</p>

      <div class="formula">
        $$\hat{\bar{y}}_d = \frac{\sum_{k \in s} y_k\,\delta_k}{\sum_{k \in s} \delta_k},
          \qquad \delta_k = \begin{cases}1 & k \in U_d\\ 0 & \text{si no}\end{cases}$$
      </div>

      <p>es un cociente con <strong>denominador aleatorio</strong>: es una razón, y su error estándar sale de
        linealizarla igual que en el módulo 4. El residuo linealizado es $u_k = \delta_k\,(y_k - \hat{\bar{y}}_d)$,
        y con él la varianza se escribe como la de cualquier media, bajo m.a.s.:</p>

      <div class="formula">
        $$\hat V\big(\hat{\bar{y}}_d\big) \;=\; \frac{1-f}{n}\cdot\frac{s_u^2}{(n_d/n)^2},
          \qquad s_u^2 = \frac{1}{n-1}\sum_{k \in s}\big(u_k - \bar u\big)^2$$
        <p style="margin-bottom:0;">El denominador $(n_d/n)^2$ es la fracción de la muestra que cayó en el
          dominio, elevada al cuadrado: es lo que convierte la varianza del residuo, que se calcula sobre las $n$
          unidades, en la varianza de una media calculada solo sobre $n_d$. El bloque de abajo la aplica tal cual,
          y <code>svyby</code> devuelve lo mismo.</p>
      </div>

      <p>Las dos vías coinciden hasta el último decimal impreso, lo cual confirma que <code>svyby</code> está
        haciendo exactamente la linealización de la fórmula, y no otra cosa.</p>

      <h3>El total de dominio: dos fórmulas según lo que se sepa</h3>

      <p>Con la <em>media</em> basta una fórmula. Con el <strong>total</strong> hay dos, y la que toca depende de un
        dato que el diseño no siempre tiene: <strong>$N_d$, cuántas unidades de la población hay en el dominio</strong>.</p>

      <div class="formula">
        $$\hat t_{yd} \;=\; N_d\,\hat{\bar y}_d \quad \text{si } N_d \text{ se conoce},
          \qquad\qquad
          \hat t_{yd} \;=\; \hat t_u \;=\; N\,\bar u, \quad u_k = y_k\,\delta_k, \quad \text{si no}$$
      </div>

      <p>La segunda no necesita saber nada del dominio: convierte en ceros las unidades que no le pertenecen y
        estima el total de esa variable nueva. Sale más cara, y el bloque dice cuánto: sobre el dominio de los
        condados con 600 granjas o más, el error estándar relativo pasa del <strong>6,81 %</strong> al
        <strong>9,29 %</strong>. Esa diferencia es el precio de no conocer $N_d$ —la incertidumbre sobre el tamaño
        del dominio, que entra por $s_u$ y no estaba en $s_{yd}$—.</p>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Y por qué aquí se pueden comparar las dos.</strong> Porque
          <code>agpop</code> es un censo: se puede mirar y contar los $N_d$ condados de verdad. En una encuesta
          real no se puede, y ésa es justamente la situación en la que se usa la segunda fórmula. Que los dos
          totales no coincidan —418 987 302 contra 423 564 841— no es un error de ninguna de las dos: son dos
          estimadores distintos del mismo parámetro, y ambos insesgados o casi.</p>
      </div>

      <h3>Comparar dos dominios</h3>

      <p>La pregunta que de verdad se hace un informe no es «¿cuánto vale el dominio 1?», sino «¿difieren?». Con
        <code>svycontrast</code> sobre un <code>svyby</code> guardado con <code>covmat = TRUE</code>, la diferencia
        de las dos medias sale <strong>32 752</strong> acres con error estándar <strong>36 014</strong>: mayor que
        la propia diferencia, así que estos datos <em>no</em> sostienen que los dos grupos de condados tengan
        superficies medias distintas.</p>

      <p>Lo interesante es de dónde sale ese 36 014. La covarianza estimada entre las dos medias es
        $-1{,}37\times 10^{-22}$ —cero, con ruido de coma flotante—, así que el error estándar de la diferencia es
        exactamente $\sqrt{21\,553{,}21^2 + 28\,852{,}24^2}$. No es casualidad: bajo m.a.s. cada unidad cae en un
        dominio <em>o</em> en el otro, nunca en los dos, y de ahí que las dos medias sean prácticamente
        incorreladas. Lohr lo pide demostrar en el ejercicio 26 del capítulo 4.</p>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>Ojo: eso vale para dominios disjuntos bajo m.a.s.</strong> Si los
          dominios se solapan, o si el diseño tiene conglomerados y las unidades de los dos dominios comparten
          conglomerado, la covarianza deja de ser nula y sumar varianzas subestima o exagera el error. La razón
          para usar <code>covmat = TRUE</code> no es que la covarianza valga cero: es que
          <code>svycontrast</code> la calcule y no haya que suponerlo.</p>
      </div>
