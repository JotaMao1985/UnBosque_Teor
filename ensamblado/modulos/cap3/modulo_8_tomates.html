      <p>Los siete módulos anteriores han contestado una pregunta —¿razón, regresión, diferencia o expansión?—
        suponiendo, sin decirlo, que <strong>la respuesta es una sola para toda la población</strong>. Casi nunca
        lo es. La relación entre $y$ y $x$ puede ser fuerte en una zona y no existir en otra; puede pasar por el
        origen aquí y no allá.</p>

      <p>Este módulo reproduce el <strong>ejemplo 7.9 de Portela y Villeta</strong> (pp. 235–239), que es el caso
        limpio de eso: la producción de tomates en <strong>tres regiones</strong>, con la cosecha de calabacín del
        año anterior como variable auxiliar. Los tres criterios que el capítulo ya tiene —la regla del módulo 3,
        el contraste del módulo 6 y la comparación de varianzas del módulo 7— se aplican <em>por separado</em> en
        cada región, y dan <strong>tres respuestas distintas</strong>.</p>

      <div class="note">
        <p><strong>Un préstamo del capítulo 4, y solo uno.</strong> Aquí las tres regiones son
          <strong>estratos</strong>: grupos fijados <em>al diseñar</em>, de los que se decide de antemano cuántas
          unidades se observan —$n_1 = 20$, $n_2 = 13$, $n_3 = 27$, repartidos proporcionalmente—. Es lo contrario
          de un dominio del módulo 9, donde el tamaño lo decide el sorteo.</p>
        <p style="margin-bottom:0;">De todo el aparato del estratificado, este módulo necesita
          <strong>dos cosas</strong>: que el muestreo de un estrato sea <strong>independiente</strong> del de los
          demás —de ahí sale que los totales se sumen y que <em>las varianzas también</em>— y que dentro de cada
          región el sorteo sea aleatorio simple, que es lo que autoriza a usar en ella las fórmulas del capítulo.
          El capítulo 4 construye el resto —la afijación, la razón separada y la combinada—; aquí basta con
          sumar.</p>
      </div>

      <h3>Lo que se sabe de cada región</h3>

      <p>El libro no publica los datos: publica los <strong>estadísticos por región</strong>. Eso no es una

        sigue —estimaciones, varianzas y hasta los contrastes de regresión— se reconstruye a partir de ellos.</p>

      <h3>Tres regiones, tres decisiones</h3>

      <p>Con las cuatro salidas delante, cada región se decide con el criterio que le corresponde, y las tres
        eligen cosas distintas:</p>

              <td><strong>regresión</strong></td>
            </tr>
            <tr>
              <td><strong>II</strong></td>

      <p>La región III merece leerse más despacio, porque es el <strong>teorema del módulo 7 cumpliéndose a la
        vista</strong>. Allí se demostró que $V(\hat{\bar y}_r) \ge V(\hat{\bar y}_{\text{reg}})$ con igualdad
        si y solo si $B = b_1$, es decir <em>si y solo si la recta pasa por el origen</em>. Aquí la constante es
        0,88 sobre una media de 306,92 —tres milésimas de la escala—, y en efecto $\hat B = 14{,}8271$ y
        $\hat b_1 = 14{,}7844$ casi coinciden.</p>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Cuidado al leer la tabla: 292,59 contra 304,29 no contradice al
          teorema.</strong> El teorema compara <em>varianzas verdaderas</em>, y lo que la tabla trae son dos
          <em>estimaciones</em> que ni siquiera usan el mismo divisor. La de la razón se construye con $s_x^2$,
          $s_y^2$ y $s_{xy}$, que dividen por $n_h - 1$; la de la regresión divide por $n_h - 2$, porque la recta
          gastó dos parámetros. El bloque descompone el hueco: puestas sobre el mismo divisor, las dos
          varianzas distan $\hat V_R - \hat V_{\text{reg}} = \frac{1-f_h}{n_h}\,s_x^2\,(\hat B - \hat b_1)^2
          = \mathbf{0{,}0054}$ —el cuadrado perfecto del módulo 7, con la condición de igualdad casi cumplida—, y
          los <strong>11,7035</strong> restantes son el cambio de divisor, un factor <strong>1,0400</strong> que
          con $n_h = 27$ pesa mucho más que el teorema.</p>
      </div>

      <p>Y entonces se prefiere la <strong>razón</strong>, que es el modelo más simple: una recta por el origen
        tiene un parámetro en vez de dos, y no se paga nada por ello.</p>

      <h3>Juntar las piezas</h3>

      <p>Decidido el método en cada región, el total se estima región a región y se suma. La varianza también, y
        esa es justamente la propiedad prestada del capítulo 4:</p>

      <div class="formula">
        $$\hat t \;=\; \sum_{h=1}^{3} N_h\,\hat{\bar y}_h, \qquad\qquad
          \hat V(\hat t) \;=\; \sum_{h=1}^{3} N_h^2\,\hat V(\hat{\bar y}_h)$$
      </div>

      <p>Las varianzas se suman <strong>sin términos cruzados</strong> porque los tres sorteos son independientes.
        Ésa es la licencia que permite mezclar tres estimadores distintos en una misma cuenta sin que el resultado
        sea un híbrido injustificable: cada sumando es una estimación legítima de su propio estrato, y la suma
        hereda la varianza sin más.</p>

      <p>El resultado es un total de <strong>494 774</strong> toneladas con un error estándar de
        <strong>20 051</strong> —un 4,1 %—, y una media por plantación de <strong>274,87</strong> con error
        estándar <strong>11,14</strong>.</p>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>Este estimador no es insesgado, y conviene decirlo.</strong> Uno de
          sus tres sumandos lo es —la expansión de la región II—, pero la razón y la regresión <em>no</em>: el
          módulo 4 midió ese sesgo y dio la cota que lo controla. Aquí se acepta por lo de siempre, que el error
          cuadrático medio baja mucho más de lo que el sesgo sube; y la cota del módulo 4 es evaluable en cada
          estrato por separado, con sus propios $n_h$, que son pequeños: los dos sumandos sesgados salen de
          muestras de <strong>20</strong> (región I) y <strong>27</strong> (región III). <strong>Con
          $n_h$ de dos dígitos, esa cota conviene mirarla, no darla por buena.</strong></p>
      </div>
