      <p>Un dato para abrir boca. Con la misma muestra de 300 condados del capítulo anterior —los mismos datos, sin
        recoger una observación más— el error estándar del total estimado pasa de <strong>58,2 millones</strong> de
        acres a <strong>5,54 millones</strong>. Diez veces menos error, gratis. Lo único que cambia es que el segundo
        método usa un dato que ya estaba ahí: la superficie sembrada de esos mismos condados <em>en 1987</em>, que
        el censo publica para los 3 078.</p>

      <p>Hasta aquí, el capítulo 2 construyó estimadores que solo usan lo observado en la muestra: el estimador de
        Horvitz–Thompson $\hat{t}_\pi = \sum_{k \in s} y_k/\pi_k$ y, bajo muestreo aleatorio simple, el de expansión
        $N\bar{y}$. Este capítulo añade un ingrediente nuevo, y es el que más rendimiento da por peso invertido:
        <strong>información que ya se conoce de todas las unidades de la población</strong>.</p>

      <div class="definition">
        <h4>Variable auxiliar</h4>
        <p>Una variable $x$ es auxiliar cuando se cumplen las <strong>dos</strong> condiciones a la vez:</p>
        <ol>
          <li>$x_k$ se observa en las unidades de la muestra, y</li>
          <li>su total poblacional $t_x = \sum_{k \in U} x_k$ (o su media $\bar{x}_U$) <strong>se conoce</strong>.</li>
        </ol>
        <p style="margin-bottom:0;">La segunda es la restrictiva. Es lo que limita en la práctica qué variables sirven:
          registros administrativos, censos anteriores, padrones. Si solo se tiene $x_k$ en la muestra, no hay
          información nueva que aportar.</p>
      </div>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Fíjate en lo que la definición <em>no</em> pide: $N$.</strong> El
          estimador de razón del total, $\hat{t}_r = \hat{B}\,t_x$, necesita conocer $t_x$ y nada más; el tamaño
          de la población puede ser desconocido y el estimador sigue funcionando. Piensa en un camión cargado con
          un número incierto de cestas de fresa del que se quiere saber el azúcar total: se pesa el camión —ése es
          $t_x$— y se analizan unas cuantas cestas, midiendo en cada una el azúcar ($y$) y el peso ($x$). El
          cociente azúcar/peso de la muestra, multiplicado por el peso del camión, da el total buscado <em>sin
          contar una sola cesta</em>. El estimador de expansión $N\bar{y}$ del capítulo 2 no puede hacer eso. Es la
          primera vez en el curso que un estimador se libra de $N$, y no será la última: en el
          <strong>capítulo 5</strong>, con conglomerados, no conocer el número de elementos es la situación
          normal.</p>
      </div>

      <p>El ejemplo del capítulo es el censo agrícola. Se quiere el total de superficie sembrada en 1992
        ($y = $ <code>acres92</code>), y se conoce por completo la de 1987 ($x = $ <code>acres87</code>) porque hubo un
        censo. Las dos variables miden lo mismo con cinco años de diferencia, así que la correlación es altísima.</p>

  <!-- ============================================================ -->
  <template id="module-2">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 2</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">El estimador de razón
          <span class="text-gray-400 font-normal text-2xl">/ Ratio estimation</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Construir $\hat{t}_r$, calcular su error estándar por
              dos vías y entender de dónde sale la ganancia.</p>
          </div>
        </div>
      </div>

      <div class="definition">
        <h4>La razón poblacional y su estimador</h4>
        <p>El parámetro es el cociente de dos totales:</p>
        <p style="text-align:center;">$$B = \frac{t_y}{t_x} = \frac{\bar{y}_U}{\bar{x}_U}$$</p>
        <p>y se estima con el mismo cociente calculado sobre la muestra. En el marco $\pi$ del capítulo 2, con
          cualquier diseño:</p>
        <p style="text-align:center;">$$\hat{B} = \frac{\hat{t}_{y,\pi}}{\hat{t}_{x,\pi}} = \frac{\sum_{k \in s} y_k/\pi_k}{\sum_{k \in s} x_k/\pi_k}
          \qquad\text{y bajo MAS}\qquad \hat{B} = \frac{\bar{y}}{\bar{x}}$$</p>
        <p style="margin-bottom:0;">De ahí sale el <strong>estimador de razón del total</strong>, que es el objeto
          central del capítulo:</p>
        <p style="text-align:center;">$$\hat{t}_r = \hat{B}\, t_x$$</p>
        <p style="margin-bottom:0;">En esa fórmula <strong>no aparece $N$</strong>: al estimador de razón le hace
          falta $t_x$, no el tamaño de la población. El módulo 1 dice por qué eso no es un detalle.</p>
      </div>

      <p>La idea es sencilla y vale la pena decirla en palabras: <em>en la muestra, la superficie de 1992 fue el
        98,66 % de la de 1987; si esa proporción se mantiene en toda la población, el total de 1992 debería ser el
        98,66 % del total conocido de 1987</em>. Si haces esa cuenta a mano te saldrán unas decenas de miles de
        acres más que en la nota de abajo: el porcentaje está redondeado a dos decimales, y sobre 963 millones cada
        decimal pesa. El código usa $\hat{B}$ entero.</p>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>Antes de seguir: $\hat{B}$ no es el promedio de los cocientes.</strong>
          $\hat{B} = \bar{y}/\bar{x}$ es un cociente de dos <em>promedios</em>, no el promedio de los cocientes
          $y_k/x_k$ de cada unidad. Las dos cuentas dan números distintos y no estiman lo mismo: sobre
          <code>agsrs</code>, <strong>0,9866</strong> la primera y <strong>0,9677</strong> la segunda. El módulo 5
          dice a qué parámetro apunta cada una, y por qué esa diferencia <em>no</em> se arregla con más muestra.</p>
      </div>

      <div class="note">
        <p><strong>Qué hace el bloque de abajo, y con qué.</strong> Calcula el mismo total dos veces sobre la misma
          muestra —sin la auxiliar y con ella— para poder ponerlos uno al lado del otro. Lo hace con
          <code>survey</code>, el paquete que el capítulo 2 presentó en su módulo 5, y aquí aparecen cuatro piezas que
          conviene conocer antes de leerlo:</p>
        <ul style="margin-bottom:0.5rem;">
          <li><code>svydesign(id = ~1, fpc = rep(N, n), data = agsrs)</code> <strong>declara el diseño</strong>:
            <code>id = ~1</code> dice que no hay conglomerados —cada fila es una unidad sorteada— y <code>fpc</code>
            da el tamaño de la población, del que el paquete saca la corrección por población finita y los pesos
            $N/n$. Se guarda en <code>dis</code> y sirve para todo el capítulo.</li>
          <li><code>svytotal(~acres92, dis)</code> <strong>estima un total</strong> con esos pesos: es el estimador de
            expansión $N\bar{y}$, con su error estándar.</li>
          <li><code>svyratio(~acres92, ~acres87, dis)</code> <strong>estima la razón</strong> $\hat{B}$ —no el
            total— y su error estándar. El diseño no sabe cuánto vale $t_x$, así que el bloque multiplica a mano la
            razón y su error estándar por $t_x$: así queda a la vista que $\hat{t}_r = \hat{B}\,t_x$.</li>
          <li><code>coef()</code> y <code>SE()</code> <strong>sacan</strong> de esos objetos la estimación y su error
            estándar; <code>as.numeric()</code> les quita el nombre para poder operar con ellos.</li>
        </ul>
        <p style="margin-bottom:0;">La pestaña Python hace la parte de la razón sin ninguna función de encuestas,
          término a término: es la misma fórmula, escrita a mano.</p>
      </div>

        <div class="code-tabs-nav" role="tablist" aria-label="El estimador de razón frente al de expansión">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>

          <pre><code class="language-r">⟦R2⟧</code></pre>

      <div class="note">
        <p><strong>Lo que dice la salida.</strong> Son cinco números en dos parejas: <code>expansion</code> y
          <code>ee_expansion</code> son el total sin la auxiliar y su error estándar; <code>razon</code> y

        <ol style="margin-bottom:0;">
          <li>Las dos estimaciones caen a los lados del total real, <strong>943 951 718</strong>: la expansión da
            916 927 110, un 2,86 % por debajo; la razón, 950 520 496, un 0,70 % por encima. Ese total solo se conoce porque <code>agpop</code> es
            un censo; en una encuesta de verdad esta comparación no se puede hacer.</li>
          <li>Lo que sí se ve con la muestra sola es el error estándar: 58,2 millones la expansión y 5,54 millones la
            razón, <strong>diez veces más pequeño</strong>. Esa es la conclusión que se puede sacar de verdad: con la
            misma muestra, la auxiliar compra diez veces más precisión.</li>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ee-razon">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver de dónde sale el error estándar de $\hat{t}_r$</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ee-razon" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>$\hat{t}_r$ es un cociente, y un cociente no tiene varianza exacta manejable. Se escribe el error
                y se multiplica y divide por $\hat{t}_{x,\pi}$:</p>
              $$\hat{t}_r - t_y = \frac{t_x}{\hat{t}_{x,\pi}}\Big(\hat{t}_{y,\pi} - B\,\hat{t}_{x,\pi}\Big)$$
            </li>
            <li>
              <p>El paréntesis es el estimador $\pi$ de una variable nueva: el <strong>residuo</strong>
                $e_k = y_k - B\,x_k$. Es lineal en los $e_k$, y de eso sí se sabe la varianza.</p>
              $$\hat{t}_{y,\pi} - B\,\hat{t}_{x,\pi} = \sum_{k \in s} \frac{e_k}{\pi_k}$$
            </li>
            <li>
              <p>El factor $t_x/\hat{t}_{x,\pi}$ tiende a 1, así que se sustituye por 1: ese es el
                <strong>único</strong> paso aproximado de toda la derivación, y es el que introduce el sesgo de
                orden $1/n$ que estudia el módulo 4.</p>
              $$V(\hat{t}_r) \approx V\!\left(\sum_{k \in s} \frac{e_k}{\pi_k}\right)$$
            </li>
            <li>
              <p>Bajo MAS, esa varianza es la de siempre pero con $e_k$ en lugar de $y_k$, y al estimarla se
                sustituye $B$ por $\hat{B}$:</p>
              $$\widehat{V}(\hat{t}_r) = N^2\left(1 - \frac{n}{N}\right)\frac{s_e^2}{n},
                \qquad s_e^2 = \frac{1}{n-1}\sum_{k \in s}\big(y_k - \hat{B}x_k\big)^2$$
            </li>
            <li>
              <p>Y un detalle que cambia la cifra. El factor $t_x/\hat{t}_{x,\pi}$ que el paso 3 sustituyó por 1
                para <em>derivar</em> la varianza, al <em>estimarla</em> se puede conservar, porque la muestra lo da.
                Es lo que hacen <code>svyratio</code> y el bloque de abajo:</p>
              $$\widehat{V}(\hat{t}_r) = \left(\frac{t_x}{\hat{t}_{x,\pi}}\right)^{2}
                N^2\left(1 - \frac{n}{N}\right)\frac{s_e^2}{n}$$
              <p style="margin-bottom:0;">Aquí ese factor vale 1,0366 —es el $g$ del módulo 10—, y el error estándar
                que publica este material es el de esta segunda forma: con la primera saldría algo menor.</p>
            </li>
          </ol>
        </div>
      </div>

      <p>El bloque que sigue es la <strong>comprobación de la derivación</strong>: calcula a mano, con los residuos
        $e_k$, el error estándar de la última fórmula y lo pone al lado del que devolvió <code>svyratio</code> en el
        bloque anterior. Si la derivación está bien, las dos cifras tienen que salir iguales.</p>

        <div class="code-tabs-nav" role="tablist" aria-label="El error estándar por las dos vías">

      <p>Las dos vías dan la misma cifra hasta el último bit: la discrepancia relativa es $1{,}68 \times 10^{-16}$, que

  <!-- ============================================================ -->

        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">

      <p>«¿Cuándo gana la razón?» es media pregunta mientras no se diga <strong>contra quién</strong>. Los
        estimadores de este capítulo son todos la misma idea —ajustar una recta a la nube $(x_k, y_k)$ y apoyarse en
        ella para llevar el total conocido $t_x$ hasta el desconocido $t_y$— y lo único que los separa es
        <strong>cuánta libertad se le concede a esa recta</strong>. Son cuatro, y conviene tenerlas las cuatro
        delante antes de juzgar ninguna, aunque dos no se construyan hasta los módulos 6 y 7:</p>

      <table>
        <caption class="sr-only">Las cuatro rectas que compiten por la misma nube</caption>
        <thead>
          <tr>
            <th scope="col">Estimador</th>
            <th scope="col">La recta que traza</th>
            <th scope="col">Lo que da por supuesto</th>
            <th scope="col">Dónde se construye</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Expansión</strong> $N\bar{y}$</td>
            <td>horizontal: $y = \bar{y}$</td>
            <td>nada — no mira $x$</td>
            <td>capítulo 2</td>
          </tr>
          <tr>
            <td><strong>Razón</strong> $\hat{B}\,t_x$</td>
            <td>por el origen, con pendiente estimada $\hat{B}$</td>
            <td>si $x_k$ es cero, $y_k$ también</td>
            <td>módulo 2</td>
          </tr>
          <tr>
            <td><strong>Regresión</strong> $\hat{t}_{\text{reg}}$</td>
            <td>libre: intercepto y pendiente estimados</td>
            <td>relación lineal, no necesariamente por el origen</td>
            <td>módulo 6</td>
          </tr>
          <tr>
            <td><strong>Diferencia</strong> $\hat{t}_d$</td>
            <td>pendiente fijada en 1, sin estimar</td>
            <td>$x$ e $y$ miden lo mismo en las mismas unidades</td>
            <td>módulo 7</td>
          </tr>
        </tbody>
      </table>

      <div class="note">
        <p><strong>La tabla no ordena por calidad, sino por atrevimiento.</strong> Cada supuesto que se añade es un
          parámetro que ya no hay que estimar de la muestra: la expansión no supone nada sobre $x$ y no gana nada;
          la diferencia lo supone todo —la pendiente entera— y no estima ni un coeficiente. Un supuesto cierto se
          cobra en precisión; uno falso deja un estimador que apunta al sitio equivocado <em>y cuyo error estándar
          no se entera de ello</em>. Por eso la elección se hace mirando la nube, no la fórmula.</p>
      </div>

      <p>La razón es la segunda de la lista, y vale la pena ver de dónde sale exactamente lo que gana. El error
        estándar de $\hat{t}_r$ depende de $s_e$, la desviación de los <strong>residuos</strong> respecto de la recta
        por el origen, no de $s_y$. Todo se reduce entonces a una pregunta: ¿cuánto más pequeños son los residuos que
        los propios datos?</p>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Qué hace el bloque de abajo, y con qué.</strong> Contesta esa pregunta y
          la lleva hasta el final, en seis cifras y <strong>sin ninguna función de encuestas</strong>: las dos
          desviaciones y su reducción, el factor que esa reducción promete en varianza, y el que de verdad separa a
          los dos estimadores del total. Los dos errores estándar que compara son los del MAS del capítulo 2: el de
          la expansión es $N\sqrt{1-n/N}\,s_y/\sqrt{n}$, y el de la razón es ese mismo con $s_e$ en lugar de $s_y$
          y con $t_x/\bar{x}$ en lugar de $N$ —el <code>ee_mano</code> que el módulo 2 escribió a mano y comprobó
          contra <code>svyratio</code>—. Después de las seis cifras imprime una tabla de dos filas que sirve

          nubes que usa el simulador del final del módulo. Las dos pestañas calculan lo mismo.</p>
      </div>

      <div class="note">
        <p><strong>Lo que dice la salida.</strong> Seis cifras en tres parejas, y se leen de izquierda a derecha. La
          desviación pasa de 344 552 a 31 657: una reducción del <strong>90,8 %</strong>. Elevada al cuadrado, esa
          reducción promete un factor de <strong>118,4578</strong> en varianza. Y el factor que de verdad separa a
          los dos estimadores del total es <strong>110,2327</strong>. Tres conclusiones:</p>
        <ol style="margin-bottom:0;">
          <li>La ganancia es real y es grande: con la misma muestra, la razón tiene una varianza
            <strong>110 veces</strong> menor que la expansión. En error estándar eso son diez veces, que es justo lo
            que se vio en el módulo 2 —58,2 millones frente a 5,54—.</li>
          <li><strong>El 118 y el 110 no se contradicen; la tercera pareja dice por qué.</strong>
            <code>correccion_tx</code> es $(\hat{t}_{x,\pi}/t_x)^2 = 0{,}9306$, el inverso del cuadrado de aquel
            1,0366 del módulo 2, y multiplicar las dos columnas anteriores da la tercera: 118,4578 por 0,9306
            —con los decimales que la salida no imprime— son los 110,2327 de la derecha. La igualdad es exacta,
            no aproximada: sale de la propia definición de los dos errores estándar. Lo que
            ocurre es que la muestra <em>subestimó</em> el total de la auxiliar, el error estándar de la razón se
            corrige al alza por ello, y ahí se queda parte de la ganancia. Anunciar el cuadrado de las dos
            desviaciones como la ganancia del estimador es pasarse de optimista.</li>
          <li>Ninguna de las seis cifras necesita el total real: todas salen de la muestra sola. Esta sí es una
            conclusión que se puede sacar en una encuesta de verdad.</li>
        </ol>
      </div>

      <p>Esa es toda la historia — y el requisito para que ocurra es exigente, porque esos residuos se miden contra
        una recta obligada a pasar por el origen. Cuál de las cuatro pide cada conjunto de datos se decide así:</p>

      <div class="definition">
        <h4>Cuál pide cada nube</h4>
        <ul style="margin-bottom:0;">
          <li><strong>La razón</strong>, cuando se cumplen las tres condiciones a la vez: la relación entre $y$ y $x$
            es <strong>aproximadamente lineal y pasa por el origen</strong>; la <strong>dispersión crece con
            $x$</strong> (las unidades grandes varían más en términos absolutos), que es justo el modelo de varianza
            que la razón supone; y la correlación es alta. <strong>Cuánto</strong> de alta lo dice un umbral, y
            conviene leer con cuidado contra quién: la razón le gana <strong>a la expansión</strong> —a nadie más—
            cuando $\rho > \tfrac{1}{2}\,\text{CV}(x)/\text{CV}(y)$. En <code>agsrs</code> ese umbral vale
            <strong>0,4937</strong> frente a una correlación de <strong>0,9958</strong>: gana, y con holgura.</li>
          <li><strong>La regresión</strong> (módulo 6), cuando la nube es lineal pero <strong>el intercepto no es
            despreciable</strong>, o cuando la dispersión no crece con $x$ sino que se mantiene constante. Estima el
            intercepto en vez de imponerlo; lo que paga a cambio es un parámetro más ajustado con la misma
            muestra.</li>
          <li><strong>La diferencia</strong> (módulo 7), cuando $x$ e $y$ son <strong>la misma variable medida dos
            veces</strong> —dos censos de la misma superficie, el conteo por fotografía y el conteo en campo de las
            mismas parcelas— <em>y la nube sube con pendiente cercana a 1</em>. Ahí la pendiente no se estima —se
            sabe que vale 1—, y el estimador sale además insesgado. Esa cursiva es la mitad que decide, y conviene
            leerla despacio: las cuatro parejas de <code>agpop</code> cumplen la primera condición al pie de la
            letra, y en dos de ellas la diferencia le gana a la razón mientras que en las otras dos pierde. El
            módulo 7 lo mide y da la regla que sí separa los casos.</li>
          <li><strong>La expansión</strong>, cuando la correlación no llega al umbral de la primera línea: la
            auxiliar no paga lo que cuesta, y estimar con ella una pendiente solo añade ruido. Esto tampoco es
            retórico, y el párrafo de abajo lo enseña ocurriendo.</li>
        </ul>
      </div>

      <p>La última línea de esa tabla se suele leer por encima, así que conviene verla ocurrir. En
        <code>agpop</code> la misma variable de interés admite dos auxiliares distintas, y el desenlace es
        opuesto. Con <code>farms87</code> —el número de granjas del censo anterior— la correlación con
        <code>farms92</code> es <strong>0,9944</strong>, muy por encima de su umbral, y la razón deja el error
        estándar del total en <strong>8 801</strong> granjas frente a las <strong>82 839</strong> de la expansión:
        <strong>9,4 veces mejor</strong>. Con <code>acres87</code> —la superficie sembrada— la correlación con esa
        misma <code>farms92</code> cae a <strong>0,1539</strong> contra un umbral de <strong>0,8720</strong>, y la
        razón sube el error estándar a <strong>155 083</strong>: un <strong>87,2 % peor que no usar auxiliar
        ninguna</strong>. Una variable auxiliar no es buena o mala en abstracto; lo es <em>para la variable que se
        está midiendo</em>. Superficie y número de granjas son dos cosas distintas, y el condado enorme con cuatro
        granjas industriales lo demuestra.</p>

      <div class="derivacion">

        <div class="derivacion-panel" id="der-umbral" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Las dos varianzas, una encima de la otra, con el mismo factor delante. La de la expansión es la del
                capítulo 2; la de la razón es la aproximada del módulo 2, escrita en términos poblacionales:</p>
              $$V(\hat{\bar{y}}) = \frac{1-f}{n}\,S_y^2, \qquad
                V(\hat{\bar{y}}_r) \approx \frac{1-f}{n}\left(S_y^2 + B^2S_x^2 - 2B\,S_{xy}\right)$$
              <p style="margin-bottom:0;">La segunda es la primera <em>más dos términos</em>: $B^2S_x^2$, lo que
                cuesta apoyarse en la auxiliar, y $-2B\,S_{xy}$, lo que se gana porque vaya de la mano de $y$.</p>
            </li>
            <li>
              <p>La razón gana cuando esos dos términos suman negativo. Como $B > 0$, se puede dividir por $B$ sin
                cambiar el sentido de la desigualdad:</p>
              $$B^2S_x^2 - 2B\,S_{xy} < 0 \iff B\,S_x^2 < 2\,S_{xy}$$
            </li>
            <li>
              <p>Se sustituye $B = \bar{y}_U/\bar{x}_U$ y $S_{xy} = \rho\,S_xS_y$, y se despeja $\rho$. Los
                $S_x$ y $S_y$ se reparten entre numerador y denominador, y lo que queda son los dos coeficientes de
                variación:</p>
              $$\frac{\bar{y}_U}{\bar{x}_U}S_x^2 < 2\rho\,S_xS_y \iff
                \rho > \frac{1}{2}\cdot\frac{S_x/\bar{x}_U}{S_y/\bar{y}_U}
                     = \frac{1}{2}\cdot\frac{\text{CV}(x)}{\text{CV}(y)}$$
            </li>
            <li>
              <p>Tres cosas que leer en el resultado, y la tercera es la que más se olvida:</p>
              <ul>
                <li>Si $x$ e $y$ tienen <strong>variabilidad relativa parecida</strong>, el cociente de los dos CV
                  vale aproximadamente 1 y el umbral se queda en el $\rho > 0{,}5$ de toda la vida.</li>
                <li>El umbral es <strong>poblacional</strong>. En una encuesta se evalúa con lo que da la muestra
                  —$r$ y los $\widehat{\text{CV}}$—, que es lo que hace la tabla del bloque de arriba.</li>
                <li>La desigualdad salió de comparar con <strong>la expansión</strong>, así que eso es todo lo que
                  dice. <strong>No</strong> dice que la razón le gane a la regresión, ni a la diferencia: esas dos
                  comparaciones son otras cuentas y están en el módulo 7. Cumplir el umbral y estar usando aun así
                  el estimador equivocado es perfectamente posible — la advertencia del final de este módulo es
                  justo ese caso.</li>
              </ul>
            </li>

  <template id="module-4">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 4</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Sesgo y error cuadrático
          medio <span class="text-gray-400 font-normal text-2xl">/ Bias and MSE</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Aceptar un estimador sesgado a sabiendas, después de
              medir cuánto vale ese sesgo y qué se compra con él.</p>
          </div>
        </div>
      </div>

      <p>El estimador de razón <strong>es sesgado</strong>. No es un defecto de implementación: es una consecuencia
        matemática de que $\hat{B}$ sea un cociente de dos variables aleatorias, y la esperanza de un cociente no es
        el cociente de las esperanzas. El capítulo 1 dejó la herramienta para decidir qué hacer con eso: el error
        cuadrático medio, $\text{ECM} = \text{Sesgo}^2 + V$.</p>

      <div class="formula">
        $$\text{Sesgo}(\hat{t}_r) \;\approx\; \frac{N(1 - n/N)}{n}\cdot\frac{B\,S_x^2 - S_{xy}}{\bar{x}_U}
          \;=\; \frac{1}{n}\times(\text{algo que no depende de } n)$$
        <p style="margin-bottom:0;">En el capítulo 1 el sesgo se escribía $B(\hat\theta)$, por <em>bias</em>. Aquí
          no se puede: desde el módulo 2, $B$ es la razón poblacional $t_y/t_x$, y en esta misma fórmula aparece
          dentro del numerador. Por eso el sesgo va con todas sus letras.</p>
      </div>

      <p>El sesgo es de <strong>orden $1/n$</strong>, mientras que el error estándar es de orden $1/\sqrt{n}$. Eso
        significa que, al crecer la muestra, el sesgo desaparece <em>más rápido</em> que la variabilidad: su peso
        relativo se hace despreciable. Pero la afirmación no hay que creerla, hay que medirla.</p>

      <div class="simulador" data-simulador="sesgo-razon">
        <h4><i class="fas fa-crosshairs" aria-hidden="true"></i> El sesgo, medido con 200 000 réplicas por tamaño</h4>
        <p class="simulador-intro">Para cada tamaño se extrajeron 200 000 muestras aleatorias de <code>agpop</code>,
          se calculó $\hat{t}_r$ en cada una y se promedió. Las barras naranjas son el sesgo medido —con su
          <strong>barra de error de Monte Carlo</strong>— y las verdes, la aproximación teórica de orden $1/n$. Con
          $n = 10$ el sesgo ronda el millón y medio de acres; con $n = 300$ baja a unos 39 000, un 0,004 % del
          total. Las dos series son negativas en todos los tamaños: el estimador de razón subestima aquí.</p>
        <div class="simulador-controles"></div>
        <div class="grafico-wrapper" style="height:250px;">
          <canvas aria-label="Sesgo simulado y sesgo teórico del estimador de razón según el tamaño de muestra" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="warning">
        <p><strong>Una simulación sin barra de error no es una medición.</strong> Este material midió antes el mismo
          sesgo con 5 000 réplicas, y a partir de $n = 100$ el resultado era <em>ruido</em>: salía con signo
          contrario al teórico y era más pequeño que la propia incertidumbre con la que se había medido. El promedio

          15 900 y el sesgo por fin se distingue de cero. <strong>La regla, que vale para cualquier simulación del
          curso:</strong> antes de leer un número simulado, comprobar que es mayor que su propio error de Monte
          Carlo. El deslizador del simulador muestra esa comparación en cada tamaño.</p>
      </div>

      <div class="note">
        <p><strong>La cifra que resuelve el dilema.</strong> Con $n = 300$, el sesgo del estimador de razón vale unos

          variabilidad. Elevado al cuadrado dentro del ECM, su contribución relativa es de $3{,}0 \times 10^{-5}$.

          compromiso: es una ganga.</p>
        <p style="margin-bottom:0;">Y no confundas esos 7,11 millones con los 5,54 del módulo 2. Aquéllos son la

      <h3>¿Y si solo tengo una muestra?</h3>

      <p>Todo lo anterior se midió con <strong>200 000 muestras</strong> de una población que se conoce entera. En
        una encuesta de verdad no hay ninguna de las dos cosas: hay <em>una</em> muestra y una población que
        justamente se quiere estimar. Un módulo que deje la conversación aquí no sirve para trabajar. Y no hace
        falta: el sesgo relativo tiene una <strong>cota</strong> que se calcula con lo que da esa única muestra.</p>

      <div class="formula">
        <p style="text-align:center; margin-bottom:0.6rem;">
          $$\frac{\lvert\,\text{Sesgo}(\hat{B})\,\rvert}{\sqrt{V(\hat{B})}}
            \;\le\; \text{CV}(\hat{\bar{x}})
            \;=\; \text{CV}(x)\sqrt{\frac{1-f}{n}}$$</p>
        <p style="margin-bottom:0;">Sale de que $\lvert\text{Sesgo}(\hat{B})\rvert =
          \lvert\operatorname{cov}(\hat{B}, \hat{\bar{x}})\rvert/\bar{x}_U$ y de que una covarianza no supera
          el producto de las dos desviaciones — es decir, de $\lvert\rho\rvert \le 1$. Y es
          <strong>invariante de escala</strong>: vale igual para $\hat{B}$, para la media de razón y para
          $\hat{t}_r$, porque los tres se diferencian en una constante que se cancela arriba y abajo.</p>
      </div>

      <p>Lo que se estima de la muestra es $\widehat{\text{CV}}(\hat{\bar{x}}) =
        \sqrt{(1-f)/n}\;s_x/\bar{x}$, y sobre <code>agsrs</code> vale <strong>0,0626</strong>. La cota verdadera
        —calculable aquí solo porque <code>agpop</code> es un censo— es <strong>0,0750</strong>: la muestra la
        subestima algo, por la misma razón por la que se quedó corta en $t_x$. Y el sesgo relativo que las 200 000
        réplicas midieron de verdad es <strong>0,0055</strong>, catorce veces por debajo de su propia cota. Eso es
        lo normal: la cota tira de $\lvert\rho\rvert \le 1$ y es deliberadamente conservadora. El precálculo
        comprueba que se cumple en <strong>los nueve tamaños simulados</strong>, y aborta si alguna vez falla; es
        una tercera vía de control sobre la simulación.</p>

      <div class="note">
        <p><strong>La regla de Kish, y lo que hay que mirar cuando no se cumple.</strong> El criterio práctico
          (Kish, 1965) es que si $\widehat{\text{CV}}(\hat{\bar{x}})$ no pasa de <strong>0,1–0,2</strong>, el
          sesgo es despreciable frente a la variabilidad: con 0,2, el sesgo no llega a la quinta parte de un error
          estándar. En esta población el umbral se cruza en <strong>$n = 47$</strong> — con menos de eso la regla
          <em>no</em> da el sesgo por despreciable, y en efecto el simulador enseña $-1{,}5$ millones de acres en
          $n = 10$. Los 300 de <code>agsrs</code> están holgadamente al otro lado.</p>
        <p>Cuando la cota sale demasiado grande, la fórmula dice también dónde tocar, porque son los
          <strong>tres únicos factores</strong> que la componen:</p>
        <ul>
          <li><strong>Que la relación sea proporcional.</strong> Si $y_k = B\,x_k$ exactamente, $\hat{B}$ es
            constante muestra a muestra, su covarianza con $\hat{\bar{x}}$ es cero y el sesgo
            <em>desaparece</em>. Cuanto más cerca del origen pase la recta, menos sesgo — es la misma condición
            que el módulo 3 pedía por precisión, cobrando ahora por segunda vez.</li>
          <li><strong>Que $\text{CV}(x)$ sea bajo.</strong> Aparece entero en la cota. Una auxiliar de
            variabilidad relativa moderada reduce el sesgo <em>y</em> la varianza; es el argumento para preferir,
            entre dos auxiliares igual de correlacionadas, la más estable.</li>
          <li><strong>Que $n$ sea grande.</strong> El $\sqrt{(1-f)/n}$ es el que manda cuando no se puede elegir
            la auxiliar. Aquí es donde aparece el orden $1/n$ de la primera fórmula del módulo.</li>
        </ul>
        <p style="margin-bottom:0;">No hacen falta los tres: basta con que el producto quede pequeño.</p>
      </div>

      <div class="warning">
        <p style="margin-bottom:0;"><strong>Y el intervalo de confianza desprecia el sesgo a sabiendas.</strong> Los
          intervalos que este capítulo construye —los del módulo 2, y los que devuelve
          <code>confint()</code>— usan un estimador de varianza deducido <em>suponiendo el sesgo nulo</em>, y luego
          se centran en un estimador que no lo es. No es un descuido: es una decisión amparada justamente en la
          cota de arriba. Cuando $\widehat{\text{CV}}(\hat{\bar{x}})$ es pequeño, el desplazamiento del centro
          es una fracción despreciable de la anchura y la cobertura no se resiente. Cuando <em>no</em> lo es —$n$
          chico, auxiliar dispersa—, el intervalo está mal centrado y su cobertura real no es la nominal, sin que
          nada en la salida lo advierta.</p>
      </div>

      <h3>Qué se desprecia exactamente</h3>

      <p>La aproximación del módulo 2 consistió en sustituir $t_x/\hat{t}_{x,\pi}$ por 1. El simulador de abajo mide
        qué se pierde con eso: en el eje horizontal, el error exacto $\hat{t}_r - t_y$ de cada muestra; en el
        vertical, lo que da la aproximación lineal.</p>
