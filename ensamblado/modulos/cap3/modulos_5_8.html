  <!-- MÓDULO 5 · Razones y proporciones                             -->
  <!-- ============================================================ -->
  <template id="module-5">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 5</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Razones y proporciones
          <span class="text-gray-400 font-normal text-2xl">/ Ratios of proportions</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Reconocer las razones que ya se venían usando sin
              llamarlas así, y no confundir la razón de dos proporciones con la proporción de una razón.</p>
          </div>
        </div>
      </div>

      <p>Muchos parámetros que parecen medias son en realidad razones. Merece la pena tener el catálogo a mano,
        porque los que de verdad lo son heredan lo del módulo 4: <strong>son sesgados y su varianza sale de
        linealizar</strong>. Y el catálogo sirve justamente para separarlos de los que solo lo parecen.</p>

      <div class="space-y-4">
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">Una media es una razón</h4>
          <p class="text-sm" style="margin-bottom:0;">$\bar{y}_U = t_y / N$. Cuando $N$ se conoce, el denominador es
            una constante y no aporta variabilidad: la media es lineal y no hay sesgo. Cuando $N$ <strong>no</strong>
            se conoce —lo habitual en muestreo por conglomerados—, hay que estimarlo, el denominador se vuelve
            aleatorio y la media pasa a ser una razón con todo lo que eso implica. Es lo que ocurrirá en el capítulo
            5.</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">Una proporción es una media</h4>
          <p class="text-sm" style="margin-bottom:0;">Si $y_k$ vale 1 o 0, entonces $\bar{y}_U = p$. Todo lo del
            capítulo 2 se aplica sin cambios: <code>svymean</code> sobre una columna indicadora estima la proporción
            y su error estándar. No hace falta ninguna fórmula especial.</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">Una razón de proporciones sí es una razón</h4>
          <p class="text-sm" style="margin-bottom:0;">«Superficie sembrada por granja» es
            $t_{\text{acres}} / t_{\text{granjas}}$: los dos totales se estiman y el cociente es una razón con
            denominador aleatorio. Igual «gasto por hogar», «horas por estudiante» o «casos por cada mil habitantes».
            Se estiman con <code>svyratio</code>, nunca promediando los cocientes individuales.</p>
        </div>
      </div>

      <div class="warning">
        <p><strong>El error clásico: promediar cocientes.</strong> La razón poblacional es
          $B = \sum y_k / \sum x_k$, <em>no</em> $\frac{1}{N}\sum (y_k/x_k)$. Las dos cantidades son distintas y no
          se aproximan entre sí: la primera pondera cada unidad por su tamaño $x_k$, la segunda le da a todas el
          mismo peso. Si se quiere «el rendimiento medio por acre del país», la respuesta correcta es la primera —un
          condado con un millón de acres debe pesar más que uno con mil—. La segunda contesta a otra pregunta: «el
          rendimiento del condado típico». Con <strong>tasas</strong> el contraste es más crudo: la proporción de
          contagiados de una comarca es $\sum y_k / \sum x_k$ —casos entre habitantes—, mientras que promediar las
          proporciones de cada pueblo le da al caserío de veinte vecinos el mismo peso que a la ciudad de cien
          mil.</p>
        <p><strong>Cuánto se separan, aquí.</strong> Sobre <code>agpop</code>, $B = 0{,}9797$ y la media de
          cocientes vale <strong>0,9530</strong>: un <strong>2,73 %</strong> de diferencia. Y no es un error de
          muestreo —son dos números de la población entera—, así que quien promedia cocientes no estima mal $B$:
          <strong>estima bien otra cosa</strong>. Por eso la diferencia <em>no se reduce al crecer $n$</em>, que es
          lo que la vuelve peligrosa.</p>
        <p><strong>Y encima es más difícil de estimar.</strong> El cociente $z_k = y_k/x_k$ tiene la cola pesada:
          un condado con poca superficie en 1987 y mucha en 1992 da un $z$ enorme —en <code>agpop</code> llega a
          <strong>9,09</strong>—, y eso dispara su variabilidad. Con los mismos 300 condados, el error estándar
          relativo de $\hat{B}$ es del <strong>0,76 %</strong> y el de la media de cocientes del
          <strong>1,84 %</strong>: <strong>2,4 veces</strong> peor. Promediar cocientes contesta otra pregunta y,
          además, la contesta con menos precisión.</p>
        <p style="margin-bottom:0;"><strong>Y un detalle que decide solo.</strong> La media de cocientes ni siquiera
          <em>existe</em> donde $x_k = 0$. En <code>agpop</code> hay <strong>2</strong> condados con cero acres en
          1987 y <strong>23</strong> más con el código de faltante: para promediar cocientes hay que dejar fuera los
          25 y se acaba describiendo una población distinta de la que se quería. $B$ no necesita esa cirugía. Y si
          lo que de verdad se busca <em>es</em> la media de cocientes, no hace falta nada de este capítulo:
          $z_k = y_k/x_k$ es una variable como otra cualquiera y se estima con el capítulo 2.</p>
      </div>

      <div class="note">
        <p><strong>Dónde reaparece esto.</strong> El estimador de razón se usa en el capítulo 4 dentro de cada
          estrato (razón separada) o sobre el conjunto (razón combinada); en el capítulo 5 es la forma natural de
          estimar cuando los conglomerados tienen tamaños desiguales; y en el capítulo 7 es la base de la
          linealización de Taylor para cualquier estadístico no lineal.</p>
      </div>

      <div class="references">
        <h3><i class="fas fa-book-open mr-2" aria-hidden="true"></i>Para ampliar este módulo</h3>
        <ul style="margin-bottom:0;">
          <li>Lohr, <strong>sección 3.1.3</strong> (2.ª ed.) o <strong>4.2.3</strong> (3.ª ed.) — razones con
            variables indicadoras y estimación de proporciones dentro de dominios.</li>
          <li>Portela, J. y Villeta, M. <em>Técnicas de muestreo estadístico</em>, <strong>sección 7.1.1</strong>
            (pp. 208–209) — el ejemplo de la epidemia, que abre su capítulo con esta misma confusión. Ojo: el libro
            trabaja siempre bajo m.a.s., sin $\pi_k$, y su software es SAS.</li>
        </ul>
      </div>
    </div>

  <template id="module-6">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 6</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Estimación de regresión
          <span class="text-gray-400 font-normal text-2xl">/ Regression estimation</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Soltar la restricción del origen, y descubrir por el
              camino que la regresión es calibración.</p>
          </div>
        </div>
      </div>

      <p>La razón obliga a que la recta pase por el origen: supone que un condado sin un solo acre sembrado en 1987
        tampoco lo tuvo en 1992. Antes de construir un estimador que suelte esa restricción conviene preguntarse si
        <code>agsrs</code> la pide — y eso no se decide a ojo: se ajusta la recta libre y se
        <strong>contrasta su intercepto</strong>.</p>

      <p>La respuesta es que no la pide. El ajuste libre da una pendiente de <strong>0,995</strong> y un intercepto
        de <strong>−2 548</strong> acres, pero ese intercepto viene con un error estándar de <strong>2 425</strong>:
        $t = -1{,}05$ y <strong>p = 0,294</strong>. Sobre estos datos el intercepto <strong>no se distingue de
        cero</strong>, y la recta por el origen es defendible. Por eso el módulo 7 va a encontrar a los tres
        estimadores con auxiliar empatados en la práctica: no es casualidad de esta muestra, es que aquí no hay
        intercepto que recuperar.</p>

      <p>¿Para qué entonces el estimador de regresión? Porque el origen <em>no siempre</em> se puede suponer, y no
        hace falta salir del capítulo para verlo: en <code>cherry</code> —los 31 cerezos del ejercicio 2 del módulo
        12— el mismo contraste da un intercepto de −36,94 con <strong>p = 7,6 · 10⁻¹²</strong>. Ahí el estimador de
        razón es el equivocado, y hace falta el que viene ahora.</p>

      <div class="definition">
        <h4>El estimador de regresión</h4>
        <p>Se ajusta una recta con intercepto y se corrige la media muestral por lo que la muestra se desvió en $x$:</p>
        <p style="text-align:center;">$$\hat{\bar{y}}_{\text{reg}} = \bar{y} + b_1(\bar{x}_U - \bar{x}),
          \qquad \hat{t}_{\text{reg}} = N\,\hat{\bar{y}}_{\text{reg}}$$</p>
        <p style="margin-bottom:0;">Léase así: si la muestra salió con una $\bar{x}$ menor que la poblacional, y
          $y$ crece con $x$, entonces $\bar{y}$ también se quedó corta y hay que subirla en $b_1$ por cada unidad de
          desvío. La corrección es automática y usa la única información que se tiene de más: $\bar{x}_U$.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="El estimador de regresión">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R5⟧</code></pre>
        </div>
      </div>

      <div class="note">
        <p><strong>El criterio, y su letra pequeña.</strong> Ajustar la recta libre y mirar el p-valor del
          intercepto es el modo estándar de elegir entre razón y regresión: si no es significativo, la recta pasa
          por el origen y se prefiere la razón, que estima un parámetro menos; si lo es, se paga ese parámetro y se
          usa la regresión. Tres cosas que el contraste no dice solo:</p>
        <ul style="margin-bottom:0;">
          <li><strong>Lleva el diseño dentro.</strong> El contraste de <code>lm()</code> supone observaciones
            independientes e idénticamente distribuidas, que no es lo que produce un diseño muestral. Por eso el
            bloque lo repite con <code>svyglm()</code> sobre el objeto de diseño. Aquí las dos vías coinciden en la
            conclusión —p = 0,294 y p = 0,338—, pero el error estándar de diseño sale <em>mayor</em>, 2 654 contra
            2 425, porque la dispersión crece con $x$ y el estimador de diseño no supone lo contrario. En un diseño
            complejo esa diferencia deja de ser cosmética y el único contraste válido es el segundo.</li>
          <li><strong>No rechazar no es demostrar.</strong> «p = 0,294» dice que estos datos no permiten distinguir
            el intercepto de cero, no que el intercepto valga cero. Con $n$ pequeño casi nada se rechaza, y ahí el
            criterio no decide nada: deciden la nube y lo que se sepa del fenómeno, que es el argumento del módulo
            3.</li>
          <li><strong>La pendiente estimada también se paga.</strong> $b_1 = s_{xy}/s_x^2$ es un estimador
            <em>sesgado</em> de la pendiente —si se conociera la $S_x^2$ poblacional, $s_{xy}/S_x^2$ sería
            insesgado—, así que la ventaja teórica de la regresión se cobra en un parámetro más ajustado con la
            misma muestra. El módulo 7 pone las tres varianzas una al lado de la otra.</li>
        </ul>
      </div>

      <div class="note">
        <p><strong>La regresión es calibración.</strong> Fíjate en cómo se obtuvo en <code>survey</code>: no con una
          función de regresión, sino con <code>calibrate()</code>, imponiendo que los pesos reproduzcan los dos
          totales conocidos, $N$ y $t_x$. Esa es la lectura moderna del capítulo entero y el puente al capítulo 7,
          donde la calibración se generaliza a cualquier número de variables auxiliares. El total coincide con la
          fórmula clásica hasta el noveno dígito.</p>
      </div>

      <div class="warning">
        <p><strong>Dos vías que no coinciden del todo, y por qué.</strong> El error estándar de <code>survey</code>
          es 5 593 972 y el de la fórmula clásica $N\sqrt{(1-f)\,s^2_{\text{reg}}/n}$ es 5 330 862: difieren un
          <strong>4,9 %</strong>. No es un error de ninguna de las dos. <code>survey</code> estima la varianza de
          diseño del estimador calibrado teniendo en cuenta los pesos $g_k$; la fórmula de libro los ignora, porque
          es una aproximación de primer orden que supone $g_k \approx 1$. Con $n = 300$ los $g_k$ todavía se separan
          lo suficiente de 1 para que se note. Este material publica la de <code>survey</code> en todas sus tablas,
          para que las cifras cuadren entre sí.</p>
      </div>

      <div class="references">
        <h3><i class="fas fa-book-open mr-2" aria-hidden="true"></i>Para ampliar este módulo</h3>
        <ul style="margin-bottom:0;">

            resueltos. Ojo: el libro trabaja siempre bajo m.a.s., sin $\pi_k$, y su software es SAS.</li>

  <template id="module-7">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 7</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Estimación de diferencia
          <span class="text-gray-400 font-normal text-2xl">/ Difference estimation</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">El caso más simple de todos —y el único insesgado de
              los tres— y la comparación final de los cuatro estimadores.</p>
          </div>
        </div>
      </div>

      <p>Hay un caso en el que ni siquiera hace falta estimar la pendiente: cuando se sabe de antemano que vale 1.
        Ocurre cuando $x$ e $y$ son <em>la misma variable medida dos veces</em> —el inventario del año pasado y el de
        este, el padrón antiguo y el nuevo—, y entonces lo natural es trabajar con la diferencia $y_k - x_k$ en vez
        de con el cociente.</p>

      <div class="definition">
        <h4>El estimador de diferencia</h4>
        <p style="text-align:center;">$$\hat{t}_d = t_x + N\,(\bar{y} - \bar{x}) = t_x + N\,\bar{d}, \qquad d_k = y_k - x_k$$</p>
        <p style="margin-bottom:0;">Es la regresión con la pendiente <strong>fijada de antemano en 1</strong>. Y como
          $b_1$ no se estima de la muestra, $\hat{t}_d$ es <strong>exactamente insesgado</strong>: la única cosa
          aleatoria que contiene es $\bar{d}$, que es una media muestral corriente.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="El estimador de diferencia">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R6⟧</code></pre>
        </div>
      </div>

      <p>Se usa cuando $x$ e $y$ miden <strong>lo mismo en las mismas unidades</strong>: dos censos de la misma
        superficie, el conteo por fotografía y el conteo en campo de los mismos árboles, el valor declarado y el
        valor auditado de las mismas facturas. En cuanto las unidades dejan de ser comparables, fijar la pendiente
        en 1 no tiene sentido y hay que volver a la regresión.</p>

      <h3>Los cuatro, uno al lado del otro</h3>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Comparación de los cuatro estimadores">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R7⟧</code></pre>
        </div>
      </div>

      <div class="tabla-ranking" data-ranking="estimadores">
        <p class="tabla-ranking-titulo">Los cuatro estimadores sobre la misma muestra</p>
        <div class="tabla-ranking-marco" aria-label="Comparación ordenable de los cuatro estimadores"></div>
        <p class="tabla-ranking-estado" role="status" aria-live="polite"></p>
        <p class="tabla-ranking-pie"></p>
      </div>

      <div class="note">
        <p><strong>Cómo leer la tabla.</strong> La columna del error real solo existe aquí porque
          <code>agpop</code> es un censo y el total verdadero se conoce; en una encuesta de verdad no está
          disponible, y decidir por ella sería hacer trampa. La columna que se usa para elegir es el <strong>error
          estándar</strong>, que sí se calcula con la muestra. Los tres estimadores con auxiliar están empatados en
          la práctica y todos multiplican por más de cien la eficiencia de la expansión.</p>
      </div>

      <h3>El empate no es casualidad: es un teorema</h3>

      <p>El módulo 3 dijo que los cuatro estimadores son la misma idea con distinta libertad para la recta. Ahora se
        puede decir con exactitud: los cuatro son <strong>una sola fórmula con cuatro valores de $b$</strong>,</p>

      <div class="formula">
        <p style="text-align:center; margin-bottom:0.6rem;">
          $$\hat{t}(b) = N\left[\bar{y} + b\,(\bar{x}_U - \bar{x})\right]$$
          $$V(b) = \frac{1-f}{n}\left(S_y^2 + b^2S_x^2 - 2b\,S_{xy}\right)$$</p>
        <p style="margin-bottom:0;">$b = 0$ es la <strong>expansión</strong>; $b = B$, la <strong>razón</strong>
          (a primer orden, que es la linealización del módulo 4); $b = 1$, la <strong>diferencia</strong>; y
          $b = b_1 = S_{xy}/S_x^2$, la <strong>regresión</strong>.</p>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-orden">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver por qué la regresión no puede perder, y cuándo empata exactamente</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-orden" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>$V(b)$ es una parábola en $b$ con las ramas hacia arriba. Su mínimo se busca derivando, y sale
                justo el $b$ de la regresión:</p>
              $$V'(b) = \frac{1-f}{n}\left(2bS_x^2 - 2S_{xy}\right) = 0
                \iff b = \frac{S_{xy}}{S_x^2} = b_1$$
            </li>
            <li>
              <p>El valor en ese mínimo se escribe con la correlación, porque
                $S_{xy}^2/S_x^2 = \rho^2S_y^2$:</p>
              $$V(b_1) = \frac{1-f}{n}\,S_y^2\left(1 - \rho^2\right)$$
            </li>
            <li>
              <p>Y la distancia de cualquier otro $b$ al mínimo es un <strong>cuadrado perfecto</strong>:</p>
              $$V(b) - V(b_1) = \frac{1-f}{n}\left(b\,S_x - \rho\,S_y\right)^2 \;\ge\; 0$$
              <p style="margin-bottom:0;">De ahí salen las dos desigualdades de golpe. Frente a la
                <strong>expansión</strong> ($b = 0$) el hueco es $\tfrac{1-f}{n}\rho^2S_y^2$, que se anula solo si
                $\rho = 0$: sin correlación, la auxiliar no aporta nada. Frente a la <strong>razón</strong>
                ($b = B$) el hueco se anula solo si $B = b_1$ — y eso es exactamente decir que
                <strong>la recta de regresión pasa por el origen</strong>, que es el contraste del módulo 6.</p>
            </li>
            <li>
              <p>Y el reverso honesto, que la desigualdad no dice. Todo esto vale para el $b_1$
                <strong>óptimo y conocido</strong>. En la práctica se estima con $\hat{b}_1 = s_{xy}/s_x^2$, que es
                un estimador sesgado y con su propia varianza, así que la ventaja es <em>asintótica</em>. Si la
                relación lineal es débil, $b_1$ está cerca de cero y $\hat{t}_{\text{reg}} \approx N\bar{y}$,
                pero con el ruido añadido de haber estimado una pendiente que no hacía falta: ahí es
                <strong>preferible la expansión</strong>, aunque el teorema diga que no puede perder.</p>
            </li>
          </ol>
        </div>
      </div>

      <p>Sobre <code>agpop</code>, que es censo, esos cuatro valores se pueden calcular de verdad. Con $n = 300$,
        el error estándar <strong>verdadero</strong> del total es de <strong>71,70</strong> millones para la
        expansión y de <strong>7,1114</strong> millones para la regresión, que es el mínimo. La razón se queda en
        <strong>7,1298</strong> —un <strong>0,26 %</strong> por encima del óptimo— y la diferencia en
        <strong>7,1749</strong>, un <strong>0,89 %</strong>. Ése es el empate, medido: la razón usa
        $B = 0{,}9797$ y la regresión $b_1 = 0{,}9868$, dos pendientes que se parecen tanto que el cuadrado
        perfecto no llega a abrirse.</p>

      <h4>Qué decide entre la razón y la diferencia</h4>

      <p>El cuadrado perfecto da además una regla, y sin añadir teoría: entre dos valores de $b$ gana el que tenga
        $(b\,S_x - \rho\,S_y)^2$ más pequeño, es decir <strong>aquel de los dos que se parezca más a
        $b_1$</strong>. Para la razón ese valor es $B$; para la diferencia, 1. Así que la pregunta no es si $x$ e
        $y$ son la misma variable medida dos veces —eso lo cumplen las cuatro parejas de <code>agpop</code>— sino
        <strong>si la pendiente está más cerca de $B$ o de 1</strong>:</p>

      <table>
        <caption class="sr-only">La regla de la pendiente sobre las cuatro parejas de agpop</caption>
        <thead>
          <tr>
            <th scope="col">Pareja</th>
            <th scope="col">$B$</th>
            <th scope="col">$b_1$</th>
            <th scope="col">$b_1$ se parece más a</th>
            <th scope="col">Gana de verdad</th>
            <th scope="col">Por</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><code>acres92 ~ acres87</code></td><td>0,9797</td><td>0,9868</td>
            <td>$B$</td><td>razón</td><td>0,63 %</td>
          </tr>
          <tr>
            <td><code>farms92 ~ farms87</code></td><td>0,9222</td><td>0,9323</td>
            <td>$B$</td><td>razón</td><td>20,5 %</td>
          </tr>
          <tr>
            <td><code>largef92 ~ largef87</code></td><td>1,0240</td><td>0,9714</td>
            <td><strong>1</strong></td><td><strong>diferencia</strong></td><td>6,8 %</td>
          </tr>
          <tr>
            <td><code>smallf92 ~ smallf87</code></td><td>0,9085</td><td>1,0297</td>
            <td><strong>1</strong></td><td><strong>diferencia</strong></td><td>16,0 %</td>
          </tr>
        </tbody>
      </table>

      <p>La regla acierta en las cuatro. Y fíjate en el recorrido de la última columna: la diferencia va de perder
        un <strong>20,5 %</strong> a ganar un <strong>16,0 %</strong>, con las cuatro parejas cumpliendo igual de
        bien la condición de «la misma variable medida dos veces». <strong>Una condición que dispara igual en casos
        con desenlaces opuestos no está decidiendo nada</strong>; la que decide es la de la pendiente, y sale de una
        desigualdad que el capítulo ya tenía escrita.</p>

      <p>Hay un detalle más, y es incómodo: <code>acres92 ~ acres87</code> —la pareja sobre la que corre todo este
        capítulo— es la de <strong>menor apuesta de las cuatro</strong>. Un 0,63 %, del orden de los huecos que la
        advertencia de abajo declara inobservables con una sola muestra. El capítulo eligió para enseñar el caso
        donde menos se juega, que es bueno para ver el mecanismo y malo para creerse que la elección da igual.</p>

      <div class="note">
        <p style="margin-bottom:0;"><strong>Y de paso, la aproximación del módulo 2 queda contrastada.</strong> El
          error estándar que esta fórmula da para la razón, 7 129 751, y el que midieron las
          <strong>200 000 réplicas</strong> del módulo 4, 7 106 715, se separan un <strong>0,32 %</strong>. Son dos
          caminos independientes —una aproximación de primer orden y una simulación— y coinciden en tres cifras.</p>
      </div>

      <div class="warning">
        <p><strong>Ojo: el teorema no ordena la tabla de arriba.</strong> En la tabla, la regresión sale con el
          error estándar <em>más grande</em> de los tres (5,59 millones frente a 5,54 de la razón), y el teorema
          acaba de decir que no puede perder. No hay contradicción, y separar las tres cosas que pasan aquí vale
          por medio módulo:</p>
        <ol style="margin-bottom:0;">
          <li>El teorema compara <strong>varianzas verdaderas</strong>; la tabla enseña <strong>tres
            estimaciones</strong> hechas con una sola muestra, y cada una tiene su propio error. Las tres se quedan
            cortas: 5,3–5,6 millones frente a los 7,11 reales.</li>
          <li>Las dos cifras no son de la misma fórmula. La de la regresión es la de <code>survey</code>, que tiene
            en cuenta los pesos $g_k$ (módulo 6); con la fórmula clásica saldría <strong>5 330 862</strong>, por
            <em>debajo</em> de la razón, tal como predice el teorema.</li>
          <li>Y sobre todo: los huecos reales son del <strong>0,26 %</strong> y el <strong>0,89 %</strong>, mucho
            más pequeños que el error con el que se estima cualquiera de los tres. Con estos datos, ninguna muestra
            puede resolver ese orden — y ésa <em>es</em> la conclusión, no un defecto de la tabla.</li>
        </ol>
      </div>

          <span class="text-gray-400 font-normal text-2xl">/ Domain estimation</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Estimar en subpoblaciones que no se planificaron, y
              entender por qué eso convierte una media en una razón.</p>
          </div>
        </div>
      </div>

      <p>Hasta aquí se ha estimado <em>un</em> total para todo el país. Pero casi ningún informe se conforma con
        eso: se quiere el dato por región, por tamaño, por sector. De los 300 condados de la muestra,
        <strong>129</strong> tienen 600 granjas o más y <strong>171</strong> menos — y esos dos números
        <em>no los eligió nadie</em>: salieron del sorteo. Esa es toda la diferencia con un estrato, y tiene
        consecuencias sobre la varianza.</p>

      <div class="definition">
        <h4>Dominio</h4>
        <p style="margin-bottom:0;">Un <strong>dominio</strong> es una subpoblación $U_d \subset U$ sobre la que se
          quiere estimar por separado, pero que <em>no</em> se usó para diseñar la muestra. La diferencia con un
          estrato es exactamente esa: en un estrato, $n_h$ lo fija el investigador; en un dominio, $n_d$ es
          <strong>aleatorio</strong> —depende de cuántas unidades del dominio hayan caído en la muestra—.</p>
      </div>

      <p>Esa aleatoriedad de $n_d$ tiene una consecuencia directa: la media de dominio</p>

      <div class="formula">
        $$\hat{\bar{y}}_d = \frac{\sum_{k \in s} y_k\,\delta_k}{\sum_{k \in s} \delta_k},
          \qquad \delta_k = \begin{cases}1 & k \in U_d\\ 0 & \text{si no}\end{cases}$$
      </div>

      <p>es un cociente con <strong>denominador aleatorio</strong>: es una razón, y su error estándar sale de
        linealizarla igual que en el módulo 4. El residuo linealizado es $u_k = \delta_k\,(y_k - \hat{\bar{y}}_d)$.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Estimación en dominios">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R8⟧</code></pre>
        </div>
      </div>

      <p>Las dos vías coinciden hasta el último decimal impreso, lo cual confirma que <code>svyby</code> está
        haciendo exactamente la linealización de la fórmula, y no otra cosa.</p>

      <div class="simulador" data-simulador="dominios">

        <p class="simulador-intro">Con las cuatro regiones se puede comparar la estimación con la verdad, porque
          <code>agpop</code> es un censo. Mira el Oeste: solo 39 de los 300 condados de la muestra cayeron ahí, la
          estimación se queda un 17 % por debajo del valor real y su coeficiente de variación es del 13 % —el
          doble que el de la media global, y en varianza cuatro veces más—. Es el problema de fondo de los dominios pequeños, y lo que motiva
          la estimación en áreas pequeñas.</p>
