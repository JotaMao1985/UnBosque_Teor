      <p>Empecemos por un problema que cabe entero en una tabla. Hay <strong>cinco condados</strong> y hay que
        estimar cuántos acres se sembraron en total. Visitar los cinco es demasiado caro: alcanza para
        <strong>dos</strong>. La pregunta de este módulo —y, en el fondo, la del curso— es cómo elegir esos dos.</p>

          <tr><td>$x_k$ (granjas, <strong>conocida</strong>)</td>
            <td>1</td><td>1</td><td>2</td><td>2</td><td>4</td><td>10</td></tr>

      <p>La primera fila es lo que se quiere saber y no se sabe: solo se conocerá de los dos condados que se visiten.
        La segunda está en el censo anterior, disponible para los cinco <em>antes</em> de salir a campo — es una
        <strong>variable auxiliar</strong> (<em>auxiliary variable</em>), y por eso puede usarse para decidir a quién
        visitar.</p>

      <p>Con $n = 2$ hay exactamente $\binom{5}{2} = 10$ parejas posibles: 12, 13, 14, 15, 23, 24, 25, 34, 35 y 45.
        Ahora bien, <strong>elegir un método de muestreo es elegir con qué frecuencia sale cada una de esas diez
        parejas</strong>. Sortear al azar entre las diez significa darle 1/10 a cada una. Decidir que siempre se
        visite un condado pequeño y uno grande significa dar 0 a las parejas que no cumplan eso. Favorecer a los
        condados con más granjas significa cargar la mano en las parejas que los contienen.</p>

      <p>Esa lista de diez probabilidades <em>es</em> el objeto que la teoría del muestreo llama <strong>diseño
        muestral</strong>. No hace falta nada más para definirlo: una probabilidad por cada muestra posible, sumando
        1. Escrito con símbolos:</p>

      <div class="definition">
        <h4><i class="fas fa-dice mr-2" aria-hidden="true"></i>Definición 2.1: población, muestra y diseño</h4>
        <p>$U = \{1, \dots, N\}$ es la <strong>población finita</strong> (aquí, los cinco condados) y una
          <strong>muestra</strong> $s$ es un subconjunto de $U$ (aquí, una de las diez parejas). Un <strong>diseño
          muestral</strong> (<em>sampling design</em>) es la función que reparte la probabilidad entre ellas:</p>
        $$p(s) \ge 0 \quad \text{para toda } s \subseteq U, \qquad \sum_{s \subseteq U} p(s) = 1$$
        <p>Las muestras con $p(s) > 0$ —las que <em>pueden</em> salir— forman el <strong>soporte</strong> $Q$.</p>
        <p style="margin-bottom:0;">Y una advertencia que gobierna todo el curso: los $y_k$ son
          <strong>constantes desconocidas</strong>, no variables aleatorias. La superficie sembrada del condado 3 es
          27, sale o no sale en la muestra. <strong>Lo único aleatorio es qué unidades se observan</strong>, y eso lo
          decide quien diseña. De ahí el nombre de <em>inferencia basada en el diseño</em>: la probabilidad no está
          en la naturaleza, está en el sorteo que uno mismo organiza.</p>
      </div>

      <div class="note">
        <p><strong>Por qué esto es distinto de lo que ya sabes.</strong> Casi toda la estadística previa empieza
          suponiendo que $y_1, \dots, y_n$ son variables aleatorias independientes de alguna distribución. Aquí no
          hay tal supuesto —ni hace falta—: la aleatoriedad la pone el diseño, y por eso los resultados valen para
          <em>cualquier</em> población, sin pedirle que sea normal ni nada parecido. Es una inferencia con menos
          supuestos, no con más.</p>
      </div>

      <div class="note">
        <p><strong>Nota sobre notación.</strong> Lohr escribe $P(S)$ y llama $S$ a la muestra; Gutiérrez escribe $p(s)$

          <strong>glosario del módulo 2</strong> traduce ambas notaciones término a término.</p>
      </div>

      <h3>2.1.1 Tres maneras de repartir la probabilidad</h3>

      <p>De las infinitas formas de repartir esa probabilidad entre las diez parejas, tres van a acompañarnos todo el
        capítulo — y cada una es el germen de un capítulo posterior:</p>

      <div class="diagram">
        <ol>
          <li><strong>Diseño A — MAS sin reemplazo.</strong> Las diez muestras son igual de probables: $p(s) = 1/10$.</li>

            $p(s) = 0$ y quedan fuera del soporte.</li>
          <li><strong>Diseño C — probabilidades desiguales.</strong> $p(s)$ proporcional al tamaño total de la muestra,
            $p(s) \propto x_k + x_l$. Las muestras que contienen condados grandes salen más a menudo.</li>
        </ol>
      </div>

      <p>La tabla de $p(s)$ del módulo anterior tenía diez filas porque $N = 5$. Con $N = 3\,078$ condados y $n = 300$

        hace falta: para estimar un total y su varianza basta con dos resúmenes de $p(s)$.</p>

      <p>Hagamos primero la cuenta con los dedos. En el MAS de los cinco condados las diez parejas son igual de
        probables. <strong>¿Con qué frecuencia sale el condado 1?</strong> Basta mirar la lista: aparece en 12, 13,
        14 y 15. Cuatro de diez, o sea $0{,}4$. Repítelo con el condado 3 —está en 13, 23, 34 y 35— y sale otra vez
        $0{,}4$. Ese número, «con qué frecuencia entra esta unidad», es lo único de $p(s)$ que hará falta para
        estimar el total.</p>

      <p>La segunda cuenta es igual de sencilla: <strong>¿con qué frecuencia salen el 1 y el 3 <em>a la vez</em>?</strong>
        Solo en la pareja 13: una de diez, $0{,}1$. Ese segundo número es el que hará falta para la varianza. Con los
        dos, el diseño entero queda resumido en dos tablitas — en vez de una tabla de $\binom{3078}{300}$ filas.</p>

      <div class="definition">
        <h4><i class="fas fa-percent mr-2" aria-hidden="true"></i>Definición 2.4: probabilidades de inclusión</h4>
        <p>La <strong>probabilidad de inclusión de primer orden</strong> de la unidad $k$ es la probabilidad de que $k$
          acabe en la muestra:</p>
        $$\pi_k = P(k \in s) = \sum_{s \ni k} p(s)$$
        <p>La <strong>de segundo orden</strong> es la probabilidad de que $k$ <em>y</em> $l$ entren las dos:</p>
        $$\pi_{kl} = P(k \in s \text{ y } l \in s) = \sum_{s \supseteq \{k,l\}} p(s), \qquad \pi_{kk} = \pi_k$$
      </div>

      <p>Las dos se obtienen sumando columnas de la tabla de $p(s)$: son un <em>resumen</em> del diseño, no un objeto
        nuevo. Y cumplen dos identidades que conviene usar como comprobación cada vez que se calcula un diseño.</p>

      <div class="formula">
        <p>Suma de las probabilidades de primer orden:</p>
        $$\sum_{k \in U} \pi_k = E(n_s) \qquad \text{y, si el diseño es de tamaño fijo,} \qquad \sum_{k \in U} \pi_k = n$$
        <p>Suma de una fila de segundo orden, quitando la diagonal (solo a tamaño fijo):</p>
        $$\sum_{l \in U,\, l \neq k} \pi_{kl} = (n - 1)\, \pi_k$$
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-sumapi">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver por qué $\sum_U \pi_k = E(n_s)$</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-sumapi" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Se define la <strong>variable indicadora</strong> de la unidad $k$: vale 1 si $k$ entra en la muestra
                y 0 si no.</p>
              $$I_k = \begin{cases} 1 & \text{si } k \in s \\ 0 & \text{si } k \notin s\end{cases}$$
            </li>
            <li>
              <p>Como $I_k$ solo toma los valores 0 y 1, su esperanza <em>es</em> la probabilidad del suceso. Aquí
                aparece $\pi_k$ por primera vez como una esperanza, que es como se va a usar de ahora en adelante:</p>
              $$E(I_k) = 1 \cdot P(k \in s) + 0 \cdot P(k \notin s) = \pi_k$$
            </li>
            <li>
              <p>El tamaño de la muestra es la suma de los indicadores: $n_s = \sum_{k \in U} I_k$. Tomando esperanza y
                usando que la esperanza de una suma es la suma de las esperanzas —que vale siempre, haya o no
                independencia—:</p>
              $$E(n_s) = E\!\left(\sum_{k \in U} I_k\right) = \sum_{k \in U} E(I_k) = \sum_{k \in U} \pi_k$$
            </li>
            <li>
              <p>Si el diseño es de tamaño fijo, $n_s = n$ con probabilidad 1, así que $E(n_s) = n$.</p>
            </li>
          </ol>
          <p class="derivacion-resultado">La identidad $\sum_U \pi_k = n$ es la comprobación más barata que existe: si
            las $\pi_k$ de un diseño no suman $n$, el diseño está mal calculado. Se usará en todos los capítulos que
            vienen, y en el capítulo 6 será la restricción que hace que el diseño $\pi$PT no siempre exista.</p>
        </div>
      </div>

      <div class="simulador" data-simulador="matriz-pikl">

  <template id="module-3">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">El estimador de
          Horvitz–Thompson <span class="text-gray-400 font-normal text-2xl">/ The HT estimator</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Un estimador del total que funciona para
              <strong>cualquier</strong> diseño con $\pi_k &gt; 0$, y su varianza. A partir de aquí, cada diseño del
              curso es un caso particular.</p>
          </div>
        </div>
      </div>

      <p>Volvamos a los cinco condados. Salió la muestra $s = \{3, 5\}$: se observó $y_3 = 27$ y $y_5 = 58$, y hay que
        dar un número para el total de los cinco. ¿Cuál?</p>

      <p>La respuesta ingenua sería sumar lo observado, 85, pero eso solo cuenta dos condados de cinco. La segunda
        respuesta ingenua —multiplicar por $5/2$— da $212{,}5$, y hemos visto en el módulo anterior que bajo el
        diseño desigual las unidades <strong>no</strong> entran todas con la misma probabilidad, así que tratarlas
        igual no puede estar bien.</p>

      <p>La pregunta correcta es: <strong>¿a cuántos condados representa cada uno de los observados?</strong> Y la
        respuesta ya está calculada en el módulo anterior. Bajo el diseño desigual, el condado 3 entra con
        $\pi_3 = 0{,}40$ —sale en 4 de cada 10 muestras—, así que cuando sale tiene que hablar por sí mismo
        <em>y</em> por las veces que no salió: <strong>por $1/0{,}40 = 2{,}5$ condados</strong>. El condado 5, más
        favorecido por el diseño, tiene $\pi_5 = 0{,}55$ y habla solo por $1/0{,}55 = 1{,}82$. Cada uno aporta su
        valor multiplicado por lo que representa:</p>

      <div class="diagram">
        <p style="margin:0;">$\hat{t} = \underbrace{27 \times 2{,}50}_{\text{condado 3}} \;+\;
        \underbrace{58 \times 1{,}82}_{\text{condado 5}} \;=\; 67{,}5 + 105{,}5 \;=\; 172{,}95$</p>
        <p style="margin-bottom:0; margin-top:0.6rem;">El total verdadero es <strong>150</strong>, así que
          <em>esta</em> muestra se pasa en un 15 %. <strong>Y está bien que así sea.</strong> Ninguna muestra de dos
          condados puede acertar siempre: lo que el módulo demuestra a continuación es que, promediando sobre las
          diez muestras posibles con sus probabilidades, el resultado da <strong>exactamente 150</strong>. La
          promesa del estimador no es acertar cada vez; es no equivocarse sistemáticamente en ninguna dirección.</p>
      </div>

      <p>Eso es <strong>todo</strong> el estimador de Horvitz–Thompson: dividir cada valor observado entre su
        probabilidad de haber sido observado. La fórmula solo pone símbolos a la cuenta que acabas de hacer.</p>

      <div class="definition">
        <h4><i class="fas fa-scale-balanced mr-2" aria-hidden="true"></i>Definición 2.5: estimador de Horvitz–Thompson</h4>
        <p>Para un diseño con $\pi_k &gt; 0$ para toda $k \in U$, el <strong>estimador de Horvitz–Thompson</strong> del
          total poblacional $t = \sum_{k \in U} y_k$ es</p>
        $$\hat{t}_\pi = \sum_{k \in s} \frac{y_k}{\pi_k} = \sum_{k \in s} d_k\, y_k, \qquad d_k = \frac{1}{\pi_k}$$
        <p style="margin-bottom:0;">A $d_k$ se le llama <strong>peso de diseño</strong> (<em>design weight</em>) o
          <strong>factor de expansión</strong>. La suma de los pesos de la muestra estima el tamaño de la población:
          $\hat{N} = \sum_{k \in s} d_k$.</p>
      </div>

      <p>La suma recorre solo la muestra, que es lo único que se observa. Pero para estudiar sus propiedades conviene
        reescribirlo como una suma sobre <em>toda</em> la población usando los indicadores del módulo 2:</p>

      <div class="formula">
        $$\hat{t}_\pi = \sum_{k \in U} \frac{y_k}{\pi_k}\, I_k$$
        <p style="margin-bottom:0;">Ahora se ve dónde está el azar: los $y_k$ y los $\pi_k$ son constantes; lo único
          aleatorio son los $I_k$. Esta reescritura es la que hace que todas las demostraciones sean cortas.</p>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ht-insesgado">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver la demostración de que $\hat{t}_\pi$ es insesgado</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ht-insesgado" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Se parte de la forma con indicadores y se toma esperanza respecto del diseño. Los $y_k/\pi_k$ salen
                fuera porque son constantes:</p>
              $$E(\hat{t}_\pi) = E\!\left(\sum_{k \in U} \frac{y_k}{\pi_k} I_k\right) = \sum_{k \in U} \frac{y_k}{\pi_k}\, E(I_k)$$
            </li>
            <li>
              <p>Del módulo 2, $E(I_k) = \pi_k$. Aquí es donde se necesita $\pi_k &gt; 0$: si fuera cero, el cociente no
                existiría.</p>
              $$= \sum_{k \in U} \frac{y_k}{\pi_k}\, \pi_k = \sum_{k \in U} y_k = t$$
            </li>
          </ol>
          <p class="derivacion-resultado">$E(\hat{t}_\pi) = t$ para <strong>cualquier</strong> diseño, por raro que
            sea, siempre que todas las $\pi_k$ sean positivas y conocidas. No se ha supuesto tamaño fijo, ni
            independencia, ni normalidad, ni nada sobre los $y_k$. Esa generalidad es lo que hace que valga la pena
            montar todo el andamiaje de $p(s)$.</p>
        </div>
      </div>

      <p>La varianza sale del mismo modo, pero ahora hacen falta las covarianzas entre indicadores, y ahí es donde
        entran las $\pi_{kl}$.</p>

      <div class="formula">
        <h4>Varianza del estimador de Horvitz–Thompson</h4>
        $$V(\hat{t}_\pi) = \sum_{k \in U}\sum_{l \in U} (\pi_{kl} - \pi_k \pi_l)\, \frac{y_k}{\pi_k}\, \frac{y_l}{\pi_l}$$
        <p>La cantidad $\Delta_{kl} = \pi_{kl} - \pi_k \pi_l$ mide cuánto se aparta el diseño de seleccionar $k$ y $l$
          de forma independiente. Si $\Delta_{kl} = 0$ para todo par, el doble sumatorio se queda solo con la diagonal.</p>
      </div>

      <div class="definition">
        <h4><i class="fas fa-equals mr-2" aria-hidden="true"></i>Forma de Sen–Yates–Grundy</h4>
        <p>Si el diseño es de <strong>tamaño fijo</strong>, la varianza admite una forma equivalente y más legible:</p>
        $$V_{SYG}(\hat{t}_\pi) = -\frac{1}{2}\sum_{k \in U}\sum_{l \neq k} (\pi_{kl} - \pi_k \pi_l)
          \left(\frac{y_k}{\pi_k} - \frac{y_l}{\pi_l}\right)^{2}$$
        <p style="margin-bottom:0;">Dice algo que la primera forma esconde: la varianza depende de cuánto
          <strong>difieren entre sí</strong> los valores expandidos $y_k/\pi_k$. Si se pudiera elegir $\pi_k \propto
          y_k$, todos los $y_k/\pi_k$ serían iguales y la varianza sería <strong>cero</strong>. No se puede —$y_k$ es
          justo lo que no se conoce—, pero es el principio que justifica el diseño $\pi$PT del capítulo 6: usar una
          auxiliar $x_k$ parecida a $y_k$.</p>
      </div>

      <div class="simulador" data-simulador="ht-vs-expansion">
        <h4><i class="fas fa-scale-unbalanced" aria-hidden="true"></i> Horvitz–Thompson frente a la media muestral</h4>
        <p class="simulador-intro">El valor de dos estimadores en cada una de las diez muestras: $\hat{t}_\pi$ y el
          <em>estimador de expansión</em> $N\bar{y}$, que es lo que uno escribiría sin pensar. La línea horizontal es
          el total verdadero, $t = 150$. Con MAS los dos coinciden exactamente. En cuanto las $\pi_k$ dejan de ser
          iguales, $N\bar{y}$ se desplaza hacia arriba —porque el diseño saca más a menudo a los condados grandes— y
          <strong>ya no es insesgado</strong>, mientras que $\hat{t}_\pi$ sigue centrado en 150.</p>
        <div class="simulador-controles"></div>
        <div class="grafico-wrapper" style="height:250px;">
          <canvas aria-label="Valor de los dos estimadores en cada muestra posible" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="El estimador HT sobre una muestra">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R5⟧</code></pre>
          <pre><code class="language-r">⟦R6⟧</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">⟦P3⟧</code></pre>

      </div>

      <p>La esperanza de arriba se calculó <strong>exactamente</strong>, recorriendo las diez muestras y pesándolas por
        su $p(s)$. No es una simulación que se aproxima a 150: <em>es</em> 150. Con poblaciones de tamaño real eso deja
        de ser posible y hay que simular, pero conviene haber visto una vez la cuenta exacta.</p>

      <div class="warning">
        <p><strong>El estimador de la varianza no es la varianza.</strong> $V(\hat{t}_\pi)$ depende de todos los $y_k$
          de la población, que no se conocen. Lo que se calcula con la muestra es un <em>estimador</em> de esa varianza,
          que sustituye los pares $(k,l)$ de la población por los pares observados, divididos por $\pi_{kl}$:</p>
        $$\hat{V}(\hat{t}_\pi) = \sum_{k \in s}\sum_{l \in s} \frac{\pi_{kl} - \pi_k \pi_l}{\pi_{kl}}\,
          \frac{y_k}{\pi_k}\, \frac{y_l}{\pi_l}$$
        <p style="margin-bottom:0;">Y aquí hace falta $\pi_{kl} &gt; 0$ para todo par, no solo $\pi_k &gt; 0$. Cuando
          algún $\pi_{kl}$ es cero —muestreo sistemático, módulo 9— este estimador simplemente no existe.</p>
      </div>

  <template id="module-4">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 4</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Insesgadez de diseño y
          «muestra representativa» <span class="text-gray-400 font-normal text-2xl">/ Design unbiasedness</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Entender respecto de qué se toma la esperanza, y por qué
              «esta muestra es representativa» no es una frase que signifique algo.</p>
          </div>
        </div>
      </div>

      <p>El módulo anterior terminó con una muestra que daba 172,95 cuando el total era 150. Si una muestra concreta
        falla por un 15 %, <strong>¿en qué sentido es «bueno» el estimador?</strong> La respuesta se ve entera en la
        población de cinco condados, porque ahí sí se pueden mirar <em>todas</em> las muestras a la vez.</p>

      <p>Bajo el diseño desigual, las diez parejas dan diez valores distintos de $\hat t_\pi$: la pareja 12 da 98,46;
        la 35, esos 172,95; la 45, 187,95. Ninguno es 150. Pero si se promedian los diez <strong>pesando cada uno por
        su probabilidad de salir</strong>, el resultado es exactamente <strong>150,00</strong>. Y lo mismo ocurre con
        el MAS y con el estratificado: los tres diseños dan 150 en promedio, aunque su dispersión sea muy distinta
        (error estándar 47,5 en el MAS, 29,8 en el estratificado y 25,9 en el desigual).</p>

      <p>A esa propiedad —acertar en promedio sobre todas las muestras posibles, no en cada una— se le llama
        <strong>insesgadez de diseño</strong>, y es el criterio con el que se juzgan los estimadores de todo el
        curso.</p>

      <div class="definition">
        <h4><i class="fas fa-bullseye mr-2" aria-hidden="true"></i>Definición 2.6: insesgadez de diseño</h4>
        <p>Un estimador $\hat{\theta}$ es <strong>insesgado por diseño</strong> (<em>design-unbiased</em>) para
          $\theta$ si</p>
        $$E_p(\hat{\theta}) = \sum_{s \in Q} p(s)\, \hat{\theta}(s) = \theta$$
        <p style="margin-bottom:0;">El subíndice $p$ no es decorativo: la esperanza se toma sobre el
          <strong>diseño</strong>, es decir sobre las muestras que <em>podrían</em> haber salido. La población es fija;
          lo que varía de una repetición a otra es qué unidades se observan.</p>
      </div>

      <p>Esto responde una pregunta que a casi todo el mundo le incomoda la primera vez: <em>si solo tengo una muestra,
        ¿qué sentido tiene hablar de esperanza?</em> El mismo que tiene decir que una moneda es equilibrada después de
        lanzarla una vez. La insesgadez es una propiedad del <strong>procedimiento</strong>, no de la muestra que salió.
        Un buen procedimiento aplicado una vez puede dar un resultado malo; lo que se puede acotar es cuánto de malo,
        y eso es la varianza.</p>

      <p>Los tres diseños del capítulo lo muestran a la vez. Todos son insesgados con Horvitz–Thompson. Ninguno es
        insesgado con el estimador de expansión $N\bar{y}$, salvo el MAS. Y las varianzas son muy distintas:</p>

      <div class="tabla-ranking" data-ranking="disenos">
        <p class="tabla-ranking-titulo">Los tres diseños comparados</p>
        <div class="tabla-ranking-marco" aria-label="Comparación de los tres diseños de la población de cinco condados"></div>

      <p>Las dos filas coinciden hasta el último decimal, y no es casualidad: son dos expresiones algebraicamente
        equivalentes de la misma cantidad. Cuando en un problema real no coinciden, casi siempre es que el diseño no es
        de tamaño fijo —y entonces Sen–Yates–Grundy no aplica— o que hay un $\pi_{kl}$ mal calculado. <strong>Calcular
        toda varianza por dos caminos independientes es la regla de este material</strong>, no un adorno.</p>

      <div class="warning">
        <h4><i class="fas fa-triangle-exclamation mr-2" aria-hidden="true"></i>«Es que la muestra tiene que ser
          representativa»</h4>
        <p>La frase suena a que <em>una muestra concreta</em> puede examinarse y declararse representativa. No es así.
          Con MAS sobre los cinco condados, la muestra $\{1, 2\}$ —los dos más pequeños— tiene exactamente la misma
          probabilidad que cualquier otra, $1/10$, y da $\hat{t}_\pi = 80$ frente a un total de 150. Es una muestra
          mala, pero salió de un procedimiento correcto.</p>
        <p style="margin-bottom:0;">Lo que se puede exigir no es que la muestra «se parezca» a la población, sino que
          el <strong>procedimiento</strong> tenga tres propiedades: $\pi_k &gt; 0$ para todas las unidades,
          $\pi_k$ conocida, y $\pi_{kl} &gt; 0$ si además se quiere estimar la varianza. Con eso hay insesgadez y hay
          error estándar. Sin eso no hay nada, por mucho que la muestra «se vea equilibrada».</p>
      </div>

      <div class="note">
        <p><strong>El otro enfoque, en una frase.</strong> Existe una alternativa, la <em>inferencia basada en modelo</em>
          (<em>model-based</em>), en la que los $y_k$ sí se tratan como realizaciones de un modelo y la aleatoriedad
          viene de ahí. No es peor ni mejor: responde a otra pregunta, y es la que usa buena parte de la estadística
          que se ve en otros cursos. En el <strong>capítulo 3</strong> aparecerá mezclada con la de diseño en los

          Por ahora basta con saber que en este curso, salvo aviso, la esperanza es $E_p$.</p>
