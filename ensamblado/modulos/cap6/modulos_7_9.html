  <!-- MÓDULO 7 · Estimar la varianza del HT                         -->
  <!-- ============================================================ -->
  <template id="module-7">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Estimar la varianza del
          HT <span class="text-gray-400 font-normal text-2xl">/ Variance estimation</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Distinguir la varianza del HT de su estimador,
              conocer las dos formas del estimador cuando se tienen las probabilidades conjuntas $\pi_{kl}$, y las
              aproximaciones que se usan, casi siempre, cuando no se tienen.</p>
          </div>
        </div>
      </div>

      <h3>Por qué hacen falta las $\pi_{kl}$</h3>

      <p>El HT es una suma de términos $(y_k/\pi_k)\,I_k$, uno por unidad de la población. Su varianza incluye las
        covarianzas entre las indicadoras $I_k$ e $I_l$, que son $\Delta_{kl} = \pi_{kl} - \pi_k\pi_l$, donde
        $\pi_{kl}$ es la probabilidad de que $k$ y $l$ salgan juntas. Por eso estimar el total pide solo las
        $\pi_k$, pero estimar su varianza pide además las $\pi_{kl}$ de cada par.</p>

      <div class="formula">
        <p class="formula-titulo">La varianza del HT, de dos maneras</p>
        $$V(\hat{t}_\pi) = \sum_{k \in U}\sum_{l \in U} \Delta_{kl}\,\frac{y_k}{\pi_k}\,\frac{y_l}{\pi_l}$$
        $$V(\hat{t}_\pi) = \sum_{k < l} (\pi_k\pi_l - \pi_{kl})\left(\frac{y_k}{\pi_k} - \frac{y_l}{\pi_l}\right)^2$$
        <p style="margin-bottom:0;">La primera es la forma HT; la segunda, la de Sen–Yates–Grundy (SYG), vale para
          los diseños de tamaño fijo. Son la misma varianza escrita de dos maneras. Con tamaño fijo, si $k$ entra en la
          muestra quedan menos cupos para $l$, así que $\pi_{kl}$ suele ser menor que $\pi_k\pi_l$: la diferencia mide
          cuánto se excluyen las dos unidades. En Poisson vale 0.</p>
      </div>

      <h3>La varianza, con las cuatro tiendas</h3>

      <p>El diseño del módulo 4 da su matriz de $\pi_{kl}$ por enumeración. Con ella, la forma SYG reproduce la
        varianza exacta, 15 026:</p>

      <div class="note">
        <p><strong>¿Los pares con D o las muestras sin D?</strong> El módulo 4 cargaba las tres cuartas partes de la

      <h3>De la varianza a su estimador</h3>

      <p>Con las cuatro tiendas se conocen todas las ventas, así que la fórmula da la varianza verdadera. En una
        encuesta solo se ve la muestra, y la varianza hay que <em>estimarla</em> con los pares que salieron. Cada par
        $(k, l)$ sale con probabilidad $\pi_{kl}$, así que su término se divide entre $\pi_{kl}$: es el HT aplicado a
        los pares.</p>

      <div class="formula">
        <p class="formula-titulo">Los dos estimadores de la varianza</p>
        $$\widehat{V}_{HT} = \sum_{k \in s}\sum_{l \in s} \frac{\Delta_{kl}}{\pi_{kl}}\,\frac{y_k}{\pi_k}\,\frac{y_l}{\pi_l}$$
        $$\widehat{V}_{SYG} = \sum_{\substack{k < l \\ k, l \in s}} \frac{\pi_k\pi_l - \pi_{kl}}{\pi_{kl}}
        \left(\frac{y_k}{\pi_k} - \frac{y_l}{\pi_l}\right)^2$$
        <p style="margin-bottom:0;">En la primera, el término de $k = l$ es $(1 - \pi_k)\,y_k^2/\pi_k^2$. Los dos
          son insesgados si todas las $\pi_{kl} > 0$; el de SYG, además, solo con tamaño fijo. El de SYG no puede salir negativo si se cumple la condición de
          Yates–Grundy, $\pi_k\pi_l \ge \pi_{kl}$ para todos los pares, porque entonces todos sus términos son
          positivos o cero.</p>
      </div>

      <p>El bloque calcula los dos estimadores en cada una de las 6 muestras posibles de las tiendas:</p>

      <p>La forma HT sale <strong>negativa</strong> en tres muestras (AB, AC y BC: −2342, −1241 y −1360), y una

      </div>

      <p>Con la matriz se pueden calcular las dos formas. El bloque añade una tercera, la aproximación con reemplazo:

      <p>El total estimado es de 936 millones de acres. Con las mismas $\pi_{kl}$, la forma SYG da un error estándar

        positivos, y <code>agpps</code> cumple la condición de Yates–Grundy. La aproximación con reemplazo da 12,3
        millones, cerca de SYG.</p>

      <h3>Cuando no hay $\pi_{kl}$: la aproximación con reemplazo</h3>

      <p>Casi ningún diseño real da sus $\pi_{kl}$, y el sistemático ni siquiera las tiene todas positivas. La salida
        más usada es tratar la muestra como si fuera con reemplazo. Por el módulo 4, $\pi_k \approx n\,\psi_k$, así
        que se toma $\psi_k = \pi_k/n$ y cada unidad da una estimación del total, $z_k = y_k/\psi_k = n\,y_k/\pi_k$.
        La varianza se estima como en el Hansen–Hurwitz del módulo 2, $\widehat{V} = s_z^2/n$. Las unidades
        forzosas se dejan fuera, porque no aportan varianza; así lo hizo el bloque del módulo 5.</p>

      <p>Solo pide las $\pi$ de primer orden, y es conservadora: sobrestima la varianza, porque ignora que sin
        reemplazo una unidad no se repite. El exceso crece con $n/N$. Lohr la recomienda en general (su ec. 6.24).
        Con los estados ($n/N = 0{,}2$), su esperanza es 1,53 veces la varianza verdadera del sistemático; con
        cientos de UPM, la diferencia se vuelve despreciable.</p>

      <details class="profundizar">
        <summary>Para profundizar: la aproximación de Hájek–Deville</summary>
        <div class="profundizar-cuerpo">
          <p>Esta parte amplía el módulo y no hace falta para seguir el capítulo.</p>

          <p>Gutiérrez (Resultado 4.4.4) presenta una aproximación más fina, que también usa solo las $\pi$ de primer
            orden. Corrige el defecto de la anterior: una unidad con $\pi_k$ cerca de 1 casi no aporta varianza.</p>

          <div class="formula">
            <p class="formula-titulo">Estimador de Deville</p>
            $$\widehat{V}(\hat{t}_\pi) = \sum_{k \in s} c_k \left(\frac{y_k}{\pi_k} - \hat{R}\right)^2, \qquad
            c_k = (1 - \pi_k)\,\frac{n}{n - 1}$$
            $$\hat{R} = \frac{\sum_{l \in s} c_l\,y_l/\pi_l}{\sum_{l \in s} c_l}$$
            <p style="margin-bottom:0;">$\hat{R}$ es el promedio de los cocientes $y_k/\pi_k$ de la muestra, ponderado
              por los $c_k$. El estimador mide cuánto se aleja cada cociente de ese promedio: es la idea central del
              capítulo convertida en estimador. El factor $1 - \pi_k$ es el mismo de la varianza de Poisson (módulo 6), y
              hace que una unidad con $\pi_k$ cerca de 1 casi no cuente.</p>
          </div>

          <p>La <strong>aproximación de Hájek</strong> es la misma cuenta hecha sobre toda la población, con
            $b_k = N\,\pi_k(1 - \pi_k)/(N - 1)$ en lugar de $c_k$: da la varianza que tendría el HT, sin necesidad de
            ninguna $\pi_{kl}$. Las dos funcionan bien en los diseños de alta entropía del módulo 5, como el de Brewer
            o los de Tillé y máxima entropía de su «Para profundizar».</p>

          <div class="code-tabs">
            <div class="code-tabs-nav" role="tablist" aria-label="Las aproximaciones de Hájek y Deville">
              <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
            </div>
            <div class="code-tab-panel" data-lang="r">
              <pre><code class="language-r">⟦R23⟧</code></pre>
            </div>
          </div>

          <p><strong>La aproximación.</strong> Con los estados, la de Hájek da 726 308, frente a la varianza exacta del
            diseño de máxima entropía, 723 607: una diferencia del 0,4 %, sin usar ninguna $\pi_{kl}$.</p>

          <p><strong>El estimador.</strong> Sobre el sistemático alfabético, el estimador de Deville vale en promedio
            1,23 veces la varianza verdadera, frente a 1,53 de la aproximación con reemplazo. Sigue sobrestimando, porque
            el orden de la lista le da al sistemático menos varianza que a un diseño de alta entropía, pero bastante menos.

        </div>
      </details>

      <p>En resumen:</p>

      <table>
        <caption class="sr-only">Qué estimador de la varianza usar en cada caso</caption>
        <thead>
          <tr><th scope="col">Situación</th><th scope="col">Estimador de la varianza</th></tr>
        </thead>

          <tr><td>Tamaño aleatorio, como en Poisson</td><td>Forma HT (en Poisson, la fórmula del módulo 6)</td></tr>

  <!-- MÓDULO 8 · Cuándo el HT se comporta mal                       -->

  <template id="module-8">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 8</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Cuándo el HT se comporta
          mal <span class="text-gray-400 font-normal text-2xl">/ When HT breaks down</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Entender cómo falla el estimador de Horvitz–Thompson
              cuando una unidad con un valor grande tiene una probabilidad de inclusión pequeña, y qué decisiones de
              diseño lo evitan.</p>
          </div>
        </div>
      </div>

      <p>En el módulo 5, el πPT perdió con <code>waterarea</code> por un solo estado, Alaska: poca población, así
        que una $\pi$ pequeña (0,023), y el 36 % del agua del país. El HT es insesgado siempre, pero eso no impide que
        su varianza sea enorme. Este módulo muestra por qué.</p>

      <h3>El mecanismo, en una fórmula</h3>

      <p>Con Poisson la varianza del HT tiene la fórmula más simple del capítulo (módulo 6), y deja ver el problema
        término a término:</p>

      $$V(\hat{t}_\pi) = \sum_{k \in U}\left(\frac{1}{\pi_k} - 1\right) y_k^2.$$

      <p>Cada unidad aporta $(1/\pi_k - 1)\,y_k^2$. Si $\pi_k$ es pequeña y $y_k$ grande, ese término crece sin
        tope; si $\pi_k = 1$, vale cero. Con tamaño fijo la fórmula es otra, pero el problema es el mismo.</p>

      <h3>Un ejemplo: el elefante</h3>

      <p>Este fallo se conoce como el problema del elefante de Basu. El nombre viene de un ejemplo famoso de Basu
        (1971), que Lohr cuenta en su §6.7. Un dueño de circo quiere
        estimar el peso total de sus 50 elefantes pesando uno solo. Su estadístico propone sortear el elefante mediano
        con probabilidad 99/100 y cada uno de los otros 49 con 1/4900; en total, $0{,}99 + 49/4900 = 1$. El total
        buscado es unas 50 veces el peso de un elefante. Si sale el mediano, el HT da 100/99 veces su peso, casi 50
        veces menos de lo que debería; si sale otro, 4900 veces su peso, casi 100 veces más. El estimador es
        insesgado, y absurdo con cualquier muestra.</p>

      <p>El bloque construye otro ejemplo con la misma lógica: una población simulada de 20 negocios cuyas ventas
        son proporcionales a su área, salvo una: el «elefante», con el área más pequeña y el 82 % de las ventas. Es la tienda D del módulo 1 al revés:
        allí el área anticipaba las ventas; aquí las contradice. Con $\pi$ proporcional al área y $n = 5$, al elefante
        le toca $\pi = 0{,}0649$:</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="La curva de la varianza explosiva">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R12⟧</code></pre>
        </div>
      </div>

      <p>El HT oscila entre dos mundos. El 93,5 % de las veces el elefante no sale, y el HT solo ve, más o menos, el
        resto de las ventas: unas 1936 de un total de 10 726. Cuando sale, su término $y/\pi$ vale 135 366, más de doce
        veces el total. En promedio da el total, pero casi nunca se acerca a él.</p>

      <div class="simulador" data-simulador="explosiva">
        <h4><i class="fas fa-bomb" aria-hidden="true"></i> El elefante y su π</h4>
        <p class="simulador-intro">Cada barra es lo que aporta un negocio a la varianza, $(1/\pi_k - 1)\,y_k^2$; la
          naranja es el elefante. El eje es logarítmico: cada marca multiplica por 10. Con la $\pi$ que le toca por su
          área (0,065), el elefante ya pone el 99,95 % de la varianza. Mueve su $\pi$: bajarla a 0,005 multiplica la
          varianza total por 13,8, y la deja unas 200 veces por encima de la que tendría con $\pi = 0{,}5$. Subirla
          la reduce, y con $\pi = 1$ su término desaparecería.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Aporte de cada unidad a $V$ bajo Poisson (escala log)</p>
        <div class="grafico-wrapper" style="height:260px;">
          <canvas aria-label="Aporte de cada unidad a la varianza, con el elefante resaltado" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <h3>Cómo se evita</h3>

      <div class="warning">
        <p><strong>Cuatro defensas, según el momento.</strong></p>
        <ol style="margin-bottom:0.5rem;">
          <li><strong>Antes de muestrear: tamaños al día.</strong> El elefante suele nacer de una medida de tamaño
            desactualizada: el negocio creció y su $x_k$ no.</li>
          <li><strong>Al diseñar: inclusión forzosa.</strong> Ante la sospecha, $\pi_k = 1$, y esa unidad deja de
            aportar varianza (módulo 5).</li>
          <li><strong>Al estimar: el estimador de razón</strong> (capítulo 3), si hay una variable auxiliar que sí
            acompañe a $y$. Lohr (§6.7) cierra así la historia de Basu: con $x_i$, el peso de cada elefante hace tres
            años, conocido para los 50, el estimador de razón da $t_x\,y_i/x_i$, el peso de la manada de entonces
            multiplicado por cuánto cambió el elefante pesado, y es razonable salga el que salga. No salva el ejemplo
            de los 20 negocios: allí la variable auxiliar sería la misma área que no anticipa las ventas del
            elefante.</li>
          <li><strong>Después: recortar el peso.</strong> Si el elefante ya salió con un peso enorme, se le puede
            poner un tope, a cambio de un pequeño sesgo. El capítulo 7 lo trata.</li>
        </ol>
        <p style="margin-bottom:0;">Lo que <strong>no</strong> es una defensa: borrar la observación «rara». Esa
          unidad es legítima; el problema fue el diseño que le dio una $\pi$ pequeña.</p>
      </div>

      <p>El mismo problema aparece en ciencia de datos cuando se usan pesos $1/\psi$ con $\psi$ muy pequeñas; el
        módulo 10 lo retoma.</p>

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">PPT en dos etapas
          <span class="text-gray-400 font-normal text-2xl">/ Two-stage PPS</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Armar el diseño de muchas encuestas reales —UPM
              sorteadas con PPT y el mismo número de unidades en cada una— y ver por qué todas las unidades acaban con
              el mismo peso.</p>
          </div>
        </div>
      </div>

      <p>Este módulo junta el capítulo 5 con este: conglomerados <em>y</em> probabilidades desiguales. En el
        capítulo 5, las escuelas se sorteaban con la misma probabilidad y se entrevistaba el mismo número de
        estudiantes en cada una. Así, un estudiante de una escuela grande tenía menos probabilidad de salir que uno de
        una escuela pequeña, y los pesos quedaban muy desiguales. La solución es sortear las UPM <strong>con
        PPT</strong>:</p>

      <div class="diagrama-diseno" data-diagrama="ppt-dos-etapas"></div>

      <div class="note">
        <p><strong>Los datos: <code>classes</code> y <code>classpps</code> (Lohr, ej. 6.11).</strong> El marco,
          <code>classes</code>, trae las 15 clases de estadística de una universidad, con $K = 647$ estudiantes en
          total; la clase $i$ tiene $M_i$ estudiantes. $M_i$ es la medida de tamaño, la $x_k$ de los módulos
          anteriores, y $K$ su total, la $t_x$; aquí se escriben como en el capítulo 5. La muestra está en
          <code>classpps</code>. Lohr sorteó $n = 5$
          clases sin reemplazo con $\pi_i = 5M_i/647$, y salieron la 1, la 4, la 9, la 10 y la 14; no dice con qué
          algoritmo, y con esas $\pi$ serviría cualquiera de los del módulo 5. En cada una
          sorteó $m = 4$ estudiantes y les preguntó cuántas horas estudian estadística (<code>hours</code>).</p>
      </div>

      <h3>La probabilidad de cada estudiante</h3>

      <p>Un estudiante sale si sale su clase y si después sale él dentro de ella. Su probabilidad es el producto de
        las dos etapas:</p>

      $$\frac{5\,M_i}{647} \times \frac{4}{M_i} = \frac{20}{647} = 0{,}0309.$$

      <p>El $M_i$ se cancela: una clase grande tiene más probabilidad de salir, y dentro de ella cada estudiante
        tiene menos, en la misma proporción. Todos los estudiantes del marco tienen la misma probabilidad, y por eso
        el mismo peso, $647/20 = 32{,}35$.</p>

      <div class="definition">
        <h4>Diseño autoponderado</h4>
        <p style="margin-bottom:0;">Un diseño es <strong>autoponderado</strong> si todas las unidades observadas
          tienen el mismo peso. Sortear las UPM con PPT y el mismo número $m$ de unidades en cada una lo consigue:
          $w = \dfrac{K}{n M_i}\cdot\dfrac{M_i}{m} = \dfrac{K}{nm}$. El primer factor es el inverso de la
          probabilidad de la clase; el segundo, el de la probabilidad del estudiante dentro de ella. Con un peso
          común, la media estimada es la media simple de los datos.</p>
      </div>

      <p>Por eso este esquema es tan común en las encuestas grandes que se hacen en persona. Lohr (ej. 6.12) describe
        la encuesta de seroprevalencia de COVID-19 en España: secciones censales sorteadas con PPT y 24 hogares en
        cada una. Dentro de cada estrato la muestra quedó aproximadamente autoponderada, y cada sección dio la misma
        carga de trabajo, conocida de antemano. Gutiérrez (§7.3.1) da el mismo motivo: fijar el número de entrevistas
        por UPM es una forma de controlar el trabajo de campo.</p>

      <h3>El estimador y su varianza</h3>

      <p>Las clases se sortearon sin reemplazo, pero se analizan <em>como si</em> fuera con reemplazo: cada clase se
        trata como una extracción del módulo 2, con probabilidad $\psi_i = \pi_i/5 = M_i/647$. Es la aproximación
        $\pi \approx n\,\psi$ de los módulos 4 y 7, y su ventaja es que la varianza se estima con la dispersión
        entre clases, sin ninguna $\pi_{kl}$.</p>

      <p>Cada clase da su propia estimación del total de horas de todo el marco. Primero se estima el total de la
        clase, $\hat{t}_i = M_i\,\bar{y}_i$, y después se expande con $\psi_i$:</p>

      $$z_i = \frac{\hat{t}_i}{\psi_i}, \qquad \hat{t} = \frac{1}{5}\sum_{i} z_i,$$
      $$\widehat{V}(\hat{t}) = \frac{s_z^2}{5}.$$

      <p><strong>A mano, con la clase 14.</strong> Tiene $M_{14} = 100$ estudiantes, y los 4 de la muestra estudian
        en promedio $\bar{y}_{14} = 2{,}0$ horas. El total estimado de la clase es $\hat{t}_{14} = 200$, y
        con $\psi_{14} = 100/647 = 0{,}155$, la estimación del total de horas de todo el marco que da esta clase es
        $z_{14} = 1294$. En general, $z_i = M_i\,\bar{y}_i \cdot 647/M_i = 647\,\bar{y}_i$, y el estimador
        promedia los cinco: $647$ por la media de las cinco $\bar{y}_i$, que es 3,45.</p>

      <p>Los $z_i$ varían por dos razones: qué clase salió (la primera etapa) y qué 4 estudiantes salieron dentro de
        ella, que deciden $\bar{y}_i$ (la segunda). La dispersión de los $z_i$ entre clases recoge las dos a la vez,
        y por eso la varianza de la segunda etapa no necesita un término aparte.</p>
