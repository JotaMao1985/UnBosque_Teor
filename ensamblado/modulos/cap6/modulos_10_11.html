      <h3>El mismo estimador, con otro nombre</h3>

      <p>El estimador de Hansen–Hurwitz del módulo 2, $\frac{1}{n}\sum y_i/\psi_i$, se usa desde los años
        cincuenta fuera de las encuestas con otro nombre: <strong>muestreo por importancia</strong>
        (<em>importance sampling</em>), para estimar por Monte Carlo sumas o integrales difíciles. La traducción es
        directa:</p>

      <table>
        <caption class="sr-only">Correspondencia entre el PPT con reemplazo y el muestreo por importancia</caption>
        <thead>
          <tr><th scope="col">Encuestas (este capítulo)</th><th scope="col">Muestreo por importancia</th></tr>
        </thead>
        <tbody>
          <tr><td>unidad $i$ del marco</td><td>punto $u_i$ donde se evalúa la función</td></tr>
          <tr><td>valor $y_i$ de la unidad</td><td>valor de la función, $f(u_i)$</td></tr>
          <tr><td>probabilidad de extracción $\psi_i$</td><td>la «propuesta» con la que se eligen los puntos</td></tr>
          <tr><td>peso $1/(n\,\psi_i)$</td><td>peso de importancia</td></tr>
          <tr><td>total $t$</td><td>la suma o la integral de $f$</td></tr>
          <tr><td>Hansen–Hurwitz, $\frac{1}{n}\sum y_i/\psi_i$</td><td>estimador por importancia,
            $\frac{1}{n}\sum f(u_i)/\psi_i$</td></tr>
        </tbody>
      </table>

      <p>La pregunta central de esa literatura —qué propuesta da menos varianza— ya la respondió el capítulo. Con
        $y \ge 0$ y $\psi_i = y_i/t$, cada extracción da $y_i/\psi_i = t$, siempre la misma cifra: varianza cero. Es
        la idea central del módulo 1 llevada al extremo. El problema es que para usarla habría que conocer $y$, que
        es justo lo que se quiere estimar. En la práctica se busca una $\psi$ parecida a $y$ con una variable barata
        que se conozca para todas las unidades.</p>

      <p>Con los estados, el bloque compara tres propuestas para estimar el total de condados con 10
        extracciones:</p>

      <p>La propuesta uniforme da una varianza de 557 287; la proporcional a la población, 963 006, peor; la

      <h3>Un ejemplo más realista: BigLucy</h3>

      <div class="note">
        <p><strong>Los datos: <code>BigLucy</code></strong> (paquete <code>TeachingSampling</code>, de Gutiérrez).
          Son 85 296 empresas ficticias. Se quiere estimar su ingreso total (<code>Income</code>) con $n = 100$
          extracciones, y el número de empleados (<code>Employees</code>) se conoce para todas y sirve para construir
          la propuesta.</p>
      </div>

      <p>El simulador mezcla tres propuestas con un parámetro $\alpha$ entre 0 y 2: la uniforme,
        $\psi^{U}$; la proporcional a los empleados, $\psi^{E}$; y la ideal, proporcional al propio ingreso,
        $\psi^{I}$:</p>

      $$\psi(\alpha) = (1 - \alpha)\,\psi^{U} + \alpha\,\psi^{E} \quad \text{si } 0 \le \alpha \le 1$$
      $$\psi(\alpha) = (2 - \alpha)\,\psi^{E} + (\alpha - 1)\,\psi^{I} \quad \text{si } 1 \le \alpha \le 2$$

      <div class="simulador" data-simulador="importancia">
        <h4><i class="fas fa-crosshairs" aria-hidden="true"></i> El camino hacia la propuesta perfecta</h4>
        <p class="simulador-intro">La curva es la varianza exacta del HH para cada $\alpha$. Fíjate en tres tramos.
          De 0 a 0,6, mezclar la propuesta de empleados con la uniforme mejora: en $\alpha = 0{,}6$, con un 40 % de
          uniforme, la varianza es 1,8 veces menor que con la uniforme sola. En $\alpha = 1$, solo con empleados,
          vuelve a subir: mejora solo 1,3 veces, aunque la correlación con el ingreso es 0,64. De 1 a 2 la varianza
          cae a cero, pero ese tramo exige conocer el ingreso.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Varianza exacta del HH según la propuesta interpolada</p>
        <div class="grafico-wrapper" style="height:260px;">
          <canvas aria-label="Curva de la varianza exacta al interpolar la propuesta de importancia" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <p>¿Por qué la mezcla le gana a la propuesta de empleados? Por el criterio de Raj del módulo 5: la recta del
        ingreso sobre los empleados corta el eje en 99,9, el 23 % del ingreso medio (429,5). El ingreso no es
        proporcional a los empleados: una empresa pequeña tiene más ingreso por empleado que una grande, y
        $\psi \propto$ empleados les da a todas las pequeñas, en conjunto, menos probabilidad de la que su ingreso
        pide. No hay un elefante: la varianza está repartida entre miles de empresas. La parte uniforme de la mezcla
        le suma a $\psi$ un término fijo, igual para todas, que hace el papel de ese intercepto.</p>

      <p>Mezclar la propuesta con un poco de uniforme es, además, una defensa conocida, la <strong>mezcla defensiva</strong>
        (<em>defensive mixture</em>): pone un piso a las $\psi$, y con él un techo a los pesos $1/\psi$. Como la
        inclusión forzosa del módulo 8, impide que una unidad que puede tener un valor grande reciba una probabilidad
        demasiado pequeña.</p>

      <h3>Dónde aparece en ciencia de datos</h3>

      <div class="note">
        <p><strong><em>Active learning</em>.</strong> Hay 10 000 imágenes sin etiquetar y solo se pueden etiquetar
          100. Si se eligen con probabilidad proporcional a la duda del modelo, se aprende más de cada etiqueta. Pero
          para estimar la tasa de error del modelo con esas 100 imágenes, cada una tiene que pesar $1/\psi$, como en
          Hansen–Hurwitz: sin los pesos, la estimación queda sesgada hacia las imágenes difíciles.</p>
        <p style="margin-bottom:0;">El mismo esquema aparece en otros métodos de aprendizaje automático que
          reutilizan datos recogidos con probabilidades distintas de las que interesan, y con el mismo riesgo: pesos
          $1/\psi$ con $\psi$ muy pequeñas reproducen el problema del elefante.</p>
      </div>

      <div class="warning">
        <p><strong>La condición que no se negocia: $\psi$ conocida y positiva.</strong> La insesgadez descansa en
          conocer $\psi_i$ para lo que se muestreó y en que ninguna unidad tenga $\psi_i = 0$: una unidad que nunca
          puede salir no entra en ninguna estimación. Un conjunto de datos recogido «según llegaba» no tiene $\psi$
          conocida, y ninguna ponderación posterior lo arregla del todo. Es el sesgo de selección del capítulo 1.</p>
      </div>
