            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>

      <p>Quita del módulo 2 la palabra «tienda» y pon «punto de evaluación»: el estimador
        $\frac{1}{n}\sum y_i/\psi_i$ con extracciones de una «propuesta» $\psi$ es, literalmente, el
        <strong>muestreo por importancia</strong> con el que Monte Carlo integra funciones difíciles desde los
        años 50. La teoría del capítulo responde la pregunta central de esa literatura — ¿qué propuesta minimiza
        la varianza? — con la fórmula de HH: la $\psi$ óptima es proporcional a $|y|$, y la varianza es
        <em>exactamente cero</em> si $\psi_i = y_i/t$. El problema, claro: para usarla habría que conocer $y$.</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Tres propuestas y sus varianzas exactas">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R15⟧</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">⟦P5⟧</code></pre>
        </div>
      </div>

      <div class="simulador" data-simulador="importancia">
        <h4><i class="fas fa-crosshairs" aria-hidden="true"></i> El camino hacia la propuesta perfecta</h4>
        <p class="simulador-intro">Sobre BigLucy (85 296 empresas, estimar el ingreso total con $n = 100$): el
          deslizador interpola la propuesta desde el uniforme ($\alpha = 0$), pasando por $\psi \propto$
          empleados ($\alpha = 1$, lo que un diseñador real puede hacer), hasta $\psi \propto y$
          ($\alpha = 2$, la perfección inalcanzable). La curva es la varianza <strong>exacta</strong> del
          precálculo. Nota la asimetría del viaje: de 0 a 1 se gana poco (correlación 0,64); casi toda la
          ganancia vive entre 1 y 2 — donde ya no se puede caminar.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Varianza exacta del HH según la propuesta interpolada</p>
        <div class="grafico-wrapper" style="height:260px;">
          <canvas aria-label="Curva de la varianza exacta al interpolar la propuesta de importancia" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <div class="note">
        <p><strong>Dónde vive esto en la IA de hoy.</strong> <em>Active learning:</em> etiquetar los ejemplos
          donde el modelo más duda es darles $\psi$ grande — y los pesos $1/\psi$ son obligatorios para que la
          pérdida estimada siga siendo insesgada, exactamente como en HH. <em>Priorizado en RL:</em> los
          <em>replay buffers</em> muestrean transiciones con $\psi \propto$ error TD y corrigen con pesos de
          importancia. <em>Evaluación off-policy:</em> $y/\psi$ con colas pesadas es el elefante del módulo 8 con
          otro nombre. Las tres comunidades redescubrieron, con décadas de diferencia, el mismo teorema de
          varianza que este capítulo enumeró con cuatro tiendas.</p>
      </div>

      <div class="warning">
        <p><strong>La condición no negociable: $\psi$ conocida y positiva.</strong> Todo el edificio — insesgadez
          incluida — descansa en conocer $\psi_i$ para lo muestreado y en $\psi_i > 0$ para todo el soporte. Un
          <em>dataset</em> recolectado «según llegaba» no tiene $\psi$ conocida, y ninguna ponderación posterior
          lo arregla del todo: ese es el puente con el capítulo 1 (sesgo de selección) y con el 8 (ajustes por no
          respuesta, que son intentos de <em>reconstruir</em> una $\psi$ que nadie anotó).</p>
      </div>
