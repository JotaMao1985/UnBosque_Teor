  <!-- MÓDULO 1 · ¿Por qué probabilidades desiguales?                -->
  <!-- ============================================================ -->
  <template id="module-1">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 1</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">¿Por qué probabilidades
          desiguales? <span class="text-gray-400 font-normal text-2xl">/ Why unequal probabilities</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Ver con cuatro tiendas por qué conviene que las
              unidades grandes tengan más probabilidad de salir, y comprobar a mano que el estimador sigue siendo
              insesgado.</p>
          </div>
        </div>
      </div>

      <p>En los capítulos anteriores, casi todos los diseños daban a cada unidad la misma probabilidad de salir, o
        la misma dentro de cada estrato. Eso funciona cuando las unidades se parecen. Cuando unas son mucho más grandes
        que otras —al final del capítulo 5, Texas con 254 condados y Delaware con 3—, sortearlas por igual desperdicia lo que
        ya se sabe de ellas.</p>

      <p>La idea de este capítulo cabe en una frase: <strong>dar a cada unidad una probabilidad de salir
        proporcional a su tamaño</strong>. Es el muestreo con <strong>probabilidad proporcional al tamaño</strong>
        (PPT; en inglés, <em>pps</em>).</p>

      <h3>Un ejemplo con cuatro tiendas</h3>

      <p>Lohr abre su capítulo 6 (§6.1) con un ejemplo pequeño. Un pueblo tiene cuatro supermercados, A, B, C y D, y
        se quiere estimar el total de sus ventas del último mes visitando <strong>una sola tienda</strong>. Del marco
        se conoce el área de cada tienda. Las ventas solo se conocen de la tienda que salga. La tienda D tiene diez
        veces el área de la A y hace el 82 % de las ventas: si el sorteo trata igual a las cuatro, el azar decide si
        la muestra ve el 82 % de las ventas (la D) o el 4 % (la A).</p>

      <p>En el ejemplo se conocen las ventas de las cuatro tiendas, y suman $t = 300$ (miles de dólares). No es
        trampa: sirve para calcular todo lo que el sorteo <em>podría</em> dar. En una encuesta real solo se verían las
        ventas de la tienda que saliera.</p>

      <p>Para cada tienda $i$ hay tres cantidades: su área $x_i$, que se conoce; sus ventas $t_i$, que se quieren
        estimar; y su probabilidad de salir en el sorteo, $\psi_i$ (la letra griega psi).</p>

      <p>Si cada tienda sale con probabilidad proporcional a su área, la A sale una vez de cada 16, porque ocupa
        100 de los 1600 m². ¿Cómo estimar el total si sale la A? Sus ventas representan las de 16 «tiendas como la
        A», así que la estimación es $16 \times 11 = 176$. En general, <strong>se divide el valor observado entre su
        probabilidad de salir</strong>. La tabla hace la cuenta para las cuatro tiendas.</p>

      <table>
        <caption class="sr-only">Las cuatro tiendas con el sorteo proporcional al área</caption>
        <thead>
          <tr>
            <th scope="col">Tienda</th><th scope="col">Área $x_i$ (m²)</th><th scope="col">$\psi_i = x_i/1600$</th>
            <th scope="col">Ventas $t_i$</th><th scope="col">$t_i/\psi_i$</th>
            <th scope="col">$\psi_i\,(t_i/\psi_i - 300)^2$</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>A</td><td>100</td><td>0,0625</td><td>11</td><td>176</td><td>961</td></tr>
          <tr><td>B</td><td>200</td><td>0,125</td><td>20</td><td>160</td><td>2450</td></tr>
          <tr><td>C</td><td>300</td><td>0,1875</td><td>24</td><td>128</td><td>5547</td></tr>
          <tr><td>D</td><td>1000</td><td>0,625</td><td>245</td><td>392</td><td>5290</td></tr>
          <tr><td><strong>Total</strong></td><td>1600</td><td>1</td><td style="white-space:nowrap;"><strong>$t = 300$</strong></td><td>—</td>
            <td><strong>14 248</strong></td></tr>
        </tbody>
      </table>

      <p>La columna de ventas es lo que no se conoce antes de muestrear. La columna $t_i/\psi_i$ es la estimación del
        total que daría la muestra si saliera esa tienda. La última columna sirve para la varianza, más abajo.</p>

      <div class="definition">
        <h4>Probabilidad de selección $\psi_i$ y su estimador</h4>
        <p>En un sorteo de <strong>una extracción</strong>, $\psi_i$ es la probabilidad de que salga la unidad
          $i$. Las $\psi_i$ de todo el marco suman 1. Si sale la unidad $i$, el total se estima con
          $\hat{t}_\psi = t_i/\psi_i$: el valor observado dividido entre su probabilidad de salir.</p>
        <p style="margin-bottom:0;">El sorteo es <strong>PPT</strong> cuando $\psi_i = x_i/t_x$, con $x_i$ una
          medida de tamaño conocida para todo el marco y $t_x = \sum_j x_j$ su total. En las tiendas, $x_i$ es el
          área, $t_x = 1600$ y $\psi_D = 1000/1600 = 0{,}625$.</p>
      </div>

      <p>Con una sola extracción, $\psi_i$ es la probabilidad de inclusión $\pi_i$ del capítulo 2, y $1/\psi_i$ es
        el peso de siempre. Con varias extracciones las dos dejan de coincidir; el módulo 4 explica en qué se
        diferencian.</p>

      <h3>Es insesgado con cualquier elección de las $\psi_i$</h3>

      <p>La esperanza del estimador se calcula sobre las cuatro muestras posibles, cada una con su probabilidad:</p>

      $$E(\hat{t}_\psi) = \sum_i \psi_i \,\frac{t_i}{\psi_i} = \sum_i t_i = 11 + 20 + 24 + 245 = 300.$$

      <p>Cada $\psi_i$ se cancela con la que divide. Por eso el estimador es insesgado sean cuales sean las
        $\psi_i$, siempre que todas sean positivas. La elección de las $\psi_i$ no afecta al sesgo: afecta a la
        varianza.</p>

      <h3>Lo que cambia es la varianza</h3>

      <p>La varianza es el promedio de las distancias al cuadrado entre cada estimación posible y el total, cada una
        ponderada por su probabilidad. Es la suma de la última columna de la tabla:</p>

      $$V(\hat{t}_\psi) = \sum_i \psi_i\left(\frac{t_i}{\psi_i} - t\right)^2 = 961 + 2450 + 5547 + 5290 = 14\,248.$$

      <p>Ahora el sorteo de siempre: las cuatro tiendas con la misma probabilidad, $\psi_i = 1/4$. La estimación
        pasa a ser $4\,t_i$, es decir, 44, 80, 96 o 980 según la tienda: es el estimador de expansión del capítulo 2,
        $N$ veces el valor observado. Su promedio sigue siendo 300, porque también es insesgada, pero su varianza sube a
        $\frac{1}{4}\sum_i (4\,t_i - 300)^2 = 154\,488$. Es decir: <strong>con una sola tienda visitada en los dos
        sorteos, el proporcional tiene 10,8 veces menos varianza.</strong></p>

      <p>¿De dónde sale la diferencia? De la columna $t_i/\psi_i$. Con el sorteo proporcional, las cuatro
        estimaciones van de 128 a 392; con probabilidades iguales, de 44 a 980.</p>

      <div class="definition">
        <h4>La idea central del capítulo</h4>
        <p style="margin-bottom:0;">La varianza es pequeña cuando $t_i/\psi_i$ cambia poco de una unidad a otra. Eso
          ocurre cuando la probabilidad de cada unidad es aproximadamente proporcional a su valor $t_i$; aquí ocurre
          porque las ventas crecen con el área. Sin reemplazo, desde el módulo 4, la misma idea se escribe con
          $y_k/\pi_k$.</p>
      </div>

  <!-- MÓDULO 2 · Hansen-Hurwitz: con reemplazo                      -->
  <!-- ============================================================ -->
  <template id="module-2">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">

        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">El estimador de
          Hansen–Hurwitz <span class="text-gray-400 font-normal text-2xl">/ Sampling with replacement</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Pasar de una extracción a $n$ extracciones con
              reemplazo, comprobar con las cuatro tiendas que el estimador de Hansen–Hurwitz es insesgado y ver de qué
              depende su varianza.</p>
          </div>
        </div>
      </div>

      <h3>De una extracción a varias</h3>

      <p>Con una sola tienda, la estimación depende mucho de cuál salga. Para reducir esa variación se observan
        varias unidades. La forma más simple de hacerlo con probabilidades desiguales es <strong>repetir $n$ veces el
        sorteo del módulo 1, con reemplazo</strong>: después de cada extracción, la unidad vuelve al marco y puede
        salir otra vez. En cada extracción las cuatro tiendas tienen las mismas $\psi_i$, así que lo que sale en una
        no afecta a las demás: las extracciones son independientes.</p>

      <p>Con varias extracciones, $\psi_i$ sigue siendo la probabilidad de salir <em>en cada una</em>, pero ya no es
        la probabilidad de estar en la muestra: con dos extracciones, por ejemplo, D entra en la muestra si sale en
        cualquiera de las dos. Por eso, desde
        aquí, $\psi_i$ y la $\pi_i$ del capítulo 2 dejan de coincidir.</p>

      <p>Cada extracción da su propia estimación del total, $t_i/\psi_i$ de la unidad que salió, la misma del
        módulo 1. El
        estimador de <strong>Hansen–Hurwitz</strong> (HH, por los autores que lo propusieron en 1943) es su
        promedio:</p>

      <div class="formula">
        <p class="formula-titulo">Estimador de Hansen–Hurwitz y su varianza</p>
        $$\hat{t}_{HH} = \frac{1}{n}\sum_{j=1}^{n} z_j, \qquad z_j = \frac{t_i}{\psi_i}
        \ \text{ si en la extracción } j \text{ salió la unidad } i$$
        $$V(\hat{t}_{HH}) = \frac{1}{n}\sum_{i=1}^{N} \psi_i\left(\frac{t_i}{\psi_i} - t\right)^2
        \qquad\qquad \widehat{V}(\hat{t}_{HH}) = \frac{s_z^2}{n}$$
        <p style="margin-bottom:0;">El índice $j$ recorre las $n$ extracciones (si una tienda sale dos veces,
          aparece dos veces); el índice $i$ recorre las $N$ unidades del marco. $t_i$ es el valor de la unidad $i$:
          las ventas de la tienda o, en el capítulo 5, el total de una UPM. Hace el papel de la $y_k$ del capítulo 2;
          se escribe $t$ porque, cuando la unidad es una UPM, su valor es un total.</p>
      </div>

      <p>Las tres fórmulas se leen así. La primera dice que Hansen–Hurwitz es la media muestral de $n$ variables
        independientes, cada una igual a la estimación del módulo 1. Cada $z_j$ es insesgado para $t$, así que su
        promedio también lo es.</p>

      <p>La segunda: promediar $n$ variables independientes divide su varianza entre $n$, así que
        $V(\hat{t}_{HH})$ es la varianza del módulo 1 dividida entre $n$. Su suma recorre las $N$ unidades del marco,
        no solo las de la muestra: sirve para el cálculo exacto con las tiendas, no para una encuesta real.</p>

      <p>La tercera es la que se usa con una muestra: la varianza muestral de los $z_j$, $s_z^2$, dividida entre
        $n$. Es la cuenta de siempre, $s^2/n$, aplicada a los $z_j$ como si fueran datos independientes, y es tan
        simple porque las extracciones son independientes.</p>

      <h3>Con las cuatro tiendas y $n = 2$</h3>

      <p>Con una extracción, la varianza era 14 248; con dos, la fórmula da la mitad, 7124. El bloque lo comprueba
        de dos maneras. Primero aplica la fórmula. Después enumera los 16 pares ordenados posibles, cada uno con su
        probabilidad $\psi_i\,\psi_j$ y su estimación. Son 16 porque, con reemplazo, el orden cuenta y la misma tienda
        puede repetirse: 4 tiendas en la primera extracción por 4 en la segunda. Sin reemplazo serían solo las 6
        parejas distintas. Por ejemplo, el par (C, D) da $(128 + 392)/2 = 260$. Las dos cuentas coinciden.</p>

      <p>En la práctica no se enumera: se sortea una muestra. Con la semilla 2026, R saca C y D, y la estimación es
        $(128 + 392)/2 = 260$, no 300, y es normal: la insesgadez es una propiedad del promedio sobre todas las
        muestras, no de cada una. El error estándar estimado es 132, mientras que el verdadero es
        $\sqrt{7124} \approx 84$. Con solo dos extracciones la estimación del error es poco fiable, porque es una
        varianza muestral calculada con dos datos. Cómo hace R ese sorteo es el tema del módulo 3.</p>

      <div class="note">
        <p><strong>¿Y si una tienda sale dos veces?</strong> Se cuenta dos veces: sus dos $z_j$ entran en el

    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">

        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Cómo se sortea: acumulativo
          y Lahiri <span class="text-gray-400 font-normal text-2xl">/ Selecting with unequal probabilities</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Seguir paso a paso los dos algoritmos clásicos para
              sortear con probabilidades $\psi_i$ desiguales, hacerlos a mano con las cuatro tiendas y comprobar con cien
              mil sorteos que dan las $\psi_i$ correctas.</p>
          </div>
        </div>
      </div>

      <p>Para usar un diseño hay que poder sortear la muestra. Con probabilidades iguales basta numerar las unidades
        y elegir números al azar. Con probabilidades desiguales hace falta un <strong>algoritmo de
        selección</strong>: una receta que convierta números aleatorios uniformes en unidades elegidas con las
        $\psi_i$ que se fijaron. El bloque del módulo 2 sorteó su muestra con <code>sample(..., prob = psi)</code>
        sin decir cómo lo hace. Este módulo abre esa caja, y muestra por qué hay alternativas cuando el marco es
        enorme.</p>

      <p>Hay dos algoritmos clásicos, el método acumulativo y el método de Lahiri. Los dos hacen una extracción;
        para una muestra con reemplazo de tamaño $n$ se repiten $n$ veces.</p>

      <h3>El método acumulativo</h3>

      <div class="definition">
        <h4>Algoritmo: método acumulativo (Hansen, Hurwitz y Madow, 1953)</h4>
        <ol style="margin-bottom:0;">
          <li>Poner las unidades en una lista, en cualquier orden, y acumular sus tamaños: $T_0 = 0$ y
            $T_k = T_{k-1} + x_k$. La unidad $k$ ocupa el tramo que va de $T_{k-1}$ a $T_k$, de longitud $x_k$.</li>
          <li>Sortear un número $u$ uniforme entre 0 y el tamaño total, $T_N = t_x$.</li>
          <li style="margin-bottom:0;">Sale la unidad cuyo tramo contiene a $u$.</li>
        </ol>
      </div>

      <p><strong>A mano, con las cuatro tiendas.</strong> El tamaño total es 1600 m², y los tramos son: A del 1 al
        100, B del 101 al 300, C del 301 al 600 y D del 601 al 1600. Si sale $u = 224{,}2$, cae en el tramo de B y sale
        B. Si sale $u = 1117{,}9$, sale D. En los cinco sorteos del bloque de abajo, D sale tres veces: es una muestra
        con reemplazo.</p>

      <p><strong>Por qué funciona.</strong> El número $u$ cae en cada tramo con probabilidad igual a la longitud del
        tramo dividida entre el total, $x_i/1600$, que es justamente $\psi_i$. D ocupa 1000 de los 1600 puntos, el
        62,5 %, y sale con esa probabilidad.</p>

      <p><strong>Ventaja y costo.</strong> Es exacto y directo. A cambio, hay que recorrer el marco entero para
        acumular los tamaños antes del primer sorteo, algo pesado si el marco tiene millones de unidades.</p>

      <h3>El método de Lahiri</h3>

      <div class="definition">
        <h4>Algoritmo: método de Lahiri (1951)</h4>
        <ol style="margin-bottom:0;">
          <li>Fijar un número $x_{\max}$ al menos tan grande como el mayor tamaño del marco.</li>
          <li>Elegir una unidad candidata al azar, todas con la misma probabilidad $1/N$.</li>
          <li>Sortear un número $u$ uniforme entre 0 y $x_{\max}$.</li>
          <li style="margin-bottom:0;">Si $u \le x_i$, donde $x_i$ es el tamaño de la candidata, la candidata sale.
            Si no, se descarta y se vuelve al paso 2.</li>
        </ol>
      </div>

      <p><strong>A mano, con las cuatro tiendas.</strong> Aquí $x_{\max} = 1000$. Si la candidata es B (200 m²) y
        sale $u = 640$, B se rechaza y se elige otra candidata. Si la candidata es D, se acepta siempre, porque ningún
        $u$ supera 1000.</p>

      <p><strong>Por qué funciona.</strong> En cada intento, una tienda sale si primero es la candidata
        (probabilidad 1/4) y luego se acepta (probabilidad $x_i/1000$). Multiplicando, en un intento A sale con
        probabilidad 0,025, B con 0,05, C con 0,075 y D con 0,25: proporcional al área, aunque la suma es solo 0,4,
        porque en los demás intentos no sale nadie. Como se repite hasta aceptar una tienda, lo que cuenta es la
        proporción de cada una entre las aceptadas: D sale $0{,}25/0{,}4 = 0{,}625$ de las veces, justo su
        $\psi_D$.</p>

      <p><strong>Ventaja y costo.</strong> No hay que acumular nada: basta poder consultar el tamaño de cualquier
        unidad por su número. El costo son los intentos rechazados: un intento acaba en aceptación con probabilidad
        0,4 (la suma de arriba, que también es $400/1000$, el área media entre $x_{\max}$), así que hacen falta en
        promedio $1/0{,}4 = 2{,}5$ intentos por selección. Esta idea de proponer una candidata y aceptarla o rechazarla se llama muestreo por rechazo
        (<em>rejection sampling</em>), y la usan también los generadores de números aleatorios.</p>

        frente a los 2,5 de la cuenta anterior. La pestaña Python del primer bloque programa los dos métodos.</p>
