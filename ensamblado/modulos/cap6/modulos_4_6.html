  <template id="module-4">

            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Enumerar las muestras sin reemplazo de las cuatro
              tiendas, comprobar que el estimador de Horvitz–Thompson del capítulo 2 sirve igual con probabilidades desiguales,

      <p>Con reemplazo, la misma tienda puede salir dos veces, y la segunda vez no aporta información nueva. Lo
        natural es sortear <strong>sin reemplazo</strong>: dos tiendas distintas. Para eso no hace falta teoría
        nueva, porque el capítulo 2 ya la dio.</p>

      <h3>Lo que ya sabemos del capítulo 2</h3>

      <p>Un diseño sin reemplazo asigna una probabilidad $p(s)$ a cada muestra posible $s$. De ahí sale la
        probabilidad de inclusión de cada unidad, $\pi_k$: la suma de $p(s)$ sobre las muestras que contienen a $k$.
        El MAS es el caso en que todas las $\pi_k$ valen $n/N$, pero nada obliga a que sean iguales.</p>

      <p>Desde aquí el valor de la unidad se escribe $y_k$ y el índice es $k$, como en el capítulo 2 y en
        Gutiérrez; en las tiendas, $y_k$ son las ventas que los módulos anteriores llamaban $t_i$. La letra $i$ queda
        para las extracciones con reemplazo, junto a $\psi_i$, y para las clases del módulo 9, como en el capítulo 5.
        La letra del índice no cambia el concepto: lo que separa los dos mundos es $\psi$ frente a $\pi$.</p>

      <div class="formula">
        <p class="formula-titulo">El estimador de Horvitz–Thompson, sin cambios</p>
        $$\hat{t}_\pi = \sum_{k \in s} \frac{y_k}{\pi_k}, \qquad
        E(\hat{t}_\pi) = \sum_{k \in U} \frac{y_k}{\pi_k}\,E(I_k) = \sum_{k \in U} \frac{y_k}{\pi_k}\,\pi_k = t$$
        <p style="margin-bottom:0;">$I_k$ vale 1 si la unidad $k$ sale en la muestra y 0 si no, así que
          $E(I_k) = \pi_k$. La cuenta vale para cualquier diseño en el que ninguna unidad tenga probabilidad cero de
          entrar ($\pi_k > 0$), con probabilidades iguales o desiguales.</p>
      </div>

      <h3>Un diseño sin reemplazo para las cuatro tiendas</h3>

      <p>Se sortean dos tiendas distintas, y para que las parejas con tiendas grandes salgan más, la probabilidad
        de cada pareja se hace proporcional a la suma de sus áreas: $p(s) \propto x_k + x_l$. Hay 6 parejas
        posibles, y cada tienda está en 3 de ellas, así que las sumas de las 6 parejas dan $3 \times 1600 = 4800$ y
        $p(s) = (x_k + x_l)/4800$. Por ejemplo, $p(AB) = 300/4800 = 0{,}0625$. Para sortear una pareja basta el
        método acumulativo del módulo 3, aplicado a sus $p(s)$.</p>

      <p><strong>A mano.</strong> La tienda A está en tres parejas, AB, AC y AD, así que
        $\pi_A = 0{,}0625 + 0{,}0833 + 0{,}2292 = 0{,}375$. Del mismo modo, $\pi_B = 0{,}4167$,
        $\pi_C = 0{,}4583$ y $\pi_D = 0{,}75$; suman 2, el tamaño de la muestra. Si sale la pareja AB, el HT vale
        $11/0{,}375 + 20/0{,}4167 = 77{,}3$.</p>

      <h3>¿Por qué este diseño pierde?</h3>

      <p>Por la idea central del capítulo: la varianza es pequeña cuando $y_k/\pi_k$ cambia poco de una unidad a
        otra. Aquí los cuatro cocientes son 29,3, 48, 52,4 y 326,7: el de D queda muy lejos de los demás. Las $\pi$ de
        este diseño van de 0,375 a 0,75, la mayor el doble de la menor, mientras que las ventas de D son más de veinte
        veces las de A.</p>

      <p>En el Hansen–Hurwitz del módulo 2, el papel de la $\pi$ lo hace $n\,\psi_i$, el número de veces que se
        espera ver la tienda. Sus cocientes $t_i/(n\,\psi_i)$ son 88, 80, 64 y 196: mucho más parecidos entre sí.</p>

      <h3>Otro diseño sin reemplazo: el de Lohr</h3>

      <p>Lohr (ejemplos 6.8 y 6.9) sortea las mismas cuatro tiendas de otro modo, <strong>extracción a
        extracción</strong>. La primera tienda sale con las $\psi$ del módulo 2. La segunda sale entre las tres que
        quedan, con sus $\psi$ divididas entre $1 - \psi_k$ para que vuelvan a sumar 1, donde $k$ es la tienda que
        salió primero. Lohr atribuye el método a Yates y Grundy (1953).</p>

      <p><strong>A mano.</strong> La pareja AD sale si A va primera y D segunda, o al revés:
        $p(AD) = \frac{1}{16}\cdot\frac{10}{15} + \frac{10}{16}\cdot\frac{1}{6} = 0{,}1458$. Con las seis parejas,
        las probabilidades de inclusión son 0,19, 0,37, 0,54 y 0,90. D queda fuera solo una vez de cada diez, frente a
        una de cada cuatro en el diseño anterior.</p>

      <h3>Dos probabilidades distintas: $\psi$ y $\pi$</h3>

      <div class="definition">
        <h4>Probabilidad de una extracción y probabilidad de inclusión</h4>
        <p><strong>$\psi_i$</strong> es la probabilidad de que la unidad $i$ salga en <strong>una
          extracción</strong>. Las $\psi_i$ de todo el marco suman 1, y se usan en los diseños con reemplazo.</p>
        <p><strong>$\pi_k$</strong> es la probabilidad de que la unidad $k$ esté <strong>en la muestra</strong>.
          Las $\pi_k$ suman $n$, y son las del capítulo 2.</p>
        <p style="margin-bottom:0;">Con reemplazo, cada extracción se divide entre su $\psi_i$ y se promedian las
          $n$; escrito como una suma, es dividir entre $n\,\psi_i$. Sin reemplazo, cada unidad se divide entre su
          $\pi_k$. Confundirlas es el error más común del capítulo.</p>
      </div>

      <h3>La idea: pedir las $\pi$ directamente</h3>

      <p>En el módulo 4 el diseño $p(s)$ venía dado, y de él salían las $\pi_k$. Aquí se invierte el camino: se
        eligen las $\pi_k$ y se busca un sorteo que las respete. El diseño <strong>πPT</strong> (probabilidad de
        inclusión proporcional al tamaño) pide</p>

      $$\pi_k = n\,\frac{x_k}{t_x},$$

      <p>con $t_x$ el total de la medida de tamaño, como en el módulo 1. Gutiérrez lo llama πPT; Lohr lo llama
        muestreo <em>pps</em> sin reemplazo. Si $y_k$ es proporcional a $x_k$, los cocientes $y_k/\pi_k$ son todos
        iguales y la varianza del HT es cero: la idea central del capítulo llevada al extremo. (Las unidades de
        inclusión forzosa, que se ven enseguida, son la excepción: su cociente es otro, pero entran en todas las
        muestras y tampoco aportan varianza.)</p>

      <h3>Con las cuatro tiendas</h3>

      <p>Con $n = 2$, las $\pi$ serían $2\,x_k/1600$: 0,125 para A, 0,25 para B, 0,375 para C y 1,25 para D. Pero
        una probabilidad no puede pasar de 1.</p>

      <div class="definition">
        <h4>Inclusión forzosa</h4>
        <p style="margin-bottom:0;">Si $n\,x_k/t_x > 1$, la unidad $k$ entra en todas las muestras:
          $\pi_k = 1$. Su término $y_k/\pi_k = y_k$ es el mismo en todas ellas, así que no aporta varianza; es el
          estrato que se censa entero, como en el capítulo 4. Los cupos que quedan se reparten entre las demás
          unidades en proporción a su tamaño, y si alguna vuelve a pasar de 1, se repite el paso.</p>
      </div>

      <p>En las tiendas, D entra siempre, y el otro cupo se reparte entre A, B y C según sus áreas, sobre un total
        de 600 m²: $\pi_A = 1/6$, $\pi_B = 1/3$ y $\pi_C = 1/2$. Sortearlo es fácil: D entra, y la otra tienda sale
        con el método acumulativo del módulo 3 sobre las áreas 100, 200 y 300. Hay tres muestras posibles:</p>

      <h3>El sorteo sistemático</h3>

      <div class="definition">
        <h4>Algoritmo: πPT sistemático</h4>
        <ol style="margin-bottom:0;">
          <li>Poner las unidades en una lista y acumular sus $\pi_k$. La unidad $k$ ocupa un tramo de longitud
            $\pi_k$.</li>
          <li>Sortear un arranque $u$ uniforme entre 0 y 1.</li>
          <li style="margin-bottom:0;">Seleccionar las unidades cuyos tramos contienen a $u$, $u + 1$, …,
            $u + n - 1$.</li>
        </ol>
      </div>

      <p>En el sistemático del capítulo 2 todas las unidades ocupaban tramos de la misma longitud; aquí cada una
        ocupa un tramo de longitud $\pi_k$, y los puntos siguen separados por 1. Con las tiendas y $n = 2$, las
        $\pi$ acumuladas son 1/6, 1/2, 1 y 2. Si $u = 0{,}4$, cae en el tramo de B (de 1/6 a 1/2), y $u + 1 = 1{,}4$
        cae en el de D: la muestra es {B, D}. Funciona porque cada tramo mide $\pi_k \le 1$: contiene a lo sumo uno de
        los puntos, y lo contiene con probabilidad $\pi_k$.</p>

      <p>El bloque sortea así a los 51 estados, recorriendo la lista en el orden del archivo, que es alfabético:</p>

      <h3>Otros algoritmos: Brewer y Sunter</h3>

      <p>El sistemático es sencillo, pero tiene dos inconvenientes. Su varianza depende del orden de la lista. Y
        muchas parejas de unidades nunca salen juntas: con los 50 estados que se sortean, en el orden alfabético,
        830 de las 1225 parejas tienen $\pi_{kl} = 0$ (828 con la lista ordenada por población), y sin
        $\pi_{kl} > 0$ no hay forma insesgada de estimar la varianza (módulo 7).
        Gutiérrez (§4.4) presenta algoritmos sin esos inconvenientes. Estos son los dos más sencillos.</p>

      <div class="definition">
        <h4>Algoritmo: Brewer, para $n = 2$</h4>
        <ol style="margin-bottom:0;">
          <li>Sortear la primera unidad con probabilidad proporcional a $x_k(t_x - x_k)/(t_x - 2x_k)$.</li>
          <li style="margin-bottom:0;">Sortear la segunda entre las restantes, con probabilidad proporcional a su
            tamaño $x_k$.</li>
        </ol>
      </div>

      <p>Da exactamente $\pi_k = 2x_k/t_x$, con todas las $\pi_{kl} > 0$, y menos varianza que el PPT con reemplazo.
        Pide que ninguna unidad pase de la mitad del total, que es lo mismo que pedir $\pi_k < 1$. Con las tiendas
        no hace falta: D, con 1000 de los 1600 m², entra de forma forzosa, y el cupo que queda se sortea con el
        acumulativo. <code>sampling::UPbrewer</code> lo extiende a cualquier $n$.</p>

      <div class="definition">
        <h4>Algoritmo: Sunter</h4>
        <ol style="margin-bottom:0;">
          <li>Ordenar las unidades de mayor a menor $\pi$.</li>
          <li>Recorrer la lista una sola vez. Si antes de la unidad $k$ ya van $e_k$ elegidas y las $\pi$ de las
            anteriores suman $A_k$, la unidad $k$ entra con probabilidad $\pi_k\,(n - e_k)/(n - A_k)$, su
            <em>umbral</em>.</li>
          <li style="margin-bottom:0;">Cuando ya van $n$ elegidas, el umbral de las que faltan es 0: la muestra
            está completa.</li>
        </ol>
      </div>

      <p><strong>Con las cuatro tiendas</strong> ($n = 2$), la lista va de D a A, con $\pi$ de 1, 1/2, 1/3 y 1/6.</p>

      <ul>
        <li>D tiene umbral $1 \times 2/2 = 1$: entra siempre.</li>
        <li>C tiene umbral $\tfrac12 \times 1/1 = \tfrac12$. Si entra, la muestra es {C, D} y se termina.</li>
        <li>Si C no entra, B tiene umbral $\tfrac13 \times 1/(2 - \tfrac32) = \tfrac23$.</li>
        <li>Si tampoco entra B, A tiene umbral $\tfrac16 \times 1/(2 - \tfrac{11}{6}) = 1$: entra seguro.</li>
      </ul>

      <p>Cada muestra sale con la probabilidad pedida: {C, D} con 1/2; {B, D} con
        $\tfrac12 \times \tfrac23 = \tfrac13$; y {A, D} con $\tfrac12 \times \tfrac13 = \tfrac16$.</p>

      <p>Sunter tiene una condición (Gutiérrez, Resultado 4.4.3): ningún umbral debe pasar de 1. En las tiendas el
        último vale justo 1, y no hay problema. Hacia el final de una lista larga puede pasarse; entonces la unidad
        entra con seguridad, y las $\pi$ de las unidades más pequeñas se apartan un poco de las pedidas. En los
        estados el desvío es inapreciable, y en el ejercicio 5 no llega a dos milésimas. Es el algoritmo de
        <code>TeachingSampling::S.piPS</code>.</p>

      <p>El bloque de R da la varianza exacta del HT de <code>counties</code> con el sistemático, en los dos órdenes,
        y sortea Brewer 4000 veces, porque no trae sus $\pi_{kl}$. La pestaña Python programa Sunter a mano: primero
        las tiendas, después los estados.</p>

      <h3>¿Cuándo gana el πPT? Una cuenta antes de muestrear</h3>

      <p>Que $y$ y $x$ estén correlacionados no basta. Gutiérrez (Resultado 4.2.7) da un criterio exacto para el
        diseño con reemplazo, debido a Raj. Con $n$ extracciones (Gutiérrez las llama $m$), compara dos formas de
        sortear con reemplazo: con
        probabilidades iguales (el MAS con reemplazo, MRAS) y con probabilidades proporcionales al tamaño (PPT). La
        diferencia entre sus varianzas es</p>

      <div class="formula">
        <p class="formula-titulo">El criterio de Raj</p>
        $$V_{MRAS} - V_{PPT} = \frac{N^2}{n}\,\mathrm{Cov}\!\left(x,\ \frac{y^2}{x}\right)$$
        <p style="margin-bottom:0;">La covarianza es la de la población, con divisor $N$. Todo se reduce a su
          signo: el PPT gana si $y^2/x$ tiende a crecer con $x$, y pierde si tiende a bajar. No basta con que $y$
          crezca con $x$; lo que cuenta es $y^2/x$.</p>
      </div>

      <p><strong>Con las tiendas.</strong> Con $n = 2$, el PPT con reemplazo es el Hansen–Hurwitz del módulo 2. Los
        valores de $y^2/x$ son 1,21, 2, 1,92 y 60: la tienda más grande, D, tiene también el $y^2/x$ más grande, y la
        covarianza es positiva, 8765. La fórmula da $\frac{16}{2} \times 8765 = 70\,120$, que es justo la diferencia
        entre 77 244 (el MAS con reemplazo) y 7124 (el Hansen–Hurwitz). El PPT gana.</p>

      <p>Gutiérrez añade, citando a Lehtonen y Pahkinen, una lectura geométrica: el PPT funciona cuando la recta de
        $y$ sobre $x$ pasa cerca del origen, es decir, cuando una unidad sin tamaño tendría $y \approx 0$. El criterio
        es exacto con reemplazo y orientativo para el πPT. El bloque lo aplica a las tiendas y después a los
        estados:</p>

        <div class="profundizar-cuerpo">
          <p>Esta parte amplía el módulo y no hace falta para seguir el capítulo. La tabla del módulo 6

          <h4>La entropía de un diseño</h4>

          <p>Los algoritmos de arriba dan las mismas $\pi_k$, pero no las mismas muestras. Se distinguen por su
            <strong>entropía</strong>: cuánto reparten la probabilidad entre muchas muestras distintas. El de
            <strong>máxima entropía</strong> es, entre todos los que tienen las mismas $\pi_k$, el que la reparte
            más. Equivale a sortear un Poisson y quedarse solo con las muestras de tamaño $n$, pero las
            probabilidades de ese Poisson no son las $\pi_k$: se ajustan para que, al descartar las demás muestras,
            cada unidad quede con su $\pi_k$ (<code>UPmaxentropy</code> hace ese ajuste). La eliminación de Tillé
            (<code>UPtille</code>) parte de toda la población y va descartando unidades, y también reparte mucho.
            El de soporte mínimo, el de la escisión de abajo, está en el otro extremo: reparte la probabilidad entre
            muy pocas muestras, a lo sumo $N$.</p>

          <p>El bloque calcula la varianza exacta del HT de <code>counties</code> con las $\pi_{kl}$ de los tres:</p>

          <div class="code-tabs">
            <div class="code-tabs-nav" role="tablist" aria-label="Tillé, máxima entropía y soporte mínimo">
              <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
            </div>

          <p>Los tres diseños de alta entropía dan casi la misma varianza: 697 273 la eliminación de Tillé, 715 020
            Brewer y 723 607 el de máxima entropía. En los dos que dan sus $\pi_{kl}$ no hay ninguna pareja
            imposible. El de soporte mínimo respeta las $\pi$, pero con solo 50 muestras posibles su varianza es
            3 063 834, más de cuatro veces la de los de alta entropía: sirve para entender la escisión, no para
            usarla así.</p>

          <h4>La escisión, paso a paso</h4>

          <div class="definition">
            <h4>Algoritmo: escisión de soporte mínimo (Deville y Tillé, 1998)</h4>
            <ol style="margin-bottom:0;">
              <li>Ordenar las unidades de menor a mayor $\pi$, una sola vez.</li>
              <li>Entre las unidades aún sin decidir (con $0 < \pi < 1$), las primeras van a 0 y las últimas a 1, tantas
                como cupos faltan. Ese vector de ceros y unos es $\pi^a$.</li>
              <li>Calcular $\lambda$, el menor de dos números: 1 menos la mayor $\pi$ de las que van a 0, y la menor
                $\pi$ de las que van a 1. Es el mayor valor con el que las $\pi^b$ del paso siguiente siguen entre 0
                y 1.</li>
              <li>Con probabilidad $\lambda$, la muestra es $\pi^a$ y se termina. Con probabilidad $1 - \lambda$, se sigue
                con $\pi^b = (\pi - \lambda\,\pi^a)/(1 - \lambda)$.</li>
              <li style="margin-bottom:0;">Repetir desde el paso 2, con el mismo orden, hasta que todas las $\pi$
                valgan 0 o 1.</li>
            </ol>
          </div>

          <p>Funciona porque $\lambda\,\pi^a + (1 - \lambda)\,\pi^b = \pi$: en cada etapa, en promedio, las
            probabilidades no cambian. Gutiérrez (ejemplo 4.4.2) lo aplica a cinco personas con $n = 3$. Ordenadas de
            menor a mayor, Leslie, Yves, Ken, Erik y Sharon tienen $x = 50, 52, 60, 75$ y $100$, y $\pi = 3x/337$. En la
            primera etapa, Leslie y Yves, las de menor $\pi$, van a 0, y
            $\lambda = 0{,}534$: con esa probabilidad la muestra es {Ken, Erik, Sharon}. En cuatro etapas sale un diseño con
            solo cinco muestras posibles de las diez que hay, y por eso se llama de soporte mínimo. Gutiérrez parte de
            las $\pi$ redondeadas a dos decimales, y el redondeo se arrastra: sus $\lambda$ de las etapas 2, 3 y 4 (0,06,
            0,02 y 0,78) difieren de los exactos (0,045, 0,007 y 0,752), y con ellos las probabilidades de las cuatro
            últimas muestras. Las muestras y el orden de las etapas coinciden.</p>

          <div class="simulador" data-simulador="escision">
            <h4><i class="fas fa-code-branch" aria-hidden="true"></i> Escisión paso a paso</h4>
            <p class="simulador-intro">El ejemplo de Gutiérrez, etapa por etapa: avanza con el control y fíjate en

              muestras posibles, y la comprobación de que juntas reproducen las $\pi$ del principio.</p>

        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Conocer el diseño de Poisson, el de las monedas
              independientes: el más fácil de sortear y de analizar, a cambio de un tamaño de muestra que no se fija de
              antemano, y aprender a corregir lo que cuesta ese tamaño aleatorio.</p>

      <h3>Para qué sirve</h3>

      <p>Hay marcos que no <em>están</em>, sino que <em>llegan</em>: transacciones que se auditan conforme ocurren,
        paquetes de una red, páginas que se descargan con un presupuesto de peticiones. Cada unidad se decide en el
        momento, sin conocer las que vendrán. Ningún diseño de tamaño fijo puede hacer eso; el de Poisson, sí. (Su
        nombre viene de los «ensayos de Poisson», ensayos de Bernoulli independientes con probabilidades distintas;
        no tiene que ver con la distribución de Poisson.)</p>

      <div class="definition">
        <h4>Algoritmo: diseño de Poisson</h4>
        <ol style="margin-bottom:0;">
          <li>Fijar la probabilidad de inclusión $\pi_k$ de cada unidad.</li>
          <li>Para cada unidad, sortear un uniforme $\varepsilon_k$ entre 0 y 1, independiente de los demás.</li>
          <li style="margin-bottom:0;">La unidad $k$ entra si $\varepsilon_k < \pi_k$.</li>
        </ol>
      </div>

      <p>Es el Bernoulli del capítulo 2, que lanzaba la misma moneda para todas las unidades, con una moneda
        distinta para cada una. Una unidad con $\pi_k = 1$, como California, es una moneda que siempre sale cara.</p>

      <h3>El tamaño de muestra es aleatorio</h3>

      <p>Con dos monedas, $\pi_1 = 0{,}3$ y $\pi_2 = 0{,}5$, el tamaño de muestra puede ser 0, 1 o 2. Como las
        monedas son independientes, las probabilidades se multiplican: $P(n_s = 0) = 0{,}7 \times 0{,}5 = 0{,}35$,
        $P(n_s = 1) = 0{,}3 \times 0{,}5 + 0{,}7 \times 0{,}5 = 0{,}5$ y $P(n_s = 2) = 0{,}3 \times 0{,}5 = 0{,}15$.
        Con 51 monedas se hace lo mismo, moneda por moneda: así calcula la pestaña Python del bloque la distribución
        exacta de $n_s$. La pestaña R sortea una muestra, y da su HT y la varianza exacta.</p>

      <h3>El estimador y su varianza</h3>

      <div class="formula">
        <p class="formula-titulo">Poisson: el HT y su varianza</p>
        $$\Delta_{kl} = \pi_{kl} - \pi_k\pi_l = 0 \quad \text{si } k \ne l$$
        $$V(\hat{t}_\pi) = \sum_{k \in U}\left(\frac{1}{\pi_k} - 1\right) y_k^2$$
        $$\widehat{V}(\hat{t}_\pi) = \sum_{k \in s} (1 - \pi_k)\,\frac{y_k^2}{\pi_k^2}$$
        $$E(n_s) = \sum_{k \in U} \pi_k, \qquad V(n_s) = \sum_{k \in U} \pi_k(1 - \pi_k)$$
        <p style="margin-bottom:0;">$\Delta_{kl}$ es la covarianza entre las indicadoras $I_k$ e $I_l$. Con monedas
          independientes, $\pi_{kl} = \pi_k\pi_l$ y la covarianza es cero, así que de la doble suma de la varianza
          del HT solo queda la diagonal. $V$ suma sobre toda la población; su estimador $\widehat{V}$, solo sobre la
          muestra, con $\pi_k^2$ abajo. No hacen falta las $\pi_{kl}$.</p>
      </div>

      <p>El bloque usa los 51 estados con las $\pi$ del módulo 5 ($n = 10$, California forzosa):</p>

      <div class="simulador" data-simulador="poisson-n">
        <h4><i class="fas fa-coins" aria-hidden="true"></i> La distribución del tamaño de muestra</h4>
        <p class="simulador-intro">Las barras dan la distribución exacta de $n_s$ con las $\pi$ de los estados:
          solo el 16 % de las veces salen exactamente 10. El deslizador multiplica todas las $\pi$ por un factor, como
          si cambiara el presupuesto esperado, $E(n)$. Por encima de 1, las $\pi$ que pasarían de 1 se truncan sin
          repartir el sobrante, y $E(n)$ crece algo menos que el factor. La lectura da la desviación de $n_s$ y su coeficiente de
          variación (cv), la desviación dividida entre $E(n)$. ¿Qué le pasa al cv si el presupuesto baja a la
          mitad?</p>

      <h3>Lo que cuesta el tamaño aleatorio, y cómo corregirlo</h3>

      <p>Gutiérrez (§4.1.3) señala un efecto que no tienen los diseños de tamaño fijo. Sea $n$ el tamaño de muestra
        esperado, $n = \sum \pi_k$. Si las $\pi$ fueran proporcionales a la propia $y$, $\pi_k = n\,y_k/t$, cada
        unidad de la muestra aportaría lo mismo al HT, $y_k/\pi_k = t/n$, y el HT valdría</p>

      $$\hat{t}_\pi = \frac{t}{n}\,n_s.$$

      <p>Es decir, el total multiplicado por la fracción entre las unidades que salieron y las esperadas. Con tamaño
        fijo eso daría varianza cero. Con Poisson, no: todo el error viene de cuántas unidades salen. El bloque lo
        muestra tomando como variable de interés la propia medida de tamaño, la población: con 10 estados el HT
        acierta; con 15 se pasa en un 49 %, y con 8 se queda en el 80,5 %. (No es exactamente 50 % y 80 % porque
        California entra siempre y aporta lo mismo en todas las muestras.)</p>

      <p>El remedio es dividir por lo que salió. Con $x$ conocida en todo el marco, el HT de $x$ sufre el mismo
        efecto, $\hat{t}_{x,\pi} = t_x\,n_s/n$ cuando $\pi \propto x$. El estimador de razón del capítulo 3 divide
        el HT de $y$ entre el de $x$, y la fracción $n_s/n$ se cancela:</p>

      $$\hat{t}_{\text{razón}} = t_x\,\frac{\hat{t}_{y,\pi}}{\hat{t}_{x,\pi}}.$$

      <p>Si salieron más unidades de las esperadas, los dos HT crecen juntos y el cociente lo compensa. Gutiérrez
        propone también $N\,\hat{t}_{y,\pi}/\hat{N}_\pi$, que corrige con el número de unidades en vez de con $x$:</p>

      <p>Sobre 20 000 muestras de Poisson, el HT de <code>counties</code> tiene un error cuadrático medio de
        1 574 244, cerca de su varianza exacta. Con la corrección de Gutiérrez baja a 959 401, y con la razón, a
        773 791: menos de la mitad, cerca de los diseños de tamaño fijo del módulo 5. El precio es un sesgo pequeño,
        el del estimador de razón (capítulo 3).</p>

      <div class="note">
        <p><strong>Poisson frente al sistemático.</strong> El ejercicio 4 compara las dos varianzas exactas del HT,
          sin corregir. Con <code>waterarea</code> son casi iguales: la varianza del sistemático ya es enorme, y lo que
          añade el tamaño aleatorio apenas se nota. Con <code>counties</code>, la de Poisson es casi el triple: el
          sistemático tiene poca varianza, y lo que añade el tamaño aleatorio pesa mucho.</p>
      </div>
