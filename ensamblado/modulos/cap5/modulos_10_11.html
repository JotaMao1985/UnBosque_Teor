      <p>Los datos de la práctica moderna casi nunca son independientes: vienen en sesiones de un mismo usuario,
        pacientes de un mismo hospital, fotogramas de un mismo video. Todo eso son conglomerados, la ICC les aplica
        sin cambiar una letra, y los dos errores clásicos de este capítulo — creer que $K$ observaciones
        correlacionadas valen como $K$ independientes, y dejar que un grupo se parta entre entrenamiento y prueba —
        tienen nombre y castigo en machine learning.</p>

      <div class="definition">
        <h4>El minibatch como conglomerado</h4>
        <p>Si un minibatch de tamaño $m$ se arma con ejemplos del mismo grupo (la misma sesión, el mismo shard, el
          mismo archivo), la varianza del gradiente promedio no es $\sigma^2/m$ sino</p>
        $$V(\bar{g}) = \frac{\sigma^2}{m}\,\big(1 + (m-1)\rho\big)$$
        <p style="margin-bottom:0;">— la fórmula de Kish del módulo 4, con otro disfraz. Con $\rho = 0{,}2$ y
          $m = 64$, el minibatch «de 64» informa como uno de 5: por eso los cargadores de datos barajan globalmente
          y por eso muestrear shards enteros sale caro en pasos de entrenamiento.</p>
      </div>

      <div class="simulador" data-simulador="minibatch">
        <h4><i class="fas fa-microchip" aria-hidden="true"></i> El minibatch correlacionado</h4>
        <p class="simulador-intro">Mueve la correlación intra-grupo y el tamaño del batch. Las barras comparan el
          tamaño nominal con el <strong>tamaño informativo</strong> $m/(1+(m-1)\rho)$; la lectura lo traduce a
          «cuántos pasos de más» necesita el entrenamiento para la misma señal. Es el mismo simulador del módulo 4
          con las etiquetas cambiadas — a propósito: la estadística es idéntica.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Tamaño nominal del batch frente a su tamaño informativo</p>
        <div class="grafico-wrapper" style="height:220px;">
          <canvas aria-label="Tamano nominal e informativo del minibatch segun la correlacion" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado"><span class="ejercicio-numero">1.</span>Con <code>algebra</code>, construye
            el intervalo del 95 % para la nota media <strong>ignorando el diseño</strong> y <strong>declarándolo</strong>.

          <details class="ejercicio-pista">
            <summary>Pista</summary>
            <p>El ingenuo usa $s/\sqrt{299}$; el honesto, el ee de <code>svymean</code> con el diseño del módulo 4.
              La relación de anchos debería recordarte a $\sqrt{2{,}10}$.</p>
          </details>
          <details class="ejercicio-solucion">
            <summary>Solución</summary>
            <pre><code class="language-r">⟦R15⟧</code></pre>
            <p>[60,55; 64,59] contra [59,65; 65,49]: el honesto es 1,45 veces más ancho — exactamente
              $\sqrt{\text{deff}} = \sqrt{2{,}10}$. El intervalo ingenuo no es «casi igual de bueno»: su cobertura
              real está muy por debajo del 95 % que promete.</p>
          </details>

        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado"><span class="ejercicio-numero">2.</span>Estima la <strong>longitud media</strong>

            <p>El diseño <code>dis_coots</code> del módulo 5 sirve tal cual: cambia la variable. La respuesta a la
              segunda pregunta está en qué tanto se correlaciona cada variable con el tamaño de la nidada.</p>
          </details>
          <details class="ejercicio-solucion">
            <summary>Solución</summary>
            <pre><code class="language-r">⟦R16⟧</code></pre>
            <p>48,649 contra 48,634: casi nada. La ponderación por $M_i$ importa exactamente en la medida en que
              $y$ se correlacione con $M_i$ — el volumen crece con el tamaño de la nidada, la longitud apenas. Es
              el criterio del capítulo 3 (¿sirve la auxiliar?) aplicado al revés: aquí dice cuándo la corrección
              es imprescindible y cuándo cosmética.</p>
          </details>

            $C = 8\,000$ sobre las zonas de BigLucy, ¿cuántos conglomerados y de qué tamaño? Cuantifica el castigo
            de ignorar la fórmula y usar $m = 40$.</p>
          <details class="ejercicio-pista">
            <summary>Pista</summary>
            <p>$m^* = \sqrt{c_1(1-\rho)/(c_2\rho)}$ con la ICC de las zonas (0,2166); $n$ sale del presupuesto. Para

          </details>
