      <p>Este módulo no añade contenido: es un ensayo. El quiz del capítulo 5 se presenta en Brightspace, en clase, y
        dura <strong>cincuenta minutos</strong>. Tiene <strong>quince preguntas</strong> de un punto. Las cinco primeras
        salen de <strong>una misma encuesta en dos etapas</strong>, con su tabla de conglomerados: el peso de una
        unidad (módulo 2), el total insesgado (módulo 6), la media por unidad con la razón (módulo 5), el error estándar
        con el atajo del conglomerado último (módulo 7) y qué estima el promedio simple de las medias (módulo 5). La
        sexta y la séptima planean la encuesta siguiente: el efecto de diseño de Kish (módulo 4) y el tamaño de
        submuestra óptimo (módulo 8). Las cinco siguientes son otras situaciones: dos gráficos que se leen —un piloto
        con tres variables (módulos 4 y 8) y cuarenta intervalos calculados como si fueran de un MAS (módulos 3 y 5)—,
        la llamada de <code>survey</code> (módulo 6), un estrato con una sola UPM (módulo 9) y la validación cruzada
        con datos agrupados (módulo 10). Las tres últimas son de repaso, al estilo de la autoevaluación del módulo 11:
        por qué un estrato y un conglomerado piden grupos opuestos (módulos 1 y 4), cómo cambia la probabilidad de
        inclusión de un hogar cuando su manzana crece (módulos 2 y 6) y cómo repartir unas entrevistas nuevas cuando se
        sabe cuánto pone cada etapa en la varianza (módulos 7 y 8). Seis preguntas piden una cifra que se teclea y nueve son de selección con una
        sola respuesta. Cada estudiante recibe una de tres versiones, con sus propios datos.</p>

      <p>Abajo hay un simulacro con la forma de las doce primeras: el caso, con su tabla, y doce preguntas. Es una versión
        aparte, que no se usa en Brightspace, con otro contexto —veredas y predios lecheros— y otros datos, todos
        construidos. Las seis de cifra siguen el mismo diseño que las del quiz, y en ellas está el método que
        conviene tener automatizado antes de entrar: por qué se multiplica en cada etapa, qué expande N/n, qué
        expande M<sub>i</sub>/m<sub>i</sub> y qué sumando de la varianza usa el atajo. Las seis de selección miran
        los mismos módulos <em>desde otro ángulo</em>, así que practicarlas no es memorizar las respuestas del quiz:
        es repasar el módulo. Los enunciados van de usted, como los del quiz.</p>
