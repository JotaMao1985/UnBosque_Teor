      <h3>Lo que más se cobró aquí</h3>
      <p>Si va a repasar una sola cosa, que sea esta lista — son los sitios donde el cálculo sale sin dar
        error y aun así está mal:</p>
      <ul>
        <li>La <strong>media muestral</strong> multiplicada por $n$ en vez de por $N$ — el tamaño de la
          muestra donde iba el de la población.</li>
        <li>La <strong>fpc olvidada</strong> cuando $f$ no es despreciable, o puesta donde el muestreo fue
          con reemplazo.</li>
        <li>El <strong>tamaño de muestra</strong> redondeado hacia abajo, o calculado sin la corrección
          $n_0/(1 + n_0/N)$.</li>
        <li>La <strong>varianza de un sistemático</strong> estimada con la fórmula del MAS, sin decir que
          es una aproximación y sin mirar el orden del marco.</li>
        <li>El <strong>código de dato faltante</strong> promediado como si fuera un dato.</li>
        <li>La <strong>población muestreada</strong> confundida con la objetivo, o con los
          respondientes.</li>
      </ul>
