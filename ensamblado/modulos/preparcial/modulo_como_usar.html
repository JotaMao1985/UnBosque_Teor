      <h3>Qué NO es</h3>
      <p><strong>No es el parcial.</strong> Ninguna de estas preguntas va a aparecer en el examen: esto está

        aquí abajo — los mismos objetivos, con los mismos pesos —, así que las preguntas del parcial serán de la
        misma familia, no las mismas.</p>
      <p><strong>No es un capítulo.</strong> No enseña nada nuevo. Todo lo que se pregunta está en los capítulos 1
        y 2 publicados, y cada pregunta le dice dónde.</p>

      <h3>Sobre qué datos</h3>
      <p>Los ejercicios nuevos corren sobre <strong><code>baseball</code></strong>, una de las poblaciones oficiales
        del libro de Lohr: los <strong>797 jugadores</strong> de las 30 plantillas de la MLB en 2004, con su salario.
        Se eligió por dos razones. La primera es que <strong>no aparece en ningún capítulo</strong>, así que aquí
        reconocer no puede sustituir a razonar. La segunda importa más: es la <strong>población completa</strong>, no
        una muestra. Eso permite hacer algo que con un archivo de muestra solo se puede afirmar — <em>medir</em> el
        sesgo de un marco incompleto, <em>contar</em> cuántos intervalos cubren de verdad y <em>calcular exacta</em>
        la varianza de un diseño sistemático recorriendo entero su espacio de muestras.</p>
