      <p>Esto <strong>no tiene nota y se puede repetir sin límite</strong>. Su producto no es un puntaje: es

      <h3>Qué NO es</h3>
      <p><strong>No es el parcial.</strong> Ninguna de estas preguntas va a aparecer en el examen: esto está
        publicado y lo publicado se quema. Lo que sí comparten es la <strong>tabla de especificaciones</strong> de
        aquí abajo — los mismos objetivos, con los mismos pesos —, así que las preguntas del parcial serán de la
        misma familia, no las mismas.</p>
      <p><strong>No es un capítulo.</strong> No enseña nada nuevo. Todo lo que se pregunta está en los capítulos 1
        y 2 publicados, y cada pregunta le dice dónde.</p>

      <h3>Las condiciones del parcial</h3>
      <div class="definition">
        <p><strong>Jueves 3 de septiembre, 90 minutos. Se permiten formulario y calculadora.</strong></p>
        <p style="margin-bottom:0;">Eso cambia lo que hay que estudiar, y conviene decirlo claro: si las fórmulas
          están sobre la mesa, <strong>recordarlas no vale puntos</strong>. Lo que se evalúa es <em>elegir</em> la
          que corresponde al diseño que le describen, ponerle los números correctos y <em>decir qué significa el
          resultado</em>. Un formulario no le dice si esa población tiene fpc, ni si el marco alcanza a quien usted

      </div>

      <p>Los ejercicios nuevos corren sobre <strong><code>baseball</code></strong>, una de las poblaciones oficiales
