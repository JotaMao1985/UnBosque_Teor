      <div class="definition">
        <h4>La descomposición</h4>
        <p>La calidad de una estimación $\hat\theta$ se mide con el <strong>error cuadrático medio</strong>, que se
          parte en dos piezas y nada más que dos:</p>
        <p style="text-align:center;">$$\text{ECM}(\hat\theta) = \underbrace{\big[E(\hat\theta) - \theta\big]^2}_{\text{sesgo}^2} + \underbrace{V(\hat\theta)}_{\text{varianza}}$$</p>
        <p style="margin-bottom:0;">La varianza baja con $n$; el sesgo, no. Todo el capítulo cabe en esa frase.</p>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-ecm">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver de dónde sale la descomposición</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-ecm" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>El ECM es la distancia cuadrática esperada al valor verdadero. Se le suma y se le resta la esperanza
                del estimador, que es el truco entero:</p>
              $$\text{ECM} = E\big[(\hat\theta - \theta)^2\big]
                = E\Big[\big((\hat\theta - E\hat\theta) + (E\hat\theta - \theta)\big)^2\Big]$$
            </li>
            <li>
              <p>Se desarrolla el cuadrado. El segundo paréntesis es una constante —no depende de la muestra—, así que
                sale fuera de la esperanza:</p>
              $$= E\big[(\hat\theta - E\hat\theta)^2\big] + 2\,(E\hat\theta - \theta)\,E\big[\hat\theta - E\hat\theta\big] + (E\hat\theta - \theta)^2$$
            </li>
            <li>
              <p>El término cruzado se anula, porque $E[\hat\theta - E\hat\theta] = 0$ por definición de esperanza. Lo
                que queda son los dos sumandos:</p>
              $$\text{ECM} = V(\hat\theta) + B(\hat\theta)^2$$
            </li>
            <li>
              <p style="margin-bottom:0;">La consecuencia práctica está en el papel de $n$. Bajo muestreo aleatorio
                simple, $V = (1 - n/N)\,S^2/n$, que tiende a cero cuando $n \to N$. El sesgo $B$ no contiene $n$ por
                ningún lado: es una propiedad del <em>procedimiento</em>, no del tamaño. Un censo hace $V = 0$ y deja
                $B$ intacto.</p>
            </li>
          </ol>
        </div>
      </div>

  <!-- MÓDULO 9 · Sesgo de muestreo en ciencia de datos e IA         -->
  <!-- ============================================================ -->
  <template id="module-9">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 9</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Sesgo de muestreo en ciencia
          de datos e IA <span class="text-gray-400 font-normal text-2xl">/ The same errors, new names</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Traducir el vocabulario del capítulo al de un proyecto
              de aprendizaje automático, y comprobar que la matemática no cambia.</p>
          </div>
        </div>
      </div>

      <p>La tentación con un conjunto de datos grande es pensar que el muestreo es un problema de otra época: si están
        «todos», no hay que preocuparse por cómo se eligieron. El módulo 7 acaba de mostrar que eso es exactamente al
        revés. Un sondeo de 2,3 millones de casos equivalía a seis observaciones al azar, y la única razón era el
        mecanismo de selección.</p>

      <h3>El diccionario</h3>

      <div class="diagram">
        <p><strong>población objetivo</strong> ↔ la población sobre la que el modelo va a <em>decidir</em> en producción</p>
        <p><strong>marco muestral</strong> ↔ el conjunto de datos de entrenamiento, con todo lo que quedó fuera de él</p>
        <p><strong>no cobertura</strong> ↔ subpoblaciones ausentes del entrenamiento: el modelo nunca las vio</p>
        <p><strong>autoselección</strong> ↔ los datos existen porque alguien decidió generarlos (reseñas, clics, quejas)</p>
        <p><strong>no respuesta</strong> ↔ registros con campos vacíos, y usuarios que abandonan antes de dejar rastro</p>
        <p><strong>sesgo de medición</strong> ↔ etiquetas ruidosas o sistemáticamente desviadas, anotadores no calibrados</p>
        <p style="margin-bottom:0;"><strong>error de procesamiento</strong> ↔ códigos de faltante tratados como
          números, fugas entre entrenamiento y prueba, transformaciones mal deshechas</p>
      </div>

      <p>No es una analogía decorativa: es la misma fórmula. Si la probabilidad de que un caso entre en el conjunto de
        entrenamiento depende de la variable que se quiere predecir, la estimación —sea una media, sea un parámetro de
        un modelo— arrastra el sesgo $(1-r)(\bar{y}_R - \bar{y}_M)$ del módulo 4, y aumentar el volumen del corpus lo
        deja intacto.</p>

      <h3>Tres casos que son el mismo caso</h3>

      <div class="space-y-4">
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">Un modelo entrenado con reseñas</h4>
          <p class="text-sm" style="margin-bottom:0;">Quien escribe una reseña no es un comprador cualquiera: escribe
            quien está muy satisfecho o muy enfadado. El corpus es una muestra autoseleccionada de la población de
            compradores, y su distribución de satisfacción está vaciada por el centro. Es Hite con otro nombre.</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">Un modelo de riesgo entrenado con créditos aprobados</h4>
          <p class="text-sm" style="margin-bottom:0;">Solo se observa el desenlace de quien recibió el crédito, y esa
            selección la hizo un modelo anterior. Las unidades rechazadas tienen probabilidad cero de aparecer en el
            entrenamiento: <em>no cobertura</em>, con la particularidad de que el marco lo construyó el propio sistema
            que se quiere mejorar.</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">Un panel en línea como el de Mechanical Turk</h4>
          <p class="text-sm" style="margin-bottom:0;">Es el ejemplo del módulo 4, y sigue siendo la fuente de una
            fracción enorme de los datos de comportamiento que alimentan modelos hoy. Edad media 33,7 años frente a los
            60,7 de una muestra probabilística de la misma población.</p>
        </div>
      </div>

      <div class="warning">
        <p><strong>Lo que sí ayuda, y lo que no.</strong> Ponderar por variables observables —lo que en encuestas se
          llama postestratificación y calibración, capítulos 7 y 8— corrige la parte del sesgo que va por esas
          variables, y nada más. El módulo 4 lo enseñó con datos: calibrar las dos encuestas por sexo, edad y raza no
          las acercó. Lo que de verdad ayuda es lo caro: conseguir una muestra probabilística, aunque sea pequeña, y
          usarla como referencia para medir cuánto se desvía la grande.</p>
      </div>

      <div class="note">
        <p><strong>La pregunta que hay que hacerse siempre.</strong> Ante cualquier conjunto de datos, antes de
          entrenar nada: <em>¿qué tuvo que pasar para que esta fila exista?</em> Si la respuesta involucra una decisión
          de la propia unidad, o un filtro correlacionado con lo que se quiere predecir, ya se sabe hacia dónde va a
          apuntar el error. El capítulo 8 vuelve sobre esto en el módulo de auditoría de IA aplicada al diseño
          muestral.</p>
      </div>
