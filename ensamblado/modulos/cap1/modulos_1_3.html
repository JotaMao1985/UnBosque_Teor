          <span class="text-gray-400 font-normal text-2xl">/ What can go wrong</span></h2>

      <p>El muestreo se estudia mejor empezando por lo que puede salir mal. Los dos casos de este módulo tienen algo en
        común que conviene tener presente todo el semestre: <strong>los dos tenían muestras gigantescas</strong>, y los
        dos se equivocaron por márgenes que ninguna muestra pequeña bien tomada habría producido.</p>

      <h3>Caso 1 · Shere Hite (1987)</h3>

      <p><span data-afirma="c1-m1-14">El libro <em>Women and Love: A Cultural Revolution in Progress</em>, de Shere Hite
        <cite class="cita" data-ref="hite1987women" data-via="lohr1999sampling" data-loc="cap. 1" data-modo="parentesis"><a class="cita-enlace" href="#pie-lohr1999sampling" title="Lohr, S. L. (1999). Sampling: design and analysis (1.ª ed.). Duxbury Press.">(Hite, 1987, citado en Lohr, 1999, cap. 1)</a></cite></span>, publicó cifras que dieron la vuelta a la
        prensa estadounidense:</p>

      <ul data-afirma="c1-m1-10">
        <li>el <strong>84 %</strong> de las mujeres «no están satisfechas emocionalmente con sus relaciones» (p. 804);</li>
        <li>el <strong>70 %</strong> de las casadas desde hace cinco o más años «tienen relaciones sexuales fuera del matrimonio» (p. 856);</li>
        <li>el <strong>95 %</strong> de las mujeres «reporta formas de acoso emocional y psicológico» de los hombres con quienes mantiene una relación amorosa (p. 810);</li>
        <li>el <strong>84 %</strong> de las mujeres reporta formas de condescendencia por parte de los hombres con quienes tiene una relación amorosa
          (p. 809) <cite class="cita" data-ref="hite1987women" data-via="lohr1999sampling" data-loc="cap. 1"><a class="cita-enlace" href="#pie-lohr1999sampling" title="Lohr, S. L. (1999). Sampling: design and analysis (1.ª ed.). Duxbury Press.">(Hite, 1987, citado en Lohr, 1999, cap. 1)</a></cite>.</li>
      </ul>

      <div class="warning">
        <p><strong>La metodología.</strong> <span data-afirma="c1-m1-09">Se enviaron <strong>100 000 cuestionarios</strong> a
          organizaciones como grupos profesionales de mujeres, centros de asesoramiento, sociedades de iglesias y
          centros para personas mayores.
          Devolvieron el <strong>4,5 %</strong> <cite class="cita" data-ref="lohr1999sampling" data-loc="cap. 1"><a class="cita-enlace" href="#pie-lohr1999sampling" title="Lohr, S. L. (1999). Sampling: design and analysis (1.ª ed.). Duxbury Press.">(Lohr, 1999, cap. 1)</a></cite></span>: unas 4 500 respuestas. <span data-afirma="c1-m1-11">El cuestionario tenía
          127 preguntas abiertas, la mayoría con varias partes <cite class="cita" data-ref="lohr1999sampling" data-loc="cap. 1"><a class="cita-enlace" href="#pie-lohr1999sampling" title="Lohr, S. L. (1999). Sampling: design and analysis (1.ª ed.). Duxbury Press.">(Lohr, 1999, cap. 1)</a></cite></span>.</p>
      </div>

      <p>Cuatro mil quinientas respuestas son una muestra grande. El problema no es ese. El problema es que quien
        decidía entrar en la muestra era
        <em>la propia encuestada</em>, y que devolver 127 preguntas abiertas exige una motivación que no está repartida
        al azar entre las mujeres de Estados Unidos. Hite no se equivocó al recoger esas voces ni al publicarlas: se
        equivocó al ponerles un porcentaje y atribuirlo a todas las mujeres.</p>

      <div class="note">
        <p><strong>Dale la vuelta a la pregunta.</strong> Si en la población el porcentaje real fuera del 25 % en vez
          del 84 %, ¿qué tendrían que haber contestado las que <em>no</em> devolvieron el cuestionario? La fórmula del
          sesgo de no respuesta —que se monta en el módulo 4 y se formaliza en el capítulo 8— responde: bastaría con
          que fuera el <strong>22,2 %</strong>. Nada extraordinario. Los datos de Hite son compatibles con casi
          cualquier valor poblacional, y por eso no dicen nada sobre él.</p>
      </div>

      <h3>Caso 2 · <em>The Literary Digest</em> (1936)</h3>

      <p><em>The Literary Digest</em> era una de las revistas más respetadas de Estados Unidos y <span data-afirma="c1-m1-13">había acertado las cinco elecciones
        anteriores <cite class="cita" data-ref="lohr2022sampling" data-loc="ejemplo 1.1"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, ejemplo 1.1)</a></cite></span>. <span data-afirma="c1-m1-07">En 1932 predijo un 56 % para Roosevelt y el resultado fue 57 %
        <cite class="cita" data-ref="lohr2022sampling" data-loc="ejemplo 1.1"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, ejemplo 1.1)</a></cite></span>. <span data-afirma="c1-m1-01">En 1936 envió
        <strong>diez millones de papeletas</strong> y le devolvieron <strong>más de 2,3 millones</strong>
        <cite class="cita" data-ref="lohr2022sampling" data-loc="ejemplo 1.1"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, ejemplo 1.1)</a></cite></span>.</p>

          <p class="text-center text-2xl font-bold" style="margin:0;">Landon 54 % · Roosevelt 41 %</p>
        </div>
        <div class="bg-green-50 p-3 rounded">
          <p class="font-bold text-center" style="margin:0;">Elección</p>
          <p class="text-center text-2xl font-bold" style="margin:0;">Roosevelt 61 % · Landon 37 %</p>

        <p class="md:col-span-2 text-sm text-center" style="margin:0;">Fuente: <cite class="cita" data-ref="lohr2022sampling" data-loc="ejemplo 1.1" data-modo="narrativa"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">Lohr (2022, ejemplo 1.1)</a></cite></p>
      </div>

      <p><span data-afirma="c1-m1-08">Roosevelt ganó 523 de los 531 votos electorales <cite class="cita" data-ref="lohr2022sampling" data-loc="ejemplo 15.12"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, ejemplo 15.12)</a></cite>. La revista desapareció en
        1938 <cite class="cita" data-ref="lohr2022sampling" data-loc="ejemplo 1.1"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, ejemplo 1.1)</a></cite></span>. <span data-afirma="c1-m1-03">La propia revista tituló su último artículo antes de la elección «Landon,
        1 293 669; Roosevelt, 972 897» <cite class="cita" data-ref="literarydigest1936landon" data-via="lohr2022sampling" data-loc="p. 618"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Literary Digest, 1936, citado en Lohr, 2022, p. 618)</a></cite>; contando solo esos dos candidatos, el
        sondeo dio un <strong>42,92 %</strong> a Roosevelt</span> <span data-afirma="c1-m1-18">cuando el valor real, con los votos de la
        elección, era <strong>62,47 %</strong> <cite class="cita" data-ref="lohr2022sampling" data-loc="ejercicio 15.8"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, ejercicio 15.8)</a></cite></span>. El sesgo
        fue de <strong>−19,54 puntos</strong>.</p>

      <div class="definition">
        <h4>Las dos causas, y por qué hay que separarlas</h4>
        <p><strong>No cobertura.</strong> <span data-afirma="c1-m1-04">La lista se armó con guías de teléfono, registros de automóviles, listas de
          suscriptores y padrones electorales
          <cite class="cita" data-ref="lohr2022sampling" data-loc="ejemplo 1.1; ejemplo 15.12"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, ejemplo 1.1; ejemplo 15.12)</a></cite></span>. En 1936, tener teléfono o carro era señal de estar por encima de la
          media, y la opinión sobre las políticas de Roosevelt dependía justamente de la posición económica.</p>
        <p style="margin-bottom:0;"><strong>No respuesta.</strong> <span data-afirma="c1-m1-05">Contestó menos de una cuarta parte de los
          solicitados</span>, y <span data-afirma="c1-m1-12">los partidarios de Landon devolvieron la papeleta con mucha más frecuencia
          <cite class="cita" data-ref="squire1988why" data-via="lohr2022sampling" data-loc="ejemplo 1.1"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Squire, 1988, citado en Lohr, 2022, ejemplo 1.1)</a></cite></span>. <span data-afirma="c1-m1-06">En Allentown

          cobertura— y el resultado seguía siendo erróneo, porque solo devolvió la papeleta un tercio
          <cite class="cita" data-ref="lohr2022sampling" data-loc="ejemplo 1.1"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, ejemplo 1.1)</a></cite></span>.</p>
      </div>

      <p>El caso de Allentown es el que zanja el argumento: <strong>la no respuesta sola basta para arruinar una
        encuesta</strong>, aunque el marco sea impecable. El simulador de abajo permite repartir el sesgo entre las dos
        causas y ver que los datos, por sí solos, no distinguen cuál pesó más.</p>

      <div class="simulador" data-simulador="digest">
        <h4><i class="fas fa-vote-yea" aria-hidden="true"></i> El sesgo del <em>Digest</em>, partido en dos</h4>
        <p class="simulador-intro">Mueve la cobertura del marco $C$, la brecha de apoyo entre los que quedaron dentro y
          fuera, y la respuesta relativa $\rho$: la tasa de respuesta de los partidarios de Roosevelt dividida por la de los
          de Landon. La primera gráfica compara el apoyo
          real, el apoyo dentro del marco y lo que acaba viendo el sondeo. La segunda dibuja <strong>todas</strong> las
          combinaciones que reproducen exactamente el 42,9 % publicado: cuando el punto negro cae sobre la curva
          naranja, tu escenario es indistinguible del que ocurrió.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Apoyo a Roosevelt (base de dos candidatos)</p>
        <div class="grafico-wrapper" style="height:270px;">
          <canvas aria-label="Apoyo real, apoyo dentro del marco y estimación del sondeo" role="img"></canvas>
        </div>
        <p class="grafico-etiqueta">Combinaciones compatibles con el resultado observado</p>
        <div class="grafico-wrapper" style="height:270px;">
          <canvas aria-label="Curva de combinaciones de brecha de cobertura y razón de respuesta que reproducen el sondeo" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
        <p class="text-xs text-gray-500" style="margin:0.5rem 0 0;">Fuente: elaboración propia con un modelo de dos causas, ajustado al sondeo y a los votos de 1936 de <cite class="cita" data-ref="lohr2022sampling" data-loc="" data-modo="narrativa"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">Lohr (2022)</a></cite>.</p>
      </div>

      <details class="lectura-guiada">
        <summary><i class="fas fa-lightbulb" aria-hidden="true"></i> ¿Qué deberías llevarte de este simulador?</summary>
        <div class="lectura-guiada-cuerpo">
          <p><strong>Qué mueves.</strong> Los tres deslizadores reparten la culpa entre las dos causas: $C$ dice cuánta
            población entró en el marco, la brecha dice cuánto se diferenciaban los que quedaron fuera, y $\rho$, cuánto
            devolvían la papeleta los partidarios de Roosevelt en comparación con los de Landon: por debajo de 1,
            los de Roosevelt la devolvían menos.</p>
          <p><strong>Qué se ve.</strong> El primer gráfico hace lo que se espera: las tres barras se separan y la
            estimación acaba por debajo del umbral de la victoria. El segundo es el que enseña de verdad. La curva
            naranja no es una tendencia: es el conjunto de <em>todos</em> los escenarios que producen exactamente el
            resultado que se publicó. Lleva el punto negro a un extremo —mucha no cobertura y poca no respuesta— y después al otro: mientras caiga sobre la curva, el sondeo sale idéntico en los dos casos.</p>
          <p><strong>Y ahí está la trampa.</strong> Si escenarios distintos producen el mismo dato observado, el dato no
            puede decirte en cuál estabas. Ninguna cantidad de papeletas arregla eso, porque no es un problema de ruido:
            la información no está. Lo que zanjó el caso no fue el resultado nacional, sino Allentown: allí el marco era
            completo, lo que pone una de las dos causas exactamente a cero y deja la otra a la vista.</p>
          <p class="lectura-guiada-clave">
            <span class="rotulo">La idea que se lleva</span>
            Cuando dos causas entran sumadas en un mismo número, los datos por sí solos no las separan: hace falta
            información de fuera de la encuesta. Es la primera aparición de un problema que vuelve en el capítulo 8, al
            decidir qué se está suponiendo sobre los que no respondieron para poder ponderar.
          </p>
        </div>
      </details>

            <p class="text-gray-600 text-sm" style="margin:0;">Nombrar con precisión las seis cosas que hay que

      <p>Los dos casos del módulo anterior se diagnostican con el mismo vocabulario. Vale la pena fijarlo ahora, porque
        el resto del curso lo da por sabido.</p>

      <p>Concretemos con el <em>Literary Digest</em>. Su <strong>población objetivo</strong> eran los votantes de
        1936. <span data-afirma="c1-m2-04">Su <strong>marco</strong> —la lista de la que salieron los nombres— se armó con guías de
        teléfono, registros de automóviles y otras listas. Su <strong>muestra</strong>, las más de 2,3 millones de
        papeletas devueltas de las 10 000 000 enviadas <cite class="cita" data-ref="lohr2022sampling" data-loc="ejemplo 1.1"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, ejemplo 1.1)</a></cite></span>. Tres conjuntos encajados y distintos, y el desastre nació exactamente en las dos
        brechas: entre la población y el marco, y entre el marco y quien contestó.</p>

      <div class="definition">
        <h4>Las seis piezas</h4>
        <p><strong>Población objetivo.</strong> El conjunto sobre el que se quiere concluir. Se escribe
          $U = \{1, 2, \dots, N\}$, y $N$ es su tamaño. Definirla exige decidir tres cosas: <em>qué</em> unidades,
          <em>dónde</em> y <em>cuándo</em>.</p>
        <p><strong>Unidad de muestreo.</strong> Lo que se selecciona. <strong>Unidad de observación.</strong> Aquello
          de lo que se toma el dato. No siempre coinciden: se selecciona un hogar y se entrevista a cada persona.</p>
        <p><strong>Marco muestral.</strong> La lista concreta de la que se extrae la muestra. Es un objeto físico —un
          archivo, un padrón, un directorio— y casi nunca coincide con $U$.</p>
        <p><strong>Población muestreada.</strong> El conjunto que <em>realmente</em> tenía alguna posibilidad de entrar.
          Es a esta, y no a la objetivo, a la que se refieren las conclusiones cuando el marco falla.</p>
        <p><strong>Variable de interés.</strong> El valor $y_k$ que lleva cada unidad $k$ de la población. Es una
          constante fija, desconocida: lo aleatorio es <em>qué unidades se observan</em>, no cuánto vale $y_k$.</p>
        <p style="margin-bottom:0;"><strong>Parámetro.</strong> La función de todos los $y_k$ que se quiere conocer:
          el total $t = \sum_{k \in U} y_k$, la media $\bar{y}_U = t/N$, una proporción, una mediana.</p>
      </div>

      <div class="diagram">
        <p><strong>Población objetivo</strong> &nbsp;→&nbsp; <strong>marco muestral</strong> &nbsp;→&nbsp;
          <strong>muestra seleccionada</strong> &nbsp;→&nbsp; <strong>muestra observada</strong></p>
        <p style="margin-bottom:0;">Cada flecha puede perder unidades. La primera pierde por <em>no cobertura</em>; la
          tercera, por <em>no respuesta</em>. El capítulo 2 se ocupa de la segunda flecha, que es la única que el
          estadístico controla del todo.</p>
      </div>

      <h3>La población del curso</h3>

      <p>Casi todos los ejemplos de este material salen de <code>agpop</code>: <span data-afirma="c1-m2-01">los 3 078 condados y equivalentes de Estados Unidos en el censo
        agrícola de 1992 <cite class="cita" data-ref="lohr2022sampling" data-loc="ejemplo 2.6"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, ejemplo 2.6)</a></cite></span>. Tiene una propiedad que ninguna población real tiene en el trabajo diario
        y que la hace insustituible para aprender: <strong>está entera</strong>, así que cualquier estimación se puede

  <!-- MÓDULO 3 · Requisitos de una buena muestra                    -->
  <!-- ============================================================ -->
  <template id="module-3">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 3</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Requisitos de una buena
          muestra <span class="text-gray-400 font-normal text-2xl">/ What makes a sample good</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Sustituir la idea intuitiva de «muestra representativa»
              por una condición que se puede comprobar.</p>
          </div>
        </div>
      </div>

      <p>«Representativa» es una palabra que suena a garantía y no lo es. Una muestra de 2,3 millones de personas puede
        ser espectacularmente poco representativa, y una de mil puede bastar. Lo que separa a una de otra no es el
        tamaño ni el parecido aparente con la población: es <strong>cómo se eligió</strong>.</p>

      <div class="definition">
        <h4>Muestra probabilística</h4>
        <p style="margin-bottom:0;">Una muestra es probabilística cuando se conoce, antes de seleccionarla, la
          probabilidad con la que cada unidad de la población puede entrar —su <strong>probabilidad de
          inclusión</strong>, que para la unidad $k$ se escribe $\pi_k$—; y esa probabilidad es <strong>positiva para
          todas</strong>: $\pi_k > 0$ para toda $k$. Solo entonces tienen sentido las palabras «insesgado», «varianza» y «error estándar»: las
          tres son esperanzas respecto de ese mecanismo de selección.</p>
      </div>

      <p>Es una definición exigente y tiene consecuencias inmediatas. Si una unidad tiene probabilidad cero —porque no
        está en el marco, o porque decidió no participar— <strong>ningún estimador puede ser insesgado</strong> para
        la población que la incluye. No es un problema que se arregle después con más datos o con un modelo mejor: es
        una propiedad del procedimiento de selección, y se decide antes de recoger nada.</p>

      <h3>Los tres requisitos, en orden de importancia</h3>

      <div class="space-y-4">
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">1 · Un marco que cubra la población</h4>
          <p class="text-sm" style="margin-bottom:0;">Todas las unidades de $U$ tienen que estar en la lista de la que
            se muestrea. Lo que falte del marco no lo recupera ningún diseño posterior.</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">2 · Un mecanismo de selección aleatorio y conocido</h4>
          <p class="text-sm" style="margin-bottom:0;">No basta con que sea aleatorio: hay que <em>saber</em> con qué
            probabilidad entra cada unidad, porque esas probabilidades, las $\pi_k$, son las que después ponderan la estimación. Es
            el objeto que se construye en el capítulo 2.</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">3 · Una tasa de respuesta alta</h4>
          <p class="text-sm" style="margin-bottom:0;">La no respuesta convierte un diseño probabilístico impecable en
            una muestra autoseleccionada. Es el capítulo 8, y es donde se pierden la mayoría de las encuestas reales.</p>
        </div>
      </div>

      <div class="simulador" data-simulador="arquitectos">
        <h4><i class="fas fa-users" aria-hidden="true"></i> Los 14 arquitectos, mil veces</h4>
        <p class="simulador-intro">La ciudad del ejercicio 4 del módulo 10: hay 14 arquitectos y se quieren 8. Elige
          cómo se escogen y el simulador repite la selección mil veces: cada barra dice en qué fracción de las
          repeticiones entró cada arquitecto, que es una estimación de su probabilidad de inclusión $\pi_k$.</p>
        <div class="simulador-controles"></div>
        <div class="grafico-wrapper" style="height:270px;">
          <canvas aria-label="Fracción de repeticiones en que entra cada arquitecto" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
        <p class="text-xs text-gray-500" style="margin:0.5rem 0 0;">Fuente: elaboración propia con la situación de <cite class="cita" data-ref="lohr1999sampling" data-loc="" data-modo="narrativa"><a class="cita-enlace" href="#pie-lohr1999sampling" title="Lohr, S. L. (1999). Sampling: design and analysis (1.ª ed.). Duxbury Press.">Lohr (1999)</a></cite>.</p>
      </div>

      <details class="lectura-guiada">
        <summary><i class="fas fa-lightbulb" aria-hidden="true"></i> ¿Qué deberías llevarte de este simulador?</summary>
        <div class="lectura-guiada-cuerpo">
          <p><strong>Qué mueves.</strong> El procedimiento, y en el segundo, la probabilidad de que cada arquitecto
            acepte cuando lo llaman.</p>
          <p><strong>Qué se ve.</strong> Con los ocho primeros del directorio (si todos aceptan), las barras son todo o nada: ocho
            arquitectos entran siempre y seis no entran nunca, aunque las $\pi_k$ sumen 8. Llamando por orden, la
            probabilidad baja con la posición en la lista, y depende de quién acepta. Solo el sorteo deja las catorce
            barras a la misma altura, sobre la línea verde.</p>
          <p style="margin-bottom:0;"><strong>Por qué importa.</strong> El requisito 2 no es «que haya azar», sino
            conocer cada $\pi_k$ y que ninguna sea cero. El primer procedimiento la conoce y no la cumple; el segundo
            ni siquiera la conoce, porque depende de quién conteste el teléfono.</p>
        </div>
      </details>

      <div class="note">
        <p><strong>Y entonces, ¿por qué no un censo?</strong> Porque una muestra bien tomada suele ser
          <em>mejor</em>, no solo más barata: llega más rápido, permite controlar la calidad de la medición sobre pocos
          casos, y no destruye la población cuando la medición es destructiva. Y porque el error de muestreo, que es lo
          único que el censo elimina, <span data-afirma="c1-m3-02">a veces es despreciable frente a los errores ajenos al muestreo <cite class="cita" data-ref="lohr2022sampling" data-loc="§1.6"><a class="cita-enlace" href="#pie-lohr2022sampling" title="Lohr, S. L. (2022). Sampling: Design and Analysis (3.ª ed.). Chapman and Hall/CRC. https://doi.org/10.1201/9780429298899">(Lohr, 2022, §1.6)</a></cite></span>. El módulo 7 lo
          cuantifica.</p>
      </div>

      <div class="warning">
        <p><strong>Un caso colombiano: el censo también pierde gente.</strong> <span data-afirma="c1-m3-03">Tras el
          Censo Nacional de Población y Vivienda de 2018, el DANE calculó la omisión censal —las personas que el censo
          no contó— y ajustó la cobertura en un 8,5 % para el total nacional: un 6,4 % en las cabeceras municipales y
          un 15,0 % en los centros poblados y el rural disperso
          <cite class="cita" data-ref="dane2019omision" data-loc="p. 3"><a class="cita-enlace" href="#pie-dane2019omision" title="Departamento Administrativo Nacional de Estadística. (2019). Resultados proceso de omisión censal: Censo Nacional de Población y Vivienda CNPV 2018 [Comunicado de prensa]. Departamento Administrativo Nacional de Estadística (DANE). https://www.dane.gov.co/files/censo2018/informacion-tecnica/cnpv-2018-omision-censal.pdf">(Departamento Administrativo Nacional de Estadística, 2019, p. 3)</a></cite></span>.</p>
        <p style="margin-bottom:0;">Censar no hace desaparecer la no cobertura, y la que queda no se reparte pareja:
          en el total nacional, la proporción de gente que se quedó sin contar fuera de las cabeceras fue más del doble
          que en ellas. Si una variable se comporta distinto en
          el campo y en la ciudad, el censo sin ajustar la estima con sesgo, por completo que parezca. Es lo que el
          módulo 7 pone en fórmula: un censo hace cero la varianza y deja el sesgo como estaba.</p>
      </div>

      <p class="paso-siguiente"><strong>Lo que sigue.</strong> El módulo 4 mira qué pasa cuando fallan esos requisitos: la no cobertura rompe el primero, la autoselección
        el segundo y la no respuesta el tercero, que además tiene fórmula.</p>
