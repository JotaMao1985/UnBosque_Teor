      <p>El muestreo se estudia mejor empezando por lo que puede salir mal. Los dos casos de este módulo tienen algo en
        común que conviene tener presente todo el semestre: <strong>los dos tenían muestras gigantescas</strong>, y los
        dos se equivocaron por márgenes que ninguna muestra pequeña bien tomada habría producido.</p>

      <h3>Caso 1 · Shere Hite (1987)</h3>

      <p>El libro <em>Women and Love: A Cultural Revolution in Progress</em> publicó cifras que dieron la vuelta a la
        prensa estadounidense:</p>

      <ul>
        <li>el <strong>84 %</strong> de las mujeres «no están satisfechas emocionalmente con sus relaciones» (p. 804);</li>
        <li>el <strong>70 %</strong> de las casadas desde hace cinco o más años «tienen relaciones fuera del matrimonio» (p. 856);</li>
        <li>el <strong>95 %</strong> «reporta formas de acoso emocional y psicológico» (p. 810);</li>
        <li>el <strong>84 %</strong> «reporta formas de condescendencia» (p. 809).</li>
      </ul>

      <div class="warning">
        <p><strong>La metodología.</strong> Se enviaron <strong>100 000 cuestionarios</strong> a organizaciones de
          mujeres, centros de asesoramiento, grupos parroquiales y asociaciones profesionales. Devolvieron el
          <strong>4,5 %</strong>: unas 4 500 respuestas. El cuestionario tenía 127 preguntas abiertas, la mayoría con
          varias partes.</p>
      </div>

      <p>4 500 es una muestra grande. El problema no es ese. El problema es que quien decidía entrar en la muestra era
        <em>la propia encuestada</em>, y que devolver 127 preguntas abiertas exige una motivación que no está repartida
        al azar entre las mujeres de Estados Unidos. Hite no se equivocó al recoger esas voces ni al publicarlas: se
        equivocó al ponerles un porcentaje y atribuirlo a todas las mujeres.</p>

      <div class="note">
        <p><strong>Dale la vuelta a la pregunta.</strong> Si en la población el porcentaje real fuera del 25 % en vez
          del 84 %, ¿qué tendrían que haber contestado las que <em>no</em> devolvieron el cuestionario? La fórmula del
          sesgo de no respuesta —que se monta en el módulo 4 y se formaliza en el capítulo 8— responde: bastaría con
          que fuera el <strong>22,2 %</strong>. Nada extraordinario. Los datos de Hite son compatibles con casi
          cualquier valor poblacional, y por eso no dicen nada sobre él.</p>
      </div>

      <h3>Caso 2 · <em>The Literary Digest</em> (1936)</h3>

      <p><em>The Literary Digest</em> era una de las revistas más respetadas de Estados Unidos y llevaba veinte años
        acertando elecciones. En 1932 predijo un 56 % para Roosevelt y el resultado fue 57 %. En 1936 envió
        <strong>diez millones de papeletas</strong> y le devolvieron <strong>más de 2,3 millones</strong>.</p>

      <p>Roosevelt ganó 523 de los 531 votos electorales. La revista desapareció en 1938. El recuento del propio sondeo

        fue de <strong>−19,32 puntos</strong>.</p>

        <p><strong>No cobertura.</strong> La lista se armó con guías de teléfono, registros de automóviles, listas de
          suscriptores y padrones electorales. En 1936, tener teléfono o coche era señal de estar por encima de la
          media, y la opinión sobre las políticas de Roosevelt dependía justamente de la posición económica.</p>
        <p style="margin-bottom:0;"><strong>No respuesta.</strong> Contestó menos de una cuarta parte de los
          solicitados, y los partidarios de Landon devolvieron la papeleta con mucha más frecuencia. En Allentown
          (Pensilvania) la revista escribió a <em>todos</em> los votantes registrados —marco perfecto, cero no
          cobertura— y el resultado seguía siendo erróneo, porque solo devolvió la papeleta un tercio.</p>
      </div>

            <p class="text-gray-600 text-sm" style="margin:0;">Nombrar con precisión las seis cosas que hay que
              distinguir antes de tocar un dato. Casi todos los desastres del módulo 1 son un choque entre dos de
              ellas.</p>
          </div>
        </div>
      </div>

      <p>Los dos casos del módulo anterior se diagnostican con el mismo vocabulario. Vale la pena fijarlo ahora, porque
        el resto del curso lo da por sabido.</p>

      <p>Concretemos con el <em>Literary Digest</em>. Su <strong>población objetivo</strong> eran los votantes de
        1936. Su <strong>marco</strong> —la lista de la que salieron los nombres— fueron los registros de
        propietarios de teléfono y automóvil. Su <strong>muestra</strong>, los 2 266 566 que devolvieron la papeleta
        de los 10 000 000 enviadas. Tres conjuntos encajados y distintos, y el desastre nació exactamente en las dos
        brechas: entre la población y el marco, y entre el marco y quien contestó.</p>

      <div class="definition">
        <h4>Las seis piezas</h4>
        <p><strong>Población objetivo.</strong> El conjunto sobre el que se quiere concluir. Se escribe
          $U = \{1, 2, \dots, N\}$, y $N$ es su tamaño. Definirla exige decidir tres cosas: <em>qué</em> unidades,
          <em>dónde</em> y <em>cuándo</em>.</p>
        <p><strong>Unidad de muestreo.</strong> Lo que se selecciona. <strong>Unidad de observación.</strong> Aquello
          de lo que se toma el dato. No siempre coinciden: se selecciona un hogar y se entrevista a cada persona.</p>
        <p><strong>Marco muestral.</strong> La lista concreta de la que se extrae la muestra. Es un objeto físico —un
          archivo, un padrón, un directorio— y casi nunca coincide con $U$.</p>
        <p><strong>Población muestreada.</strong> El conjunto que <em>realmente</em> tenía alguna posibilidad de entrar.
          Es a esta, y no a la objetivo, a la que se refieren las conclusiones cuando el marco falla.</p>
        <p><strong>Variable de interés.</strong> El valor $y_k$ que lleva cada unidad $k$ de la población. Es una
          constante fija, desconocida: lo aleatorio es <em>qué unidades se observan</em>, no cuánto vale $y_k$.</p>
        <p style="margin-bottom:0;"><strong>Parámetro.</strong> La función de todos los $y_k$ que se quiere conocer:
          el total $t = \sum_{k \in U} y_k$, la media $\bar{y}_U = t/N$, una proporción, una mediana.</p>
      </div>

      <div class="diagram">
        <p><strong>Población objetivo</strong> &nbsp;→&nbsp; <strong>marco muestral</strong> &nbsp;→&nbsp;
          <strong>muestra seleccionada</strong> &nbsp;→&nbsp; <strong>muestra observada</strong></p>
        <p style="margin-bottom:0;">Cada flecha puede perder unidades. La primera pierde por <em>no cobertura</em>; la
          tercera, por <em>no respuesta</em>. El capítulo 2 se ocupa de la segunda flecha, que es la única que el
          estadístico controla del todo.</p>
      </div>

      <div class="glosario-notacion" data-glosario="conceptos"></div>

      <h3>La población del curso</h3>

  <!-- MÓDULO 3 · Requisitos de una buena muestra                    -->
  <!-- ============================================================ -->
  <template id="module-3">
    <div class="animate-fade-in">
      <div class="border-b border-gray-100 pb-6 mb-6">
        <div class="flex items-center space-x-2 text-sm text-secondary font-semibold mb-2 uppercase tracking-wide">
          <span>Módulo 3</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 mb-4" style="border:none; padding:0;">Requisitos de una buena
          muestra <span class="text-gray-400 font-normal text-2xl">/ What makes a sample good</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Sustituir la idea intuitiva de «muestra representativa»
              por una condición que se puede comprobar.</p>
          </div>
        </div>
      </div>

      <p>«Representativa» es una palabra que suena a garantía y no lo es. Una muestra de 2,4 millones de personas puede
        ser espectacularmente poco representativa, y una de mil puede bastar. Lo que separa a una de otra no es el
        tamaño ni el parecido aparente con la población: es <strong>cómo se eligió</strong>.</p>

      <div class="definition">
        <h4>Muestra probabilística</h4>
        <p style="margin-bottom:0;">Una muestra es probabilística cuando se conoce, antes de seleccionarla, la
          probabilidad con la que cada unidad de la población puede entrar; y esa probabilidad es <strong>positiva para
          todas</strong>. Solo entonces tienen sentido las palabras «insesgado», «varianza» y «error estándar»: las
          tres son esperanzas respecto de ese mecanismo de selección.</p>
      </div>

      <p>Es una definición exigente y tiene consecuencias inmediatas. Si una unidad tiene probabilidad cero —porque no
        está en el marco, o porque decidió no participar— <strong>ningún estimador puede ser insesgado</strong> para
        la población que la incluye. No es un problema que se arregle después con más datos o con un modelo mejor: es
        una propiedad del procedimiento de selección, y se decide antes de recoger nada.</p>

      <h3>Los tres requisitos, en orden de importancia</h3>

      <div class="space-y-4">
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">1 · Un marco que cubra la población</h4>
          <p class="text-sm" style="margin-bottom:0;">Todas las unidades de $U$ tienen que estar en la lista de la que
            se muestrea. Lo que falte del marco no lo recupera ningún diseño posterior.</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">2 · Un mecanismo de selección aleatorio y conocido</h4>
          <p class="text-sm" style="margin-bottom:0;">No basta con que sea aleatorio: hay que <em>saber</em> con qué
            probabilidad entra cada unidad, porque esas probabilidades son las que después ponderan la estimación. Es
            el objeto que se construye en el capítulo 2.</p>
        </div>
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
          <h4 class="text-primary font-bold" style="margin-top:0;">3 · Una tasa de respuesta alta</h4>
          <p class="text-sm" style="margin-bottom:0;">La no respuesta convierte un diseño probabilístico impecable en
            una muestra autoseleccionada. Es el capítulo 8, y es donde se pierden la mayoría de las encuestas reales.</p>
        </div>
      </div>

      <div class="note">
        <p><strong>Y entonces, ¿por qué no un censo?</strong> Porque una muestra bien tomada suele ser
          <em>mejor</em>, no solo más barata: llega más rápido, permite controlar la calidad de la medición sobre pocos
          casos, y no destruye la población cuando la medición es destructiva. Y porque el error de muestreo, que es lo
          único que el censo elimina, es casi siempre el más pequeño de todos los errores en juego. El módulo 7 lo
          cuantifica.</p>
      </div>

      <div class="references">
        <h3><i class="fas fa-book-open mr-2" aria-hidden="true"></i>Para ampliar este módulo</h3>
        <ul style="margin-bottom:0;">
          <li>Lohr (2021), <strong>secciones 1.3 y 1.6</strong> — qué hace buena a una muestra y por qué se muestrea en
            vez de censar.</li>

            1.3</strong> — la formulación canónica del muestreo probabilístico que sostiene todo el capítulo 2.</li>
        </ul>
