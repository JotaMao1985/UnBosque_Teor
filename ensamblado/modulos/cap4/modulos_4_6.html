  <template id="module-4">

          <span class="text-gray-400 font-normal text-2xl">/ Allocation</span></h2>
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">
          <span class="text-xl">🎯</span>
          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Repartir el presupuesto de $n$ entrevistas entre los
              estratos: proporcional, igual y Neyman, con la ganancia de cada una medida sobre la población real.</p>
          </div>
        </div>
      </div>

      <p>Estratificar abre una decisión que el MAS no tenía: ¿cuántas entrevistas van a cada estrato? La fórmula de la
        varianza del módulo 2 la convierte en un problema de optimización con tres respuestas célebres.</p>

      <p>Con 300 condados que repartir entre las cuatro regiones, tres repartos razonables dan tres resultados muy
        distintos. Repartir <em>a partes iguales</em> (75 y 75 y 75 y 75) deja una varianza de 402 millones;
        repartir <em>en proporción al tamaño</em> de cada región (103, 21, 135 y 41) la sube a 446… que es
        <strong>peor</strong>. Y el reparto de Neyman —86, 5, 102 y 107— la deja en 299. Ese 5 en el Nordeste
        sorprende: es la región con menos variabilidad, y por eso casi no hace falta mirarla.</p>

      <div class="definition">
        <h4>Las tres asignaciones</h4>
        <ul style="margin-bottom:0;">
          <li><strong>Proporcional:</strong> $n_h = n \, W_h$. La muestra es una maqueta de la población, los pesos
            salen todos iguales (<em>autoponderada</em>) y, con estratos grandes, casi nunca lo hace peor que el
            MAS; el módulo 7 da la condición exacta en que pierde.</li>
          <li><strong>Igual:</strong> $n_h = n/H$. Reparte precisión por igual entre los estratos: es la elección
            cuando el objetivo son las <em>comparaciones entre</em> estratos, no el agregado nacional.</li>
          <li><strong>Neyman:</strong> $n_h \propto N_h S_{y,h}$. Minimiza la varianza del agregado: manda
            entrevistas donde hay más unidades <em>y</em> más dispersión.</li>
        </ul>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-neyman">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver de dónde sale la asignación de Neyman</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-neyman" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Se minimiza la parte de la varianza que depende del reparto, sujeta a que el reparto sume $n$:</p>
              $$\min_{n_1,\dots,n_H} \; \sum_{h} \frac{W_h^2 S^2_{y,h}}{n_h}
                \quad \text{sujeto a} \quad \sum_h n_h = n$$
              <p>(el término $-\sum_h W_h^2 S^2_{y,h}/N_h$ del fpc no depende de los $n_h$ y no juega).</p>
            </li>
            <li>
              <p>Lagrange: $\dfrac{\partial}{\partial n_h}\left[\sum_h \dfrac{W_h^2 S^2_{y,h}}{n_h} +
                \lambda \sum_h n_h\right] = -\dfrac{W_h^2 S^2_{y,h}}{n_h^2} + \lambda = 0
                \;\Longrightarrow\; n_h = \dfrac{W_h S_{y,h}}{\sqrt{\lambda}}.$</p>
            </li>
            <li>
              <p>Imponer $\sum_h n_h = n$ fija $\lambda$ y deja</p>
              $$n_h = n \cdot \frac{N_h S_{y,h}}{\sum_g N_g S_{y,g}}$$
              <p>Cada estrato recibe en proporción a su masa por su dispersión. Un estrato homogéneo casi no
                necesita muestra por grande que sea; uno disperso la necesita aunque sea chico.</p>
            </li>
            <li>
              <p><strong>Cuánto se gana, en cerrado.</strong> Sustituyendo cada reparto en la varianza e ignorando
                los fpc, la diferencia se cierra en una sola expresión:</p>
              $$V_{\text{prop}} - V_{\text{Ney}}
                = \frac{1}{n}\left[\sum_h W_h S^2_{y,h} - \Big(\sum_h W_h S_{y,h}\Big)^{\!2}\right]
                = \frac{1}{n}\sum_h W_h \big(S_{y,h} - \bar{S}\big)^2,
                \qquad \bar{S} = \sum_h W_h S_{y,h}$$
              <p><strong>La ganancia de Neyman es la dispersión de las dispersiones.</strong> Si todas las
                $S_{y,h}$ son iguales, la suma es cero: Neyman <em>es</em> la proporcional y no hay nada que ganar.
                Cuanto más difieran entre sí, más paga separarlas. En <code>agpop</code> las dos vías dan el mismo
                <strong>146 643 787</strong>, que el bloque de más abajo comprueba.</p>
              <p style="margin-bottom:0;">El mismo argumento con costos (módulo 5) da el corolario:
                si $S_{y,h}/\sqrt{c_h}$ no cambia de un estrato a otro, la óptima con costos <em>también</em> es
                la proporcional.</p>
            </li>
          </ol>
        </div>
      </div>

      <p>La tabla trae una fila de <strong>deff</strong>, que es la vara de comparar diseños fijada en la
        Definición 2.10 del capítulo 2: la varianza del diseño dividida entre la del MAS del mismo $n$ —aquí, el de
        estos mismos 300 condados—. Menos de 1, el diseño le gana al MAS; más de 1, pierde. Estos deff son <strong>exactos</strong>: numerador y denominador
        salen de <code>agpop</code> entera. El módulo 8 vuelve sobre la misma vara midiéndola con las dos muestras
        reales, le sale otro número, y allí se explica por qué.</p>

      <p>Hay dos sorpresas en esa tabla, y las dos enseñan algo:</p>
      <ul class="list-disc pl-6 space-y-2">
        <li><strong>Neyman vacía el Nordeste y llena el Oeste.</strong> Al Nordeste (220 condados, la desviación más

        <li><strong>Aquí la igual le gana a la proporcional</strong> (deff 0,74 contra 0,82). No es lo habitual, y

      <p><strong>Óptima, ¿para qué variable?</strong> Toda esta comparación se ha hecho con una sola vara,
        <code>acres92</code>, y ahí está la trampa. Neyman reparte según las $S_{y,h}$ <em>de esa</em> variable; una
        encuesta agrícola real preguntaría también por el número de granjas, <code>farms92</code>, que en esta
        población apenas correlaciona <strong>0,147</strong> con la superficie sembrada. Lo que es óptimo para una
        no tiene por qué serlo para la otra. Basta con medir el mismo deff con las dos varas:</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="El deff de cada asignación medido con dos variables">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R6B⟧</code></pre>
        </div>
      </div>

      <p>La primera tabla da un vuelco. Con <code>acres92</code> el orden era igual &lt; proporcional y Neyman muy
        por delante; con <code>farms92</code> se invierte: <strong>la proporcional es la única que sigue por debajo
        de 1</strong> (<strong>0,9723</strong>), mientras que la igual sube a <strong>1,1540</strong> y la Neyman
        de <code>acres92</code> a <strong>1,1190</strong>. Es decir: <strong>la asignación óptima para una variable
        deja la otra peor que un MAS del mismo tamaño</strong>. Y no por poco.</p>

      <p>Esto le da su sentido a la proporcional, que hasta aquí parecía la opción tímida. No gana en ninguna vara,
        pero <strong>no pierde en ninguna</strong>: es la única que no necesita saber qué se va a medir, porque no
        usa ninguna $S_{y,h}$. En una encuesta multipropósito eso vale más que un óptimo prestado de otra variable.</p>

      <p>La segunda tabla es la salida de verdad, y es la que Lohr sugiere: <em>interpolar</em>. La familia
        $n_h \propto N_h S_{y,h}^{\alpha}$ va de la proporcional ($\alpha = 0$) a Neyman ($\alpha = 1$) pasando
        por todo lo de en medio — y en medio está lo bueno. Con $\alpha = 0{,}25$ el deff de <code>acres92</code>
        baja a <strong>0,6919</strong> y el de <code>farms92</code> a <strong>0,9237</strong>:
        <strong>mejor que la proporcional en las dos varas a la vez</strong>. Con $\alpha = 0{,}5$ —repartir por la
        <em>raíz</em> de la desviación en vez de por la desviación— <code>acres92</code> llega a
        <strong>0,6108</strong> y <code>farms92</code>
        aguanta en <strong>0,9304</strong>. Solo al acercarse a Neyman, en $\alpha = 1$, se rompe.</p>

      <p>El otro compromiso que sugiere Lohr llega al mismo sitio por otro camino: fijar un <strong>mínimo por
        estrato</strong> y repartir el resto proporcionalmente. Con un piso de 20 condados sobre los 300, los deff
        quedan en <strong>0,75</strong> y <strong>0,9491</strong>. Sirve además para lo que la fórmula no mira:
        que ningún estrato se quede con tan poca muestra que no se pueda estimar $s^2_h$ ni publicar su cifra.</p>

      <div class="note">
        <p><strong>Neyman necesita conocer las $S_{y,h}$, y nadie las conoce.</strong> Se aproximan con un censo
          anterior, un piloto o una variable correlacionada (aquí serviría <code>acres87</code>). La buena noticia:
          la varianza es plana cerca del óptimo — equivocarse moderadamente en las $S_{y,h}$ cuesta poco. Así se
          diseñó el conteo de caribú que Lohr usa de ejemplo: los investigadores tomaron el conteo estimado de cada
          estrato <em>como si fuera</em> la desviación, y trataron la asignación resultante como una guía, no como
          una orden. Donde Neyman pedía menos de cinco unidades en un estrato de treinta, ellos pusieron diez —un
          tercio del estrato, que era el piso que se habían fijado— y el total, planeado en 225, acabó en 211.</p>
      </div>

      <div class="note">
        <p><strong>Precisión fijada por estrato no es lo mismo que asignación igual.</strong> Si lo que se quiere es
          una precisión dada <em>dentro de cada</em> estrato — el Servicio Postal de Estados Unidos pide
          $\pm 3$ puntos porcentuales en cada área —, la cuenta no es ninguna de las tres de este módulo: es la
          regla del tamaño de muestra del capítulo 2 <strong>aplicada por separado a cada estrato</strong>. El
          resultado <em>suele parecerse</em> a la asignación igual, y en el caso postal coincide con ella, pero solo
          porque la meta y la cota de $p(1-p)$ son las mismas en todas las áreas. En cuanto las metas, las $S_{y,h}$
          o los $N_h$ difieren, deja de coincidir — y esa asignación no es ni proporcional ni óptima para el
          agregado nacional. Simplemente responde a otra pregunta.</p>
      </div>

        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex items-start gap-3">

          <div>
            <h3 class="font-bold text-gray-800 text-sm" style="margin:0;">Objetivo</h3>
            <p class="text-gray-600 text-sm" style="margin:0;">Pasar de «repartir $n$ entrevistas» a «repartir $C$
              pesos»: la asignación óptima cuando entrevistar no cuesta lo mismo en todas partes. Y, al cierre,
              de dónde sale ese $n$ que los módulos anteriores daban por puesto.</p>

      <p>Con presupuesto de 3 000 unidades y un costo por entrevista que va de 6 en el Nordeste a 18 en el Oeste,
        el reparto óptimo visita <strong>265</strong> condados y consigue una varianza de 358 millones. El reparto
        proporcional, con el mismo dinero, compra <strong>más</strong> entrevistas y aun así se queda con más varianza:
        <strong>peor resultado con más entrevistas</strong>. Es la lección del módulo: cuando las entrevistas no
        cuestan lo mismo, maximizar el número de entrevistas deja de ser el objetivo.</p>

      <p>Neyman responde a la pregunta equivocada. El presupuesto real de una encuesta no está en entrevistas: está
        en dinero, y una entrevista en un condado remoto del Oeste no cuesta lo que una en el Nordeste. Con costo
        $c_h$ por entrevista en el estrato $h$ y presupuesto total $C$, el problema pasa a ser</p>

      <div class="formula">
        <p class="formula-titulo">Asignación óptima con costos desiguales</p>
        $$\min \sum_h \frac{W_h^2 S^2_{y,h}}{n_h} \;\; \text{sujeto a} \;\; \sum_h c_h n_h = C
        \qquad\Longrightarrow\qquad
        n_h \;\propto\; \frac{N_h S_{y,h}}{\sqrt{c_h}}$$
        <p style="margin-bottom:0;">La misma cuenta de Lagrange del módulo 4 con la restricción nueva. El costo entra
          con <strong>raíz cuadrada</strong>: que el Oeste cueste el triple no divide su muestra entre tres, sino
          entre $\sqrt{3} \approx 1{,}7$. Neyman es el caso particular $c_h$ constante.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="La asignación óptima con costos sobre agpop">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R7⟧</code></pre>
        </div>
      </div>

      <p>Léelo con calma, porque el resultado es contraintuitivo: con 3 000 pesos de presupuesto, el óptimo compra
        <strong>menos entrevistas</strong> (265, menos de las que compraría la proporcional con ese mismo dinero) y
        aun así consigue <strong>menos varianza</strong> — error estándar 18 916 frente a 21 124 de la proporcional
        con $n = 300$, que cuesta casi ese mismo presupuesto. Compra entrevistas <em>mejor situadas</em>: mantiene las del Sur y las del Oeste que más
        varianza recortan y deja de pagar entrevistas baratas que aportaban poco.</p>

          costo del Oeste no divide su muestra entre dos.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Reparto óptimo de entrevistas según presupuesto y costos</p>
        <div class="grafico-wrapper" style="height:240px;">

      <div class="warning">
        <p><strong>El óptimo puede pedir imposibles.</strong> Nada en la fórmula impide que salga $n_h > N_h$ (más
          entrevistas que unidades tiene el estrato) o $n_h < 2$ (con una sola unidad no hay con qué estimar

      <p><strong>¿Y cuánto $n$ en total?</strong> Hay una pregunta que este módulo y el anterior llevan cuatro
        pantallas esquivando. Se ha repartido
        $n = 300$ de tres maneras distintas, se ha discutido cuál reparte mejor — y <strong>nadie ha dicho de dónde
        salió el 300</strong>. Es un dato caído del cielo. La pregunta que llega primero en una encuesta real es la
        contraria: <em>se fija la precisión que se quiere y se despeja el tamaño</em>.</p>

      <p>El capítulo 2 ya la respondió para el MAS, sobre esta misma población y esta misma variable: para estimar
        la superficie sembrada media con un error de como mucho el <strong>10 %</strong> de esa media hacían falta
        <strong>595</strong> condados. La cuenta estratificada es <em>la misma</em>, con una sola sustitución.</p>

      <div class="formula">
        <p class="formula-titulo">Tamaño total en el estratificado</p>
        <p>Si $a_h = n_h/n$ es la asignación <strong>relativa</strong> — lo que deciden la proporcional, Neyman o
          la de costos —, la variabilidad media por unidad del diseño es</p>
        $$v = \sum_{h=1}^{H} \frac{W_h^2 S_{y,h}^2}{a_h}
        \qquad\text{y entonces}\qquad
        n = \frac{z_{\alpha/2}^2\, v}{e^2 + z_{\alpha/2}^2 \sum_h W_h S^2_{y,h} / N}$$
        <p style="margin-bottom:0;">Es la fórmula del capítulo 2 con $S^2$ cambiado por $v$: el MAS es el caso
          $H = 1$, donde $v = S^2$. Y hay un detalle que decide el orden de trabajo: <strong>$v$ depende de cómo se
          reparte, no de cuánto</strong>. Por eso se puede elegir la asignación antes de saber el tamaño.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="El tamaño total que pide un margen de error dado">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R7B⟧</code></pre>
        </div>
      </div>

      <p>La primera fila es un viejo conocido con otro nombre: $v/S^2$ es <strong>el deff sin el fpc</strong>, y sus
        cifras — <strong>0,821</strong> la proporcional, <strong>0,749</strong> la igual, <strong>0,577</strong>
        Neyman — son casi las del módulo 4. La segunda fila es la que se lleva al presupuesto: los mismos 595
        condados del MAS bajan a <strong>506</strong> estratificando y repartiendo proporcionalmente, a
        <strong>462</strong> con reparto igual y a <strong>356</strong> con Neyman. <strong>Estratificar no solo
        reduce el error de una muestra dada: reduce la muestra que hace falta.</strong> Y la de costos pide
        <strong>368</strong>, que no se compara con las otras en entrevistas sino en dinero, que es de lo que iba
        el módulo.</p>

      <p>La última cuenta es la que más se olvida. Una encuesta no mide una variable: mide muchas, y el tamaño
        tiene que servir para todas. Con la misma asignación proporcional — que, a diferencia de Neyman, no depende
        de qué se mida — el 10 % sobre <code>farms92</code> se consigue con <strong>214</strong> condados, pero el
        de <code>acres92</code> exige <strong>506</strong>. Manda el mayor. Dicho al revés: el tamaño de una
        encuesta lo fija su variable más difícil, y las demás salen mejor estimadas de lo que se pidió.</p>

      <div class="note">
        <p><strong>Estratos de certeza: cuando la respuesta es «a esos no los sorteo».</strong> La advertencia de
          más arriba dejaba el truncamiento como un remiendo — si sale $n_h > N_h$, se recorta y se re-optimiza —.
          Hecho a propósito tiene nombre propio y es una decisión de diseño: un <strong>estrato de certeza</strong>
          (<em>take-all</em>) reúne las unidades demasiado grandes para dejarlas al azar y las <strong>censa</strong>.
          Se seleccionan con probabilidad 1, su peso es 1, se representan solo a sí mismas y —esto es lo que
          importa— <strong>no aportan nada a la varianza</strong>, porque su fpc $(1 - n_h/N_h)$ vale exactamente 0.
          En la Encuesta de Empleo, Nóminas y Horas de Canadá que cita Lohr, unas 800 empresas están en la muestra
          permanentemente por esa razón.</p>
      </div>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Un estrato de certeza con los condados más grandes">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R7C⟧</code></pre>
        </div>
      </div>

      <p>Los 31 condados más grandes son el <strong>1,01 %</strong> del marco y siembran el <strong>9,66 %</strong>
        de todo el país. Son los que inflan la desviación de <code>acres92</code>: sin ellos baja de
        <strong>424 686,68</strong> a <strong>309 673,43</strong>. Censarlos y repartir el resto proporcionalmente
        deja el tamaño necesario en <strong>316</strong> condados frente a los <strong>506</strong> de antes — y
        <strong>31</strong> de esos 316 no son muestra, son censo. Es el mismo 10 % de error con más de un tercio
        menos de trabajo de campo.</p>

      <div class="warning">
        <p><strong>El estrato de certeza se decide con lo que ya se sabe, no con lo que se va a medir.</strong> El
          bloque de arriba hace trampa a propósito para que se vea el mecanismo: ordena por <code>acres92</code>,
          que es justo la variable que la encuesta todavía no ha medido. En la práctica el corte se hace con una
          variable del marco — aquí <code>acres87</code>, la del censo anterior, que el módulo 6 mostró correlacionada
          <strong>0,9951</strong> con la de 1992 —. Es la misma trampa circular que el capítulo 2 señaló para $S^2$,
          y tiene la misma salida: datos previos.</p>
      </div>

      <div class="references">
        <h3><i class="fas fa-book-open mr-2" aria-hidden="true"></i>Para ampliar este módulo</h3>
        <ul style="margin-bottom:0;">
          <li>Lohr — §4.4 (2.ª ed.) / §3.4.2 (3.ª ed.): asignación con costos.</li>
          <li>Lohr — §3.4.5 (3.ª ed.), ecs. 3.16 a 3.18: el tamaño total a partir del margen de error, y por qué
            debe cubrir todas las variables clave.</li>
          <li>Lohr — Ej. 3.8 y término clave <em>certainty stratum</em> (3.ª ed.): los estratos que se censan.</li>
          <li>Cochran, <em>Sampling Techniques</em> — §5.5: el tratamiento clásico, con costo fijo $c_0$ incluido.</li>
        </ul>

      <p>Los módulos anteriores dieron por hechos los estratos. Pero la región no era la única opción: cualquier
        columna del marco puede partir la población. ¿Cuál conviene? La teoría da una regla limpia — estratificar
        rinde lo que la variable de estratificación <strong>explica</strong> de la variable de interés — y con
        <code>agpop</code> completa se puede medir cada opción sin estimar nada:</p>

          casi a la perfección —correlación 0,9951, al final del bloque— y mucho mejor que la geografía; estratificar por ella <strong>más que duplica</strong> la ganancia de la región: el deff
          pasa de 0,82 a 0,54, así que lo que se ahorra en varianza sube del 18 % al 46 %. Es la misma variable
          auxiliar que el capítulo 3 usaba para el estimador de razón, entrando ahora por el diseño.</li>
        <li><strong>Región: deff 0,82.</strong> Útil, y además trae garantías por subgrupo y logística. Que no sea

          Lohr va en esa dirección: cuanta más información tenga el marco, más estratos, y muchas encuestas
