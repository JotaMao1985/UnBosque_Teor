      <h3 id="prep2-condiciones">Las condiciones del Parcial 2, y qué entra</h3>

      <p>El Parcial 2 es el <strong>jueves 22 de octubre</strong>, presencial, de <strong>90 minutos</strong>, con
        <strong>calculadora</strong> y con un <strong>formulario que trae cada uno</strong>. No hay computador. Eso
        decide qué tipo de pregunta vale la pena ensayar: con las fórmulas delante, recordarlas no vale puntos. Lo
        que vale es <strong>elegir</strong> la que corresponde al diseño, montarla sobre las cifras correctas y saber
        qué dice el resultado. Por eso las preguntas de cálculo de abajo dan resúmenes y salidas impresas, nunca un
        archivo de datos, y las salidas de R hay que leerlas como en el parcial: en papel.</p>

      <p><strong>Entran:</strong> los <a href="capitulo-3-razon-y-regresion.html" class="text-primary underline"
          target="_blank" rel="noopener">doce módulos de contenido del capítulo 3</a> —razón, regresión, diferencia,
        un estimador por grupo, dominios, modelos poblacionales, GREG y la mediana— y los
        <strong>módulos 1 a 10 de este capítulo</strong>, incluidos el 7 (el modelo del estratificado) y el 9
        (el estratificado con probabilidades proporcionales). <strong>No entran:</strong> el módulo 11 (machine
        learning), el 12 (la razón en el estratificado) y el muestreo por cuotas, que el material no enseña.</p>

      <h3 id="prep2-problemas">Cuatro problemas tipo parcial</h3>

      <p>Así es probable que se vea una pregunta del parcial: un problema con varias partes, las cifras en el
        enunciado y una decisión al final. Hágalos con calculadora y con su formulario delante, y con reloj: unos

      <div class="ejercicios">
        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado"><span class="ejercicio-numero">1.</span>Un MAS de
            $n = ⟦e:problemas.P1.n⟧$ de las $N = ⟦m:problemas.P1.N:0⟧$ fincas da $\bar y = ⟦m:problemas.P1.ybar:2⟧$
            cargas, $\bar x = ⟦m:problemas.P1.xbar:3⟧$ ha, $s_y = ⟦m:problemas.P1.sy:2⟧$, $s_x = ⟦m:problemas.P1.sx:3⟧$
            y $r = ⟦m:problemas.P1.r:4⟧$. El registro da $t_x = ⟦m:problemas.P1.tx:1⟧$ ha, y la salida de
            <code>lm(y ~ area)</code> da un intercepto de ⟦c:problemas.P1.b0:3⟧ con $p = ⟦m:problemas.P1.p0:4⟧$.
            <strong>(a)</strong> Estime la producción total por expansión, por razón y por regresión.
            <strong>(b)</strong> Calcule el error estándar de cada una. <strong>(c)</strong> ¿Cuál reportaría, y
            por qué?</p>
          <details class="ejercicio-pista">
            <summary>Pista</summary>
            <p>Las tres usan la misma muestra y difieren en la recta que trazan. Para la regresión hace falta
              $\bar x_U = t_x/N$ y la pendiente $\hat b_1 = r\,s_y/s_x$; para su error estándar, el factor
              $(n-1)/(n-2)$ del formulario. La decisión no se toma por el error estándar más pequeño a secas: se
              toma con dos criterios: la regla del módulo 3 del capítulo 3, que decide contra la expansión, y el
              contraste del intercepto del módulo 6 del capítulo 3, que decide entre razón y regresión.</p>
          </details>
          <details class="ejercicio-solucion">
            <summary>Solución</summary>
            <p><strong>(a)</strong> Expansión: $N\bar y = ⟦m:problemas.P1.t_exp:1⟧$. Razón:
              $\hat B = \bar y/\bar x = ⟦m:problemas.P1.B:4⟧$ y $\hat t_r = \hat B\,t_x = ⟦m:problemas.P1.t_r:1⟧$.
              Regresión: $\bar x_U = ⟦m:problemas.P1.xbarU:4⟧$, $\hat b_1 = ⟦m:problemas.P1.b1:4⟧$,
              $\hat{\bar y}_{\text{reg}} = \bar y + \hat b_1(\bar x_U - \bar x) = ⟦m:problemas.P1.ybar_reg:4⟧$ y
              $\hat t_{\text{reg}} = N\hat{\bar y}_{\text{reg}} = ⟦m:problemas.P1.t_reg:1⟧$.</p>
            <p><strong>(b)</strong> Con $f = n/N = ⟦m:problemas.P1.f:4⟧$:</p>
            <ul>
              <li>Expansión: $N\sqrt{(1-f)/n}\;s_y = ⟦m:problemas.P1.ee_exp:1⟧$.</li>
              <li>Razón: la varianza del residuo es $s_y^2 + \hat B^2 s_x^2 - 2\hat B\,r\,s_x s_y =
                ⟦m:problemas.P1.se2_r:4⟧$, y $\mathrm{EE} = \frac{t_x}{\bar x}\sqrt{\frac{1-f}{n}\cdot
                ⟦m:problemas.P1.se2_r:4⟧} = ⟦m:problemas.P1.ee_r:1⟧$.</li>
              <li>Regresión: $N\sqrt{\frac{1-f}{n}\cdot\frac{n-1}{n-2}\,(1-r^2)\,s_y^2} =
                ⟦m:problemas.P1.ee_reg:1⟧$.</li>
            </ul>
            <p><strong>(c)</strong> La regresión, por dos criterios que conviene separar. Frente a la expansión,
              la auxiliar paga: $r = ⟦m:problemas.P1.r:4⟧$ supera con holgura el umbral del módulo 3 del capítulo 3. Frente a la
              razón, decide el intercepto: $p = ⟦m:problemas.P1.p0:4⟧$, así que la recta no pasa por el origen y la
              razón impone una que sí pasa. Por eso el error estándar de la razón queda entre los otros dos. Como la
              población es construida, se puede mirar la verdad: ⟦c:problemas.P1.ty:0⟧ cargas. Que la regresión
              quede también más cerca no es el motivo para elegirla —con otra muestra podría no pasar—: el motivo
              son los criterios, y el error estándar lo confirma.</p>
          </details>
        </div>

        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado"><span class="ejercicio-numero">2.</span>Un MAS de
            $n = ⟦e:problemas.P2.n⟧$ fincas trae ⟦e:problemas.P2.nd⟧ del Sur, y el registro sí dice cuántas hay en
            el Sur: $N_d = ⟦m:problemas.P2.Nd:0⟧$ de las $N = ⟦m:problemas.P2.N:0⟧$. Las fincas del Sur de la
            muestra producen en promedio $\bar y_d = ⟦m:problemas.P2.ybar_d:3⟧$ cargas, y con
            $u_k = \delta_k(y_k - \bar y_d)$ la muestra da $s_u = ⟦m:problemas.P2.su:4⟧$.
            <strong>(a)</strong> El error estándar de $\bar y_d$. <strong>(b)</strong> Un intervalo del 95 % para la
            producción media por finca del Sur. <strong>(c)</strong> La producción total del Sur con su error
            estándar, usando $N_d$.</p>
          <details class="ejercicio-pista">
            <summary>Pista</summary>
            <p>La media de dominio es una razón: su varianza es la de cualquier media, con el residuo linealizado y
              el factor $(n_d/n)^2$ en el denominador. Con $N_d$ conocido, el total escala esa media.</p>
          </details>
          <details class="ejercicio-solucion">
            <summary>Solución</summary>
            <p><strong>(a)</strong> $\widehat V(\bar y_d) = \frac{1-f}{n}\cdot\frac{s_u^2}{(n_d/n)^2}$, y
              $\mathrm{EE} = ⟦m:problemas.P2.ee_media:4⟧$ cargas por finca.</p>
            <p><strong>(b)</strong> $⟦m:problemas.P2.ybar_d:3⟧ \pm 1{,}96 \times ⟦m:problemas.P2.ee_media:4⟧$, es
              decir $[⟦m:problemas.P2.li:2⟧;\ ⟦m:problemas.P2.ls:2⟧]$. Con solo ⟦e:problemas.P2.nd⟧ fincas del Sur es
              ancho, y es lo que motiva estratificar cuando un dominio importa.</p>
            <p><strong>(c)</strong> $\hat t_{yd} = N_d\,\bar y_d = ⟦m:problemas.P2.t_conocido:1⟧$, con
              $\mathrm{EE} = N_d \cdot ⟦m:problemas.P2.ee_media:4⟧ = ⟦m:problemas.P2.ee_conocido:1⟧$. Si el registro no
              trajera la subregión, habría que estimar el total de $y_k\delta_k$ con toda la muestra, y saldría más
              caro: se pagaría también la incertidumbre sobre cuántas fincas del Sur hay.</p>
          </details>
        </div>

            ⟦c:problemas.P3.sh.2:2⟧ y ⟦c:problemas.P3.sh.3:2⟧. Estime la producción total con su intervalo del 95 %.
            <strong>(c)</strong> ¿Cuánto pesa una finca muy grande de la muestra, y por qué tan poco?</p>

            <summary>Solución</summary>
            <p><strong>(a)</strong> Neyman da ⟦c:problemas.P3.ney.0:2⟧, ⟦c:problemas.P3.ney.1:2⟧,
              ⟦c:problemas.P3.ney.2:2⟧ y ⟦c:problemas.P3.ney.3:2⟧, es decir ⟦e:problemas.P3.nh.0⟧, ⟦e:problemas.P3.nh.1⟧,

              ⟦c:problemas.P3.prop.0:2⟧, ⟦c:problemas.P3.prop.1:2⟧, ⟦c:problemas.P3.prop.2:2⟧ y
              ⟦c:problemas.P3.prop.3:2⟧: Neyman dobla las grandes y multiplica por más de cuatro las muy grandes, donde está la
              dispersión, y recorta las medianas, que son muchas pero parecidas entre sí.</p>
            <p><strong>(b)</strong> $\hat t = \sum N_h\bar y_h = ⟦m:problemas.P3.t:2⟧$ y
              $\mathrm{EE} = \sqrt{\sum N_h^2(1 - n_h/N_h)\,s_h^2/n_h} = ⟦m:problemas.P3.ee:2⟧$. El intervalo es
              $[⟦m:problemas.P3.li:1⟧;\ ⟦m:problemas.P3.ls:1⟧]$. La verdad, ⟦c:problemas.P3.ty:0⟧ cargas, cae
              dentro.</p>
            <p><strong>(c)</strong> $N_h/n_h = ⟦m:problemas.P3.pesos.3:3⟧$: cada muy grande de la muestra representa
              a algo más de cuatro fincas, mientras que una mediana representa a ⟦c:problemas.P3.pesos.1:2⟧. No es un error:
              Neyman manda muestra a donde está la varianza, así que cada unidad de ese estrato representa a pocas.
              Promediar la muestra sin pesos daría demasiado peso a las grandes.</p>
          </details>
        </div>

        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado"><span class="ejercicio-numero">4.</span>Un MAS de
            $n = ⟦e:problemas.P4.n⟧$ fincas se postestratifica por tenencia con los $N_h$ del censo agropecuario:
            ⟦c:problemas.P4.Nh.0:0⟧ propietarios, ⟦c:problemas.P4.Nh.1:0⟧ arrendatarios y ⟦c:problemas.P4.Nh.2:0⟧
            aparceros. La muestra trae ⟦e:problemas.P4.nh.0⟧, ⟦e:problemas.P4.nh.1⟧ y ⟦e:problemas.P4.nh.2⟧, con
            medias ⟦c:problemas.P4.yh.0:2⟧, ⟦c:problemas.P4.yh.1:2⟧ y ⟦c:problemas.P4.yh.2:2⟧ cargas y desviaciones
            ⟦c:problemas.P4.sh.0:2⟧, ⟦c:problemas.P4.sh.1:2⟧ y ⟦c:problemas.P4.sh.2:2⟧; en toda la muestra,
            $\bar y = ⟦m:problemas.P4.ybar:2⟧$ y $s_y = ⟦m:problemas.P4.sy:2⟧$. <strong>(a)</strong> Calcule la media
            postestratificada. <strong>(b)</strong> Su error estándar con la aproximación de Lohr, el del MAS y el
            deff. <strong>(c)</strong> <code>survey</code> da otro error estándar. ¿Está mal alguno de los dos, y
            cuánto hay que fiarse de cualquiera de ellos con estas celdas?</p>
          <details class="ejercicio-pista">
            <summary>Pista</summary>
            <p>La media postestratificada es la del estratificado con los $n_h$ que salieron. La aproximación de
              Lohr del módulo 10 es la varianza de la asignación proporcional, $(1 - n/N)\sum_h W_h s_h^2/n$, y el
              mismo módulo dice con cuántos casos esperados por celda se puede dar por buena.</p>
          </details>
          <details class="ejercicio-solucion">
            <summary>Solución</summary>
            <p><strong>(a)</strong> Con $W_h = N_h/N$ —⟦c:problemas.P4.W.0:4⟧, ⟦c:problemas.P4.W.1:4⟧ y
              ⟦c:problemas.P4.W.2:4⟧—, $\bar y_{\text{post}} = \sum W_h\bar y_h = ⟦m:problemas.P4.ybar_post:2⟧$
              cargas, frente a la media muestral de ⟦c:problemas.P4.ybar:2⟧.</p>
            <p><strong>(b)</strong> Lohr: $\sqrt{(1-f)\sum W_h s_h^2/n} = ⟦m:problemas.P4.ee_post:4⟧$. MAS:
              $\sqrt{(1-f)/n}\;s_y = ⟦m:problemas.P4.ee_mas:4⟧$. El deff estimado es
              $(⟦m:problemas.P4.ee_post:4⟧/⟦m:problemas.P4.ee_mas:4⟧)^2 = ⟦m:problemas.P4.deff:4⟧$: un ahorro estimado del
              ⟦p:problemas.P4.ahorro:0⟧ de la varianza sin una sola finca nueva. La tenencia separa menos que el tamaño,
              y se nota.</p>
            <p><strong>(c)</strong> Ninguno está mal. <code>survey</code> da ⟦c:problemas.P4.ee_survey:4⟧ porque trata
              la postestratificación como una calibración y estima la varianza de diseño con los $n_h$ que salieron
              como datos; la de Lohr es una aproximación, la de la asignación proporcional. Son los «tres errores
              estándar para el mismo estimador» del módulo 10, y con el de <code>survey</code> el ahorro estimado
              sería del ⟦p:problemas.P4.ahorro_survey:0⟧. Sobre cuánto fiarse: en un MAS de ⟦e:problemas.P4.n⟧ se
              esperan ⟦c:problemas.P4.esperadas.0:1⟧, ⟦c:problemas.P4.esperadas.1:1⟧ y ⟦c:problemas.P4.esperadas.2:1⟧
              fincas por celda, y el módulo 10 pide del orden de 30 para dar por buena la aproximación: la de los
              aparceros se queda corta, así que las dos cifras son orientativas. Aquí, además, la población es
              construida y se puede ver la verdad: con las $S_h$ del censo, el deff de la postestratificación por
              tenencia es ⟦c:problemas.P4.deff_verdadero:3⟧, un ahorro de solo ⟦p:problemas.P4.ahorro_verdadero:1⟧.
              Las dos estimaciones salieron optimistas en esta muestra: un deff estimado con una celda tan chica
              cambia mucho de una muestra a otra.</p>
          </details>
        </div>
      </div>

      <h3 id="prep2-formulario">Qué llevar en el formulario</h3>

      <p>El formulario lo trae cada uno, así que vale la pena armarlo pensando en las preguntas de arriba. El del
        capítulo 3 ya existe: es el <a href="capitulo-3-razon-y-regresion.html" class="text-primary underline"
          target="_blank" rel="noopener">módulo 13 del capítulo 3</a>, y le faltan, como él mismo avisa, el
        GREG y la calibración, los dominios, la mediana, la cota del sesgo y el umbral de la razón. Del capítulo 4
        no hay uno hecho; esto es lo mínimo:</p>
      <ul>
        <li>El total y la media estratificados, $\sum N_h\bar y_h$ y $\sum W_h\bar y_h$, con su varianza:
          $\sum N_h^2(1 - n_h/N_h)s_h^2/n_h$. Y el peso $N_h/n_h$, con la comprobación de que los pesos suman $N$.</li>
        <li>Las tres asignaciones: proporcional ($n_h \propto N_h$), Neyman ($n_h \propto N_hS_h$) y la óptima con
          costos ($n_h \propto N_hS_h/\sqrt{c_h}$, con $\sum c_hn_h = C$).</li>
        <li>El tamaño total a partir del margen de error, con $v = \sum W_h^2S_h^2/a_h$.</li>
        <li>El deff, $V_{\text{diseño}}/V_{\text{MAS}}$, y el tamaño efectivo $n/\text{deff}$; y, para la
          proporcional con estratos grandes, $\text{deff} \approx 1 - \text{SSB}/\text{SST}$.</li>
        <li>Hansen–Hurwitz dentro de un estrato: $\frac{1}{m_h}\sum y_{k_i}/\psi_{k_i}$, con
          $\psi_k = x_k/\sum_{U_h}x_l$.</li>
        <li>La media postestratificada, $\sum W_h\bar y_h$ con los $n_h$ que salieron, y la aproximación de Lohr
          a su varianza.</li>
      </ul>
      <p>Y una regla que no es una fórmula pero vale puntos: antes de entregar un número, comprobar que tiene sentido
        —que los pesos suman $N$, que un error estándar no es mayor que la estimación sin motivo, que una
        asignación no pide más fincas de las que tiene un estrato—.</p>
