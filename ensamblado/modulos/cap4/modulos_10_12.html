      <p>El estratificado exige conocer el estrato de cada unidad <em>antes</em> de sortear. Pero hay un plan B con
        casi la misma recompensa: si los tamaños $N_h$ se conocen, aunque el sorteo los haya ignorado, se pueden
        imponer <strong>después</strong>. El MAS <code>agsrs</code> del capítulo 2 sorteó sin mirar regiones, y la
        composición regional le salió como le salió:</p>

        <div class="code-tabs-nav" role="tablist" aria-label="Los pesos antes y después de postestratificar">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R13⟧</code></pre>
        </div>
      </div>

      <p>La tabla trae la columna que explica todo lo demás: $\hat{N}_h$, el tamaño que la muestra <em>estima</em>
        para cada región con los pesos de partida — los 107 condados del Norte-Centro por 10,26 hacen
        <strong>1 097,82</strong>, cuando el marco dice que son 1 054 —. El sorteo repartió la muestra con una
        composición que no es la de la población, y el peso nuevo corrige exactamente ese desajuste,
        multiplicando el viejo por $N_h/\hat{N}_h$.</p>

      <p>El final del bloque añade el contraste que le da nombre a la operación. En el capítulo 3 la razón también
        calibraba, pero contra un solo total: su factor $g = t_x/\hat{t}_x$ era el mismo para todas las unidades
        —aquí <strong>1,0366</strong>, que deja el peso en <strong>10,6359</strong>, el que aquel capítulo ya
        mostraba en su módulo 10— y los pesos calibrados sumaban <strong>3 190,7684</strong>, no $N$. En la
        postestratificación hay un factor por postestrato y lo que se cuadra son los $N_h$: su suma, $N = 3\,078$,
        cuadra de propina.</p>

      <div class="definition">
        <h4>Postestratificación</h4>
        <p>Con un MAS de $n$ unidades del que se observan $n_h$ en cada estrato (aleatorios, no fijados), el
          estimador postestratificado aplica la fórmula del estratificado con los $n_h$ que salieron:</p>
        $$\bar{y}_{\text{post}} = \sum_{h=1}^{H} W_h \, \bar{y}_h
        \qquad\text{— es decir, el peso de la unidad } k \in U_h \text{ pasa de } \frac{N}{n} \text{ a } \frac{N_h}{n_h}.$$
        <p style="margin-bottom:0;">La operación es una <strong>calibración</strong>: retocar los pesos lo mínimo
          para que la muestra reproduzca exactamente los totales que el marco conoce ($\sum_{s_h} w_k = N_h$ para
          todo $h$). El capítulo 7 generaliza esta idea a varios márgenes a la vez (raking) y a totales continuos
          (GREG, que ya asomó en el capítulo 3).</p>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-post-razon">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver la postestratificación como un estimador de razón</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-post-razon" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Tómese como variable auxiliar, dentro del postestrato $h$, el <strong>indicador</strong>
                $x_k = 1$ si $k \in U_h$ y $x_k = 0$ si no. Su total poblacional se conoce, y es justamente el
                tamaño del postestrato: $t_x = N_h$.</p>
            </li>
            <li>
              <p>Con los pesos de partida, la muestra estima ese total y el de $y$ restringido al postestrato:</p>
              $$\hat{N}_h = \sum_{k \in s} w_k x_k, \qquad \hat{t}_{yh} = \sum_{k \in s} w_k x_k y_k$$
            </li>
            <li>
              <p>El estimador de razón del capítulo 3 —lo estimado partido por lo estimado, por el total
                conocido— da entonces</p>
              $$\hat{t}_{yh,r} = \frac{\hat{t}_{yh}}{\hat{N}_h}\,N_h = N_h \, \bar{y}_h,$$
              <p>porque el cociente de las dos estimaciones es la media muestral del postestrato.</p>
            </li>
            <li>
              <p>Sumando sobre los $H$ postestratos aparece la fórmula de la definición: <strong>la
                postestratificación es estimación por razón dentro de cada postestrato</strong>. Y en pesos, para
                <em>cualquier</em> diseño de partida —no solo un MAS—: $w_k^* = (N_h/\hat{N}_h)\,w_k$ para
                $k \in U_h$. Con un MAS, $w_k = N/n$ y sale el $N_h/n_h$ de arriba.</p>
            </li>
          </ol>
        </div>
      </div>

      <div class="note">

          <li><strong>Dominio</strong> (capítulo 3, módulo 8, con <code>agsrs</code>): la región interesa al
            estimar, pero el sorteo no la miró, así que $n_d$ es aleatorio y la media de dominio se estima como una
            razón.</li>
          <li><strong>Postestrato</strong> (este módulo, con la misma <code>agsrs</code>): un dominio cuyo tamaño
            poblacional $N_h$ <strong>sí</strong> se conoce. Eso es lo único que lo distingue del dominio, y es lo
            que permite usar $N_h$ en lugar de $\hat{N}_h$ y ganar precisión.</li>
        </ul>

      <p>Evaluar un modelo predictivo <em>es</em> estimar un parámetro poblacional con una muestra: la exactitud
        «verdadera» del modelo sobre los datos que verá en producción, estimada con un conjunto de prueba. Todo lo
        que este curso dice de las encuestas aplica: si el conjunto de prueba no representa la población, la
        métrica sale sesgada — con el agravante de que nadie publica el error estándar de su <em>accuracy</em>. La
        conexión no es una metáfora de este material: la cuarta razón para estratificar con la que Lohr abre el
        capítulo es que el muestreo estratificado, «si se hace correctamente, dará estimaciones más precisas»
        (§4.1 de la 1.ª ed. / §3.1 de la 3.ª), y la comunidad de ML redescubrió la regla con el nombre de
        <em>stratified split</em>.</p>

      <p>El caso donde más duele es el desbalance de clases. En <code>agpop</code>, los condados «grandes» (más de
        un millón de acres) son el <strong>5 %</strong> — la clase que interesa detectar y la que menos unidades
        tiene, como el fraude en las transacciones o la enfermedad rara en los tamizajes:</p>

        La misma protección existe para la partición única de entrenamiento y prueba:</p>

        </div>
      </div>

      <p>El capítulo 3 prometió que su estimador de razón reaparecería aquí «dentro de cada estrato o sobre el
        conjunto». Este módulo cumple esa promesa, y de paso cierra el capítulo con la idea que más precisión ha
        comprado en todo el material: <strong>usar una variable auxiliar conocida</strong>.</p>

      <p>El punto de partida es que hay <em>dos</em> maneras de combinar razón y estratos, y no dan lo mismo. La
        diferencia está en el orden de las operaciones:</p>

      <div class="definition">
        <h4>Combinada y separada</h4>
        <ul style="margin-bottom:0;">
          <li><strong>Combinada</strong> ($\hat{t}_{yrc}$): primero se <em>suman</em> los estratos, luego se hace
            <em>una</em> razón. $\hat{t}_{yrc} = \hat{B}\,t_x$ con
            $\hat{B} = \hat{t}_{y,\text{str}} / \hat{t}_{x,\text{str}}$. Solo necesita el total poblacional $t_x$.</li>
          <li><strong>Separada</strong> ($\hat{t}_{yrs}$): primero la razón <em>dentro</em> de cada estrato, luego
            se suman. $\hat{t}_{yrs} = \sum_h t_{xh}\,\dfrac{\hat{t}_{yh}}{\hat{t}_{xh}} = \sum_h t_{xh}
            \dfrac{\bar{y}_h}{\bar{x}_h}$. Necesita los $t_{xh}$ de <strong>cada</strong> estrato, que es bastante
            más información y no siempre se tiene.</li>
        </ul>
      </div>

      <p>Si las razones de los estratos fueran todas iguales, los dos estimadores serían el mismo. Toda la
        diferencia entre ellos vive en cuánto se separan esas razones:</p>

      <div class="code-tabs">
        <div class="code-tabs-nav" role="tablist" aria-label="Razón combinada y separada sobre agstrat">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
          <button class="code-tab-btn" data-lang="python" role="tab" aria-selected="false">Python</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R15B⟧</code></pre>
        </div>
        <div class="code-tab-panel" data-lang="python" hidden>
          <pre><code class="language-python">⟦P5⟧</code></pre>
        </div>
      </div>

      <p>Lo primero que salta no es la diferencia entre las dos razones, sino <strong>lo que vale la variable
        auxiliar</strong>. El estratificado del módulo 3, sin auxiliar, estimaba el total nacional con un error
        estándar de <strong>50,417</strong> millones de acres. Con <code>acres87</code> el error baja a
        <strong>5,962</strong> millones la combinada y <strong>5,724</strong> la separada: <strong>casi nueve veces
        menos</strong>. Y se nota en el acierto — como <code>agpop</code> está entera, se puede comprobar: el
        estratificado solo se queda a <strong>−3,625 %</strong> de la verdad, y las dos razones a
        <strong>1,046 %</strong> y <strong>1,100 %</strong>.</p>

      <p>Entre las dos, aquí gana la separada, y se entiende por qué: las razones por región son
        <strong>0,9751</strong>, <strong>0,8956</strong>, <strong>0,9935</strong> y <strong>1,0120</strong> — el
        Nordeste siembra bastante menos de lo que sembraba, el Oeste algo más —. La combinada las aplasta todas en
        una sola, <strong>0,9900</strong>, y pierde esa información. Pero fíjate en <em>cuánto</em> gana: de 5,962
        a 5,724, un 4 %. La ventaja de la separada es real y es pequeña.</p>

      <div class="note">
        <p><strong>La postestratificación era esto.</strong> El módulo 10 estimaba $\sum_h N_h \bar{y}_h$ usando
          los $N_h$ conocidos, y su derivación lo presentaba como una razón dentro de cada postestrato con el
          indicador de pertenencia como auxiliar. Eso es exactamente la razón <strong>separada</strong> con
          $x_k = 1$: entonces $t_{xh} = N_h$ y $\bar{y}_h/\bar{x}_h = \bar{y}_h$. La postestratificación es un caso
          particular de este módulo, y el módulo 10 ya lo había hecho sin llamarlo por su nombre.</p>
      </div>

      <div class="warning">
        <p><strong>Y sin embargo, casi todo el software calcula la combinada por defecto.</strong> Si la separada
          gana, ¿por qué? Porque su ventaja es pequeña y su riesgo no lo es. Cada una de las $H$ razones de la
          separada es un cociente de dos estimaciones, y <strong>un cociente es sesgado</strong>: es el sesgo que el
          capítulo 3 midió para un solo estimador de razón. La separada lo comete $H$ veces y los suma. Con
          estratos grandes el sesgo es despreciable; con estratos chicos, no.</p>
      </div>

      <p>Eso se puede medir en vez de creerlo. El precálculo sorteó estratificados de <code>agpop</code> con
        distintos $n_h$ por estrato y comparó los dos estimadores contra la verdad:</p>

      <div class="simulador" data-simulador="razon-estratificada">
        <h4><i class="fas fa-code-branch" aria-hidden="true"></i> ¿Combinada o separada?</h4>
        <p class="simulador-intro">Mueve el tamaño por estrato $n_h$ y mira las dos curvas: la raíz del error
          cuadrático medio relativo de cada estimador, y debajo su sesgo. Con estratos chicos la separada se
          desploma; a partir de cierto punto adelanta a la combinada y ya no la suelta — pero nunca por mucho. La
          línea vertical marca el cruce.</p>
        <div class="simulador-controles"></div>
        <p class="grafico-etiqueta">Error cuadrático medio relativo de cada estimador, según $n_h$</p>
        <div class="grafico-wrapper" style="height:260px;">
          <canvas aria-label="Error cuadrático medio de la razón combinada y la separada según el tamaño por estrato" role="img"></canvas>
        </div>
        <div class="simulador-lectura"></div>
      </div>

      <p>La asimetría es la lección del módulo. Con <strong>3</strong> por estrato la separada tiene un error
        cuadrático medio de <strong>7,195 %</strong> contra <strong>3,734 %</strong> de la combinada: casi el doble
        de malo. El cruce llega en <strong>5</strong>, y de ahí en adelante la separada gana siempre — pero con
        <strong>20</strong> por estrato la ventaja es de <strong>1,528 %</strong> contra <strong>1,554 %</strong>,
        menos de dos centésimas. <strong>Arriba se gana poco y abajo se pierde mucho</strong>, y por eso el valor
        por defecto de los paquetes es el que es.</p>

      <p>El cruce merece una nota sobre cómo se midió, porque es la clase de cifra que se equivoca sola. Comparar
        los dos errores cuadráticos sin más lo situaba en 4; pero los dos estimadores se calculan
        <em>sobre la misma muestra</em>, así que su <strong>diferencia</strong> se estima mucho mejor que cada uno
        por separado, y exigiéndole a esa diferencia que supere dos errores Monte Carlo el cruce se va a 5: en 4 la
        ventaja aparente no se distinguía del ruido de la simulación. Por la misma razón, la paliza de la separada
        en $n_h = 3$ no llega a certificarse ni con <strong>20000</strong> réplicas — sus colas son tan pesadas,
        precisamente por los cocientes que ocasionalmente estallan, que el promedio se mueve más que la diferencia
        que se quiere medir.</p>

      <div class="note">
        <p><strong>Con dos por estrato ni siquiera está definida.</strong> Por debajo del cruce hay un escalón que
          las fórmulas no anuncian: la separada divide por $\bar{x}_h$, la media del estrato, y esa media puede
          salir cero o negativa. En <code>agpop</code> pasa, porque <code>acres87</code> arrastra 23 condados con
          el código de faltante $-99$ y dos con 0 — los mismos que el módulo 6 señalaba como estrato «basura»
          silencioso —. Con $n_h = 2$, el <strong>0,23 %</strong> de las muestras deja alguna región con
          $\bar{x}_h \leq 0$ y el estimador separado <strong>no existe</strong>. La combinada, que divide por el
          total estimado de toda la muestra, no tiene ese problema.</p>
      </div>

      <div class="note">
        <p><strong>Cómo elegir, en una línea.</strong> Usa la <strong>separada</strong> si tienes los $t_{xh}$ de
          cada estrato <em>y</em> los $n_h$ son holgados <em>y</em> tienes razón para creer que las razones
          cambian entre estratos. Si falla cualquiera de las tres, usa la <strong>combinada</strong>. Y si no
          tienes ni $t_x$, te queda el estratificado del módulo 3, que aquí costaba nueve veces más error.</p>
      </div>
