      <p>El estratificado exige conocer el estrato de cada unidad <em>antes</em> de sortear. Pero hay un plan B con
        casi la misma recompensa: si los tamaños $N_h$ se conocen, aunque el sorteo los haya ignorado, se pueden
        imponer <strong>después</strong>. El MAS <code>agsrs</code> del capítulo 2 sorteó sin mirar regiones, y la
        composición regional le salió como le salió:</p>

        <div class="code-tabs-nav" role="tablist" aria-label="Los pesos antes y después de postestratificar">
          <button class="code-tab-btn active" data-lang="r" role="tab" aria-selected="true">R</button>
        </div>
        <div class="code-tab-panel" data-lang="r">
          <pre><code class="language-r">⟦R13⟧</code></pre>
        </div>
      </div>

      <p>La tabla trae la columna que explica todo lo demás: $\hat{N}_h$, el tamaño que la muestra <em>estima</em>
        para cada región con los pesos de partida — los 107 condados del Norte-Centro por 10,26 hacen
        <strong>1 097,82</strong>, cuando el marco dice que son 1 054 —. El sorteo repartió la muestra con una
        composición que no es la de la población, y el peso nuevo corrige exactamente ese desajuste,
        multiplicando el viejo por $N_h/\hat{N}_h$.</p>

      <p>El final del bloque añade el contraste que le da nombre a la operación. En el capítulo 3 la razón también
        calibraba, pero contra un solo total: su factor $g = t_x/\hat{t}_x$ era el mismo para todas las unidades
        —aquí <strong>1,0366</strong>, que deja el peso en <strong>10,6359</strong>, el que aquel capítulo ya
        mostraba en su módulo 10— y los pesos calibrados sumaban <strong>3 190,7684</strong>, no $N$. En la
        postestratificación hay un factor por postestrato y lo que se cuadra son los $N_h$: su suma, $N = 3\,078$,
        cuadra de propina.</p>

      <div class="definition">
        <h4>Postestratificación</h4>
        <p>Con un MAS de $n$ unidades del que se observan $n_h$ en cada estrato (aleatorios, no fijados), el
          estimador postestratificado aplica la fórmula del estratificado con los $n_h$ que salieron:</p>
        $$\bar{y}_{\text{post}} = \sum_{h=1}^{H} W_h \, \bar{y}_h
        \qquad\text{— es decir, el peso de la unidad } k \in U_h \text{ pasa de } \frac{N}{n} \text{ a } \frac{N_h}{n_h}.$$
        <p style="margin-bottom:0;">La operación es una <strong>calibración</strong>: retocar los pesos lo mínimo
          para que la muestra reproduzca exactamente los totales que el marco conoce ($\sum_{s_h} w_k = N_h$ para
          todo $h$). El capítulo 7 generaliza esta idea a varios márgenes a la vez (raking) y a totales continuos
          (GREG, que ya asomó en el capítulo 3).</p>
      </div>

      <div class="derivacion">
        <button type="button" class="derivacion-boton" aria-expanded="false" aria-controls="der-post-razon">
          <i class="fas fa-square-root-variable" aria-hidden="true"></i>
          <span class="derivacion-texto">Ver la postestratificación como un estimador de razón</span>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="derivacion-panel" id="der-post-razon" hidden>
          <ol class="derivacion-pasos">
            <li>
              <p>Tómese como variable auxiliar, dentro del postestrato $h$, el <strong>indicador</strong>
                $x_k = 1$ si $k \in U_h$ y $x_k = 0$ si no. Su total poblacional se conoce, y es justamente el
                tamaño del postestrato: $t_x = N_h$.</p>
            </li>
            <li>
              <p>Con los pesos de partida, la muestra estima ese total y el de $y$ restringido al postestrato:</p>
              $$\hat{N}_h = \sum_{k \in s} w_k x_k, \qquad \hat{t}_{yh} = \sum_{k \in s} w_k x_k y_k$$
            </li>
            <li>
              <p>El estimador de razón del capítulo 3 —lo estimado partido por lo estimado, por el total
                conocido— da entonces</p>
              $$\hat{t}_{yh,r} = \frac{\hat{t}_{yh}}{\hat{N}_h}\,N_h = N_h \, \bar{y}_h,$$
              <p>porque el cociente de las dos estimaciones es la media muestral del postestrato.</p>
            </li>
            <li>
              <p>Sumando sobre los $H$ postestratos aparece la fórmula de la definición: <strong>la
                postestratificación es estimación por razón dentro de cada postestrato</strong>. Y en pesos, para
                <em>cualquier</em> diseño de partida —no solo un MAS—: $w_k^* = (N_h/\hat{N}_h)\,w_k$ para
                $k \in U_h$. Con un MAS, $w_k = N/n$ y sale el $N_h/n_h$ de arriba.</p>
            </li>
          </ol>
        </div>
      </div>

        </div>

        </div>
      </div>

      <div class="note">

          dar por buena su aproximación de la varianza; por debajo de ahí, fusionar celdas.</p>

          <li><strong>Dominio</strong> (capítulo 3, módulo 8, con <code>agsrs</code>): la región interesa al
            estimar, pero el sorteo no la miró, así que $n_d$ es aleatorio y la media de dominio se estima como una
            razón.</li>
          <li><strong>Postestrato</strong> (este módulo, con la misma <code>agsrs</code>): un dominio cuyo tamaño
            poblacional $N_h$ <strong>sí</strong> se conoce. Eso es lo único que lo distingue del dominio, y es lo
            que permite usar $N_h$ en lugar de $\hat{N}_h$ y ganar precisión.</li>

      <p>Evaluar un modelo predictivo <em>es</em> estimar un parámetro poblacional con una muestra: la exactitud
        «verdadera» del modelo sobre los datos que verá en producción, estimada con un conjunto de prueba. Todo lo
        que este curso dice de las encuestas aplica: si el conjunto de prueba no representa la población, la
        métrica sale sesgada — con el agravante de que nadie publica el error estándar de su <em>accuracy</em>. La
        conexión no es una metáfora de este material: la cuarta razón para estratificar con la que Lohr abre el
        capítulo es que el muestreo estratificado, «si se hace correctamente, dará estimaciones más precisas»
        (§4.1 de la 2.ª ed. / §3.1 de la 3.ª), y la comunidad de ML redescubrió la regla con el nombre de
        <em>stratified split</em>.</p>

      <p>El caso donde más duele es el desbalance de clases. En <code>agpop</code>, los condados «grandes» (más de
        un millón de acres) son el <strong>5 %</strong> — la clase que interesa detectar y la que menos unidades
        tiene, como el fraude en las transacciones o la enfermedad rara en los tamizajes:</p>

        clasificador de minorías puede cambiar por completo entre esos dos extremos. <code>StratifiedKFold</code>
        es, literalmente, asignación proporcional con la clase como estrato: clava el 5 % en los cinco pliegues.
        La misma protección existe para la partición única de entrenamiento y prueba:</p>

        <p><strong>La trampa de la pestaña R, que es una trampa de verdad.</strong> <code>rsample::vfold_cv</code>
          acepta <code>strata=</code>, pero su parámetro <code>pool</code> (por defecto 0,1) <strong>fusiona en
          silencio los estratos con menos del 10 % de los datos</strong> — exactamente las clases minoritarias que

          nada</em>, y el resultado lo demuestra: sus pliegues bailan igual que los no estratificados. Hay que bajar
          <code>pool</code> explícitamente (el paquete avisa con un mensaje que conviene leer completo antes de
          descartarlo). La moraleja es de auditoría, no de sintaxis: <strong>comprueba siempre las proporciones por
          pliegue después de partir</strong> — es una línea de código y detecta el fallo venga de donde venga.</p>

        de abrir la pista</strong>, y abre la solución solo cuando tengas una respuesta que contrastar.</p>

      <div class="exercise">
        <h4><i class="fas fa-pen-to-square mr-2" aria-hidden="true"></i>Ejercicios guiados</h4>
        <p class="text-sm" style="margin-bottom:0.5rem;">Los cuatro son problemas de diseño sobre los datos reales
          del capítulo. Las cifras de cada solución salen de <code>ensamblado/codigo/cap4/cadena.R</code>, que se
          ejecuta de verdad: ninguna está escrita a mano.</p>

        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado"><span class="ejercicio-numero">1.</span>Con <code>agstrat</code>, estima el
            <strong>total nacional de acres sembrados en 1992</strong> con su intervalo del 95 %. Después ve a
            <code>agpop</code> —que es un censo— y comprueba si el intervalo contuvo la verdad.</p>
          <details class="ejercicio-pista">
            <summary>Pista</summary>
            <p>El diseño ya está declarado en el módulo 3: <code>svytotal</code> y <code>confint</code> hacen el
              resto. La verdad es <code>sum(agpop$acres92)</code>, con los −99 incluidos — recuerda la decisión del
              capítulo 2 sobre el marco completo.</p>
          </details>
          <details class="ejercicio-solucion">
            <summary>Solución</summary>
            <pre><code class="language-r">⟦R16⟧</code></pre>
            <p>El total estimado es 909 736 036 con intervalo [810 920 045, 1 008 552 026]; la verdad, 943 951 718,
              cae dentro con holgura. Nota el ancho del intervalo — ±11 % — pese al deff favorable: los totales de
              variables asimétricas son caros de estimar, y esa es la motivación del PPT del módulo 9.</p>
          </details>
        </div>

        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado"><span class="ejercicio-numero">2.</span>El presupuesto sube a
            <strong>$n = 400$</strong>. Reparte con Neyman y con proporcional, y cuantifica en porcentaje del error
            estándar lo que la asignación óptima le saca a la cómoda.</p>
          <details class="ejercicio-pista">
            <summary>Pista</summary>
            <p>Las $S_{y,h}$ poblacionales ya están calculadas en el módulo 4. Neyman: $n_h = 400 \cdot N_h S_h /
              \sum N_g S_g$; redondea al entero. La función de varianza del módulo 4 acepta cualquier reparto.</p>
          </details>
          <details class="ejercicio-solucion">
            <summary>Solución</summary>
            <pre><code class="language-r">⟦R17⟧</code></pre>
            <p>Neyman: 115/7/136/142 frente a 137/29/180/55 de la proporcional; error estándar 14 566 contra 17 925 —
              un <strong>18,7 %</strong> menos. Con un matiz que conviene ver: al redondear, la proporcional suma
              <strong>401</strong> entrevistas y Neyman 400, así que la comparación le regala una entrevista a la
              proporcional; con 400 exactas la ventaja de Neyman sería algo mayor. Compara con el 18,1 % que ganaba en
              $n = 300$: la ventaja relativa de Neyman es estable con el tamaño, porque depende de la estructura de
              la población, no de $n$.</p>
          </details>
        </div>

        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado"><span class="ejercicio-numero">3.</span>Diseña sobre <strong>BigLucy</strong>
            un estratificado <em>clásico</em> (MAS dentro de cada nivel) con $n = 380$ repartido proporcionalmente, y
            estima el <strong>total de impuestos</strong> con su intervalo. ¿Atrapó la verdad?</p>
          <details class="ejercicio-pista">
            <summary>Pista</summary>
            <p>Los $N_h$ salen de <code>table(BigLucy$Level)</code>; el reparto proporcional da 13/115/252. Sortea
              con <code>sample()</code> dentro de cada nivel, arma los pesos $N_h/n_h$ y declara el diseño con
              <code>svydesign(strata =, weights =, fpc =)</code>.</p>
          </details>
          <details class="ejercicio-solucion">
            <summary>Solución</summary>
            <pre><code class="language-r">⟦R18⟧</code></pre>
            <p>Total estimado 1 015 706 con intervalo [920 481, 1 110 931]; la verdad es 1 008 426 — dentro, a un
              0,7 % del centro. Con el 0,4 % de la población, el diseño estratificado deja el total de una variable
              tan sesgada como los impuestos a tiro de piedra.</p>
          </details>
        </div>

        <div class="ejercicio-guiado">
          <p class="ejercicio-enunciado"><span class="ejercicio-numero">4.</span>Sobre BigLucy y con el mismo
            $n = 380$, el módulo 9 estimó ingresos con <strong>PPT por empleados</strong> y el ejercicio 3 estimó
            impuestos con <strong>MAS por estrato</strong>. Compara la calidad de las dos estrategias con el
            coeficiente de variación estimado y explica la diferencia.</p>
          <details class="ejercicio-pista">
            <summary>Pista</summary>
            <p>$\text{CV} = \text{ee}/\hat{t}$. Los dos objetos ya existen en la sesión: <code>est</code> (módulo 9)
              y <code>disL</code> (ejercicio 3). La explicación está en qué tan proporcional es cada $y$ al tamaño
              de la empresa.</p>
          </details>
          <details class="ejercicio-solucion">
            <summary>Solución</summary>
            <pre><code class="language-r">⟦R19⟧</code></pre>
            <p>CV del 2,6 % para el PPT contra 4,8 % del estratificado clásico. Los ingresos siguen al número de
              empleados de cerca, así que los cocientes $y_k/\psi_k$ del PPT casi no varían — la condición exacta
              bajo la que Hansen–Hurwitz brilla. No son la misma variable, y por eso la comparación es de
              estrategias, no un experimento controlado; el capítulo 6 la hará en igualdad de condiciones.</p>
          </details>
        </div>
      </div>

      <div class="note">
        <p><strong>Hacia el capítulo 5.</strong> Este capítulo partió la población en grupos para meterlos
          <em>todos</em> en la muestra con cuota garantizada. El siguiente hace lo contrario: parte la población en
          grupos y sortea <em>cuáles</em> grupos entran completos. Estratos y conglomerados son la misma cuchilla
          con el filo al revés — y las consecuencias sobre la varianza tienen el signo opuesto.</p>
