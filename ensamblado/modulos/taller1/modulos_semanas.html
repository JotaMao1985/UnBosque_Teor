            <p>El $n_0$ sin corregir es 854; la corrección por población finita lo baja a 730, un ahorro de 124 revisiones que sale solo de saber que la población es finita. Y el redondeo va <strong>hacia arriba</strong>: 729,5 se convierte en 730, nunca en 729, porque quedarse corto incumple el margen prometido.</p>
            <p style="margin-bottom:0;">Lo que hay que decirle a quien encarga el estudio no es «no se puede». Es: <em>con 500 el margen es de 3,7 puntos en vez de 3; si eso basta para la decisión que va a tomar, adelante; si necesita distinguir dos proporciones separadas por menos de 4 puntos, no basta, y hay que conseguir las 730 o cambiar la pregunta</em>. Un tamaño de muestra es una negociación, y se negocia con estas dos cifras.</p>
          </div>
        </div>

            <p style="margin:0;">El diseño solo puede producir $k = 10$ muestras y todas son igual de probables: la varianza real es simplemente la varianza de esas 10 medias. No hay que simular nada y no hace falta ninguna fórmula de varianza.</p>

            <p>Las diez medias posibles caben entre 168,45 y 168,78 cm, alrededor de los 168,616 de la población: cada muestra recorre el rango entero de estaturas —una de cada diez personas ordenadas— y por eso ninguna puede salir sesgada hacia los altos ni hacia los bajos. Es, de hecho, un estratificado disfrazado.</p>
            <p>Un efecto de diseño de <strong>0,0187</strong> significa que este sistemático tiene menos del 2 % de la varianza del MAS: haría falta un MAS unas <strong>53</strong> veces más grande para igualarlo, y no cabe, porque la población entera son 2 000 personas.</p>
            <p style="margin-bottom:0;"><strong>Sí lo usaría, con una condición:</strong> que el orden del marco sea el que digo que es. Toda la ganancia viene de ahí. Si el archivo llegara ordenado por algo con un ciclo que coincidiera con el salto —el caso del módulo 5— el mismo diseño, con el mismo $k$ y el mismo $n$, pasaría a ser una catástrofe. Y en los dos casos la fórmula del MAS declararía lo mismo, que es justo lo que la hace peligrosa.</p>
