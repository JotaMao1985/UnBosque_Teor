      <h3>1 · El total expandido con $n$ en vez de con $N$</h3>

      <p>El estimador del total es $\hat t = N\bar y$: cada persona de la muestra representa a $N/n$ personas de la
        población. Escribir $n\bar y$ devuelve la suma de la propia muestra, que no estima nada. Aquí da
        <strong>33 788</strong> cuando el total verdadero es <strong>337 232</strong>: exactamente
        <strong>10</strong> veces menos, que es $N/n$.</p>

      <p>Lo que lo hace invisible es que 33 788 <em>parece</em> un número: no es negativo, no es infinito, no rompe
        nada. La pregunta que lo caza: <strong>¿por qué multiplico por esto y no por lo otro?</strong> Si la respuesta
        no es «porque cada unidad observada representa a tantas», el factor está mal.</p>

      <h3>2 · El error estándar sin la corrección por población finita</h3>

      <p>Sin reemplazo, la varianza lleva el factor $(1 - n/N)$. Con $n/N = 0{,}1$ el fpc vale 0,9 y omitirlo lleva el
        error estándar de <strong>0,7429</strong> a <strong>0,7831</strong>: un <strong>5,41 %</strong> de más.</p>

      <p>Fíjese en la <em>dirección</em>, porque es la parte que casi nadie recuerda: olvidar el fpc <strong>infla</strong>
        el error estándar. Quien lo olvida se declara menos preciso de lo que es, no más. Es un error conservador
        —lo cual no lo convierte en aceptable: un intervalo más ancho de lo debido también es un intervalo mal
        calculado—.</p>

      <h3>3 · <code>qnorm(0.95)</code> en un intervalo bilateral del 95 %</h3>

      <p>Un intervalo de dos colas al 95 % deja 2,5 % en cada extremo: el cuantil es $z_{0{,}975} = 1{,}96$, no

        2,444— y su cobertura real cae al <strong>90 %</strong>.</p>

      <p>Es de los más difíciles de ver, porque el resultado <em>mejora</em>: un intervalo más estrecho se lee como

      <h3>5 · La varianza de una proporción, con dos atajos que se compensan</h3>

      <p>Para una proporción, Lohr escribe $\hat V(\hat p) = (1 - n/N)\,\hat p(1-\hat p)/(n-1)$. Hay dos atajos
        habituales: olvidar el fpc y dividir entre $n$ en vez de entre $n-1$. Por separado valen
        <strong>+1,02 %</strong> y <strong>−0,50 %</strong>; <strong>juntos, +0,51 %</strong>.</p>

      <p>Y ahí está la trampa: <strong>se compensan parcialmente</strong>. El resultado combinado se aleja menos del
        correcto que uno solo de los dos errores, así que nada delata que hay dos. Con $n$ grande la diferencia es
        pequeña; con $n$ pequeño, el $n-1$ pesa y deja de serlo.</p>

      <h3>7 · La varianza de un sistemático calculada como si fuera un MAS</h3>

      <p>Es el peor de los diez, con diferencia. El marco alterna mujer, hombre, mujer, hombre… y el salto $k = 10$ es
        par, así que toda muestra cae sobre el mismo sexo: cinco muestras de solo mujeres y cinco de solo hombres. Las
        diez medias posibles van de <strong>161,62</strong> a <strong>175,73</strong> cm y <em>ninguna</em> se acerca
        a los 168,62 de la población.</p>

      <p>Dentro de cada muestra, en cambio, las estaturas son homogéneas. Y como la fórmula del MAS solo mira la
        dispersión <em>interna</em>, declara un error estándar de <strong>0,61</strong> cm cuando el real es
        <strong>6,56</strong>: una varianza <strong>117</strong> veces optimista. El investigador ve un intervalo
        estrechísimo alrededor de un número equivocado, y nada en su salida se lo advierte.</p>

      <p>Aquí se puede comparar con la verdad porque el diseño solo tiene <strong>10</strong> muestras posibles y se
        recorren enteras. Con datos reales no se puede: por eso la varianza del sistemático <em>no es estimable</em>
        sin supuestos, y por eso decir «lo trato como un MAS» es un supuesto, no un resultado.</p>

      <h3>9 · <code>na.rm = TRUE</code> cambia la población sin decirlo</h3>

      <p>El formulario tenía un mínimo y no registró la estatura de quien mide menos de 155 cm:
        <strong>178</strong> personas, el <strong>8,9 %</strong> del marco. Con <code>na.rm = TRUE</code> la media
        sale, no hay aviso, y vale <strong>170,40</strong> cm en vez de 168,62: <strong>1,78</strong> cm de sesgo.</p>

      <p>Lo importante no es el número: es que esa media <em>ya no estima lo que se creía</em>. Estima la estatura
        media de quien mide 155 o más, que es otra población. Es la distinción del primer módulo del curso
        —población objetivo frente a población muestreada— reapareciendo dentro de un argumento de función.</p>

      <p>La corrección no es «quitar el <code>na.rm</code>» para que dé <code>NA</code>. Es
        <strong>declarar</strong> sobre qué población queda definida la estimación, y decidir a la vista de eso si

      <h3>10 · El mismo diseño en dos lenguajes no es el mismo diseño</h3>

      <p><code>sample()</code> de R muestrea <strong>sin</strong> reemplazo por defecto.
        <code>np.random.choice</code> de Python, <strong>con</strong> reemplazo. Quien traduce su código de un
        lenguaje al otro cambia el diseño sin tocar una sola idea, y no hay error ni aviso.</p>

      <p>Se nota en dos sitios, si se mira: aparecen personas repetidas —donde sin reemplazo hay
        <strong>200</strong> distintas, con reemplazo se esperan <strong>190,37</strong>— y la varianza sube, porque
        se pierde el fpc. La pregunta que lo caza: <strong>¿cuántas unidades distintas tengo de verdad?</strong> Una
        línea, <code>length(unique(...))</code>, y se acabó la duda.</p>
