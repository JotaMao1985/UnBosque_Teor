#
# SEMILLA (2026-11-10, tarea GD-D3). Son los hechos documentales de los módulos 1 y 4, tal como
# los declara la cabecera «PROCEDENCIA» de precalculo/genera_cap1.R, más los que el material
# afirma sin declarar de dónde salen. En una `pendiente`, `fuentes` solo dice dónde mirar.
