# Campos que el traductor de Zotero no trajo, o trajo mal, con la evidencia de cada uno.
# Las aplica precalculo/exporta_zotero.py. Lo correcto a la larga es llevar el dato a
# Zotero y borrar la enmienda: el guion avisa cuando una ya sobra.
