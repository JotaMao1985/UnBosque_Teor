    evidencia: "OPF del ejemplar: «© 2022 Sharon L. Lohr», publicado el 2021-09-21. Crossref da 2021."
    consulta: 2026-11-10
    nota: "Decisión de Javier del 2026-11-10: en todo el curso se cita el año de copyright, 2022."
deville1998unequal:
  author:
    valor:
